<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="760" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Streamlit — o'lchangan xulq, kurs aytmagan uch haqiqat</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">streamlit 1.62.0 · streamlit.testing.v1.AppTest · brauzersiz o'lchov</text>

  <!-- 1. rerun -->
  <rect x="24" y="74" width="450" height="196" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="249" y="98" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">HAR O'ZARO TA'SIR = TO'LIQ QAYTA ISHGA TUSHISH</text>
  <text x="44" y="124" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">amal                        sanagich</text>
  <line x1="44" y1="131" x2="454" y2="131" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="150" fill="#e2e8f0">boshlang'ich yuklash             1</text>
    <text x="44" y="170" fill="#4ade80">st.button bosildi                2</text>
    <text x="44" y="190" fill="#4ade80">st.slider o'zgardi               3</text>
    <text x="44" y="210" fill="#4ade80">st.text_input to'ldirildi        4</text>
  </g>
  <text x="44" y="236" fill="#4ade80" font-size="11.5" font-weight="700">KURS HAQ: skript har safar BOSHIDAN ishlaydi</text>
  <text x="44" y="256" fill="#94a3b8" font-size="11">shuning uchun oddiy o'zgaruvchi omon qolmaydi</text>

  <!-- 2. nested buttons -->
  <rect x="490" y="74" width="446" height="196" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="713" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">NESTED BUTTONS — HAMMASI YO'QOLADI</text>
  <text x="510" y="124" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">qadam            tugma  chiqarilgan matn</text>
  <line x1="510" y1="131" x2="916" y2="131" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="150" fill="#e2e8f0">1. yuklash          1   []</text>
    <text x="510" y="170" fill="#4ade80">2. 1-tugma          2   ['ochildi']</text>
    <text x="510" y="190" fill="#f87171">3. 2-tugma          1   []</text>
  </g>
  <text x="510" y="216" fill="#f87171" font-size="11.5" font-weight="700">"ikkinchi tugma bosildi" HECH QACHON ko'rinmaydi</text>
  <text x="510" y="236" fill="#fbbf24" font-size="11">sabab: st.button faqat O'SHA rerunda True</text>
  <text x="510" y="256" fill="#4ade80" font-size="11">yechim: if st.session_state.holat  (tugma emas)</text>

  <!-- 3. callback tartibi -->
  <rect x="24" y="286" width="450" height="180" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="249" y="310" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">on_click CALLBACK — RERUNDAN OLDIN</text>
  <text x="44" y="336" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">log ro'yxati, tugma bosilgandan keyin:</text>
  <rect x="44" y="346" width="410" height="30" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
  <text x="249" y="366" fill="#4ade80" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">SKRIPT -&gt; CALLBACK -&gt; SKRIPT</text>
  <text x="44" y="400" fill="#e2e8f0" font-size="11.5">1. tugma bosiladi</text>
  <text x="44" y="418" fill="#4ade80" font-size="11.5" font-weight="700">2. CALLBACK ishlaydi (session_state yangilanadi)</text>
  <text x="44" y="436" fill="#e2e8f0" font-size="11.5">3. keyin skript boshidan qayta ishlaydi</text>
  <text x="44" y="456" fill="#fbbf24" font-size="11" font-weight="700">natija: st.rerun() KERAK EMAS</text>

  <!-- 4. max_chars -->
  <rect x="490" y="286" width="446" height="180" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="713" y="310" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">max_chars SERVERDA ISHLAMAYDI</text>
  <text x="510" y="336" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">st.chat_input("...", max_chars=50)</text>
  <text x="510" y="358" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">yuborildi: 200 ta belgi</text>
  <line x1="510" y1="368" x2="916" y2="368" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="388" fill="#f87171">xato:              0</text>
    <text x="510" y="408" fill="#f87171">kesildimi:         yo'q</text>
    <text x="510" y="428" fill="#f87171">chiqish uzunligi:  215</text>
  </g>
  <text x="510" y="454" fill="#fbbf24" font-size="11" font-weight="700">max_chars = faqat brauzer (HTML maxlength). Python da tekshiring!</text>

  <!-- 5. DataFrame tezligi -->
  <rect x="24" y="482" width="450" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="249" y="506" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">"KATTA MA'LUMOTDA SEKIN" — RAD ETILDI</text>
  <text x="44" y="532" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">qatorlar      vaqt (median, isitishdan keyin)</text>
  <line x1="44" y1="539" x2="454" y2="539" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="558" fill="#4ade80">1 000           457.4 ms</text>
    <text x="44" y="578" fill="#4ade80">10 000          440.0 ms</text>
    <text x="44" y="598" fill="#4ade80">100 000         455.4 ms</text>
    <text x="44" y="618" fill="#4ade80">500 000         524.6 ms</text>
  </g>
  <text x="44" y="644" fill="#fbbf24" font-size="11" font-weight="700">ma'lumot 500x oshdi, vaqt atigi 1.15x — ~440 ms AppTest doimiy narxi</text>

  <!-- 6. jimgina xatolar -->
  <rect x="490" y="482" width="446" height="180" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="713" y="506" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">UCHTA JIMGINA XATO (xato bermaydi!)</text>
  <line x1="510" y1="518" x2="916" y2="518" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11">
    <text x="510" y="540" fill="#fbbf24">:purple[matn]</text>
    <text x="530" y="558" fill="#94a3b8">-&gt; xom matn ko'rinadi (violet bor, purple yo'q)</text>
    <text x="510" y="582" fill="#fbbf24">st.chat_message("system")</text>
    <text x="530" y="600" fill="#94a3b8">-&gt; avatar = ''  (bo'sh)</text>
    <text x="510" y="624" fill="#fbbf24">st.write("Natija:", None)</text>
    <text x="530" y="642" fill="#94a3b8">-&gt; 'Natija: `None`' foydalanuvchiga ko'rinadi</text>
  </g>

  <!-- xotira xaritasi -->
  <rect x="24" y="678" width="912" height="62" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="44" y="700" fill="#f1f5f9" font-size="12.5" font-weight="700">XOTIRA XARITASI:</text>
  <text x="180" y="700" fill="#f87171" font-size="11.5" font-family="Consolas, monospace">o'zgaruvchi = 1 rerun</text>
  <text x="360" y="700" fill="#fbbf24" font-size="11.5" font-family="Consolas, monospace">session_state = 1 foydalanuvchi</text>
  <text x="600" y="700" fill="#38bdf8" font-size="11.5" font-family="Consolas, monospace">cache_data = hamma</text>
  <text x="780" y="700" fill="#4ade80" font-size="11.5" font-family="Consolas, monospace">cache_resource = model</text>
  <text x="44" y="724" fill="#94a3b8" font-size="11">session_state havola saqlaydi (nusxa emas) · brauzer yopilsa hammasi yo'qoladi · model uchun har doim cache_resource</text>
</svg>
