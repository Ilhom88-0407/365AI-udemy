<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="400" fill="#0f172a" rx="14"/>
  <text x="440" y="36" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Uchta rol — few-shot o'rganishning amaliy shakli</text>

  <!-- system -->
  <rect x="30" y="64" width="820" height="52" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="88" fill="#fde68a" font-size="14" font-weight="700">🔧 system</text>
  <text x="60" y="107" fill="#fcd34d" font-size="11">QOIDA</text>
  <text x="180" y="88" fill="#fef3c7" font-size="12.5">"You will be provided with a block of text, and your task is to</text>
  <text x="180" y="106" fill="#fef3c7" font-size="12.5">extract a list of keywords from it."</text>

  <!-- example 1 -->
  <rect x="30" y="128" width="404" height="106" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="52" y="150" fill="#e0f2fe" font-size="13" font-weight="700">👤 user</text>
  <text x="52" y="167" fill="#bae6fd" font-size="11">"A flying saucer landed near the guest</text>
  <text x="52" y="182" fill="#bae6fd" font-size="11">house in Roswell in 1947..."</text>
  <line x1="52" y1="192" x2="412" y2="192" stroke="#075985"/>
  <text x="52" y="210" fill="#e0f2fe" font-size="13" font-weight="700">🤖 assistant</text>
  <text x="52" y="226" fill="#7dd3fc" font-size="11">"flying saucer, guest house, Roswell, 1947"</text>
  <text x="232" y="145" fill="#38bdf8" font-size="10.5" text-anchor="end">1-MISOL</text>

  <!-- example 2 -->
  <rect x="446" y="128" width="404" height="106" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="468" y="150" fill="#e0f2fe" font-size="13" font-weight="700">👤 user</text>
  <text x="468" y="167" fill="#bae6fd" font-size="11">"Sri Lanka is an island country in</text>
  <text x="468" y="182" fill="#bae6fd" font-size="11">South Asia known for its tea..."</text>
  <line x1="468" y1="192" x2="828" y2="192" stroke="#075985"/>
  <text x="468" y="210" fill="#e0f2fe" font-size="13" font-weight="700">🤖 assistant</text>
  <text x="468" y="226" fill="#7dd3fc" font-size="11">"Sri Lanka, island country, South Asia, tea"</text>
  <text x="648" y="145" fill="#38bdf8" font-size="10.5" text-anchor="end">2-MISOL</text>

  <!-- real query -->
  <rect x="30" y="246" width="820" height="46" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="60" y="270" fill="#dcfce7" font-size="13.5" font-weight="700">👤 user  (HAQIQIY SO'ROV)</text>
  <text x="300" y="270" fill="#bbf7d0" font-size="12.5">"Uzbekistan is a country in Central Asia famous for Samarkand..."</text>
  <text x="60" y="286" fill="#4ade80" font-size="11">→ model NAQSHNI tushunadi va shu formatda javob beradi</text>

  <!-- measured -->
  <rect x="30" y="304" width="820" height="84" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.6"/>
  <text x="440" y="325" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">⚠️ O'LCHANGAN — FEW-SHOT MIQYOS TALAB QILADI</text>
  <text x="60" y="348" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">flan-t5-small   77 M   →  'tea, island, tea'                                 2 ta</text>
  <text x="60" y="366" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">flan-t5-base   248 M   →  'country, island, country, tea, beaches, temples'   5 ta</text>
  <text x="60" y="382" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">GPT-3          175 B   →  to'liq ishlaydi        (29-modul: "few-shot GPT-3 bilan keldi")</text>
</svg>
