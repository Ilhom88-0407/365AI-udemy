<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
  </defs>
  <rect width="940" height="560" fill="#0f172a" rx="14"/>
  <text x="470" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Graf komponentlari va ikkita jim xato</text>
  <text x="470" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">START = '__start__' · END = '__end__' — oddiy satrlar, sehrli obyekt emas</text>

  <!-- graph -->
  <rect x="20" y="74" width="900" height="146" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="42" y="98" fill="#bae6fd" font-size="14" font-weight="700">Kursning shartli grafi</text>

  <rect x="42" y="112" width="112" height="44" rx="9" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="98" y="140" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">__start__</text>
  <path d="M158 134 L188 134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c1)"/>

  <rect x="196" y="112" width="146" height="44" rx="9" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="269" y="132" fill="#f3e8ff" font-size="12.5" font-weight="700" text-anchor="middle">ask_question</text>
  <text x="269" y="148" fill="#f87171" font-size="10.5" text-anchor="middle">💥 input() — bloklaydi</text>
  <path d="M346 134 L376 134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c1)"/>

  <rect x="384" y="112" width="130" height="44" rx="9" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="449" y="132" fill="#f3e8ff" font-size="12.5" font-weight="700" text-anchor="middle">chatbot</text>
  <text x="449" y="148" fill="#d8b4fe" font-size="10.5" text-anchor="middle">LLM chaqiradi</text>
  <path d="M518 134 L548 134" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c1)"/>

  <rect x="556" y="112" width="182" height="44" rx="9" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="647" y="132" fill="#f3e8ff" font-size="12.5" font-weight="700" text-anchor="middle">ask_another_question</text>
  <text x="647" y="148" fill="#d8b4fe" font-size="10.5" text-anchor="middle">yes / no</text>

  <path d="M742 128 L790 128" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#c2)"/>
  <rect x="798" y="112" width="104" height="44" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="850" y="140" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">__end__</text>

  <path d="M647 160 L647 186 L269 186 L269 160" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="5 3" marker-end="url(#c2)"/>
  <text x="458" y="204" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">⭐ SHARTLI QIRRA — "yes" bo'lsa orqaga (nuqtali chiziq)</text>

  <!-- bug 1 -->
  <rect x="20" y="236" width="446" height="152" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="243" y="260" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">💥 JIM XATO 1 — reducer yo'q</text>
  <text x="40" y="284" fill="#fca5a5" font-size="11.5" font-family="Consolas, monospace">messages: Sequence[BaseMessage]</text>
  <text x="40" y="306" fill="#fca5a5" font-size="11.5">kirish : [('human', 'Could you tell me a grook...')]</text>
  <text x="40" y="326" fill="#fca5a5" font-size="11.5">chiqish: [('ai',    'Piet Hein (1905-1996)...')]</text>
  <text x="40" y="348" fill="#f87171" font-size="12.5" font-weight="700">SAVOL YO'QOLDI — xato CHIQMAYDI</text>
  <text x="40" y="372" fill="#4ade80" font-size="11.5" font-family="Consolas, monospace">✅ Annotated[Sequence[...], add_messages]</text>

  <!-- bug 2 -->
  <rect x="482" y="236" width="438" height="152" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="701" y="260" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">💥 JIM XATO 2 — rekursiya chegarasi</text>
  <text x="502" y="284" fill="#fca5a5" font-size="11.5">routing hech qachon "__end__" qaytarmasa:</text>
  <text x="502" y="306" fill="#fca5a5" font-size="11.5" font-family="Consolas, monospace">GraphRecursionError: limit of 10007</text>
  <text x="502" y="326" fill="#f87171" font-size="11.5" font-weight="700">→ sikl ~5000 marta aylandi (o'lchandi)</text>
  <text x="502" y="348" fill="#fbbf24" font-size="11.5">💰 gpt-4o bilan ≈ $6.25 · ⏱ ≈ 83 daqiqa</text>
  <text x="502" y="372" fill="#4ade80" font-size="11.5" font-family="Consolas, monospace">✅ invoke(s, {"recursion_limit": 30})</text>

  <!-- state flow -->
  <rect x="20" y="404" width="900" height="136" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="470" y="428" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">Tugun FAQAT o'zgarishni qaytaradi — qolganini REDUCER hal qiladi</text>

  <rect x="42" y="442" width="196" height="80" rx="9" fill="#7f1d1d" stroke="#f87171"/>
  <text x="140" y="464" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">REDUCER YO'Q</text>
  <text x="140" y="484" fill="#fca5a5" font-size="11" text-anchor="middle" font-family="Consolas, monospace">eski = yangi</text>
  <text x="140" y="502" fill="#f87171" font-size="11" text-anchor="middle">ALMASHTIRILADI</text>
  <text x="140" y="516" fill="#fca5a5" font-size="10" text-anchor="middle">o'lchandi: 1 xabar</text>

  <rect x="258" y="442" width="196" height="80" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="356" y="464" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">⭐ add_messages</text>
  <text x="356" y="484" fill="#86efac" font-size="11" text-anchor="middle" font-family="Consolas, monospace">eski + yangi</text>
  <text x="356" y="502" fill="#4ade80" font-size="11" text-anchor="middle">QO'SHILADI</text>
  <text x="356" y="516" fill="#86efac" font-size="10" text-anchor="middle">o'lchandi: 3 xabar</text>

  <rect x="474" y="442" width="196" height="80" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="572" y="464" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">⭐ operator.add</text>
  <text x="572" y="484" fill="#86efac" font-size="11" text-anchor="middle" font-family="Consolas, monospace">Annotated[list, operator.add]</text>
  <text x="572" y="504" fill="#86efac" font-size="10.5" text-anchor="middle">parallel tugunlar uchun SHART</text>
  <text x="572" y="518" fill="#fbbf24" font-size="10" text-anchor="middle">usiz InvalidUpdateError</text>

  <rect x="690" y="442" width="230" height="80" rx="9" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="805" y="464" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">⚠️ compile() TEKSHIRMAYDI</text>
  <text x="805" y="484" fill="#fcd34d" font-size="10.5" text-anchor="middle">reducer yo'qligini</text>
  <text x="805" y="500" fill="#fcd34d" font-size="10.5" text-anchor="middle">yetib bo'lmas tugunni</text>
  <text x="805" y="516" fill="#fcd34d" font-size="10.5" text-anchor="middle">END ga yo'l yo'qligini</text>
</svg>
