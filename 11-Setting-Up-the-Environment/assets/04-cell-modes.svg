<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Jupyter yacheykasi — ikki rejim</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Kursor miltillayaptimi? — bu sizning eng ishonchli ko'rsatkichingiz</text>

  <!-- COMMAND MODE -->
  <rect x="24" y="80" width="440" height="184" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="24" y="80" width="440" height="40" rx="12" fill="#2563EB"/>
  <rect x="24" y="106" width="440" height="14" fill="#2563EB"/>
  <text x="244" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">COMMAND MODE</text>

  <text x="244" y="142" text-anchor="middle" font-size="12" fill="#334155">Notebook'ni BUTUN holda boshqarish</text>
  <rect x="48" y="152" width="392" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="244" y="177" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1D4ED8">x = [1, 2, 3, 4]</text>
  <text x="244" y="212" text-anchor="middle" font-size="12" fill="#64748B">❌ Kursor MILTILLAMAYDI</text>
  <rect x="120" y="224" width="248" height="26" rx="7" fill="#DBEAFE"/>
  <text x="244" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Kirish: ESC bosing</text>

  <!-- EDIT MODE -->
  <rect x="496" y="80" width="440" height="184" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="496" y="80" width="440" height="40" rx="12" fill="#059669"/>
  <rect x="496" y="106" width="440" height="14" fill="#059669"/>
  <text x="716" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">EDIT MODE</text>

  <text x="716" y="142" text-anchor="middle" font-size="12" fill="#334155">Matn yoki kod YOZISH va TAHRIRLASH</text>
  <rect x="520" y="152" width="392" height="40" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="716" y="177" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#047857">x = [1, 2, 3, 4]<tspan fill="#059669" font-weight="700">▌</tspan></text>
  <text x="716" y="212" text-anchor="middle" font-size="12" fill="#64748B">✅ Kursor MILTILLAYDI</text>
  <rect x="592" y="224" width="248" height="26" rx="7" fill="#D1FAE5"/>
  <text x="716" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Kirish: ENTER yoki katakka bosing</text>

  <path d="M470,160 L490,160" stroke="#94A3B8" stroke-width="2" marker-end="url(#am)"/>
  <text x="480" y="152" text-anchor="middle" font-size="9" fill="#64748B">Enter</text>
  <path d="M490,196 L470,196" stroke="#94A3B8" stroke-width="2" marker-end="url(#am)"/>
  <text x="480" y="212" text-anchor="middle" font-size="9" fill="#64748B">Esc</text>

  <!-- RUN OPTIONS -->
  <text x="480" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Yacheykani ishga tushirishning 4 yo'li</text>

  <g>
    <rect x="24" y="304" width="220" height="86" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="46" y="318" width="176" height="26" rx="6" fill="#EDE9FE"/>
    <text x="134" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Ctrl + Enter</text>
    <text x="134" y="360" text-anchor="middle" font-size="11" fill="#334155">Bajaradi va SHU YERDA qoladi</text>
    <text x="134" y="378" text-anchor="middle" font-size="10.5" fill="#64748B">→ command mode ga qaytadi</text>

    <rect x="256" y="304" width="220" height="86" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="278" y="318" width="176" height="26" rx="6" fill="#EDE9FE"/>
    <text x="366" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Shift + Enter</text>
    <text x="366" y="360" text-anchor="middle" font-size="11" fill="#334155">Bajaradi va KEYINGIGA o'tadi</text>
    <text x="366" y="378" text-anchor="middle" font-size="10.5" fill="#64748B">keyingisi yo'q bo'lsa — yaratadi</text>

    <rect x="488" y="304" width="220" height="86" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="510" y="318" width="176" height="26" rx="6" fill="#EDE9FE"/>
    <text x="598" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Alt + Enter</text>
    <text x="598" y="360" text-anchor="middle" font-size="11" fill="#334155">Bajaradi + PASTGA yangi qo'shadi</text>
    <text x="598" y="378" text-anchor="middle" font-size="10.5" fill="#64748B">va edit mode da qoldiradi</text>

    <rect x="720" y="304" width="216" height="86" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="742" y="318" width="172" height="26" rx="6" fill="#F1F5F9"/>
    <text x="828" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">▶ tugmasi</text>
    <text x="828" y="360" text-anchor="middle" font-size="11" fill="#334155">Yuqoridagi menyudan</text>
    <text x="828" y="378" text-anchor="middle" font-size="10.5" fill="#64748B">= Shift + Enter bilan bir xil</text>
  </g>

  <rect x="24" y="404" width="912" height="50" rx="11" fill="#0F172A"/>
  <text x="480" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FBBF24">Input [1] va Output [1] — bir xil raqamlilar DOIM guruhlangan</text>
  <text x="480" y="443" text-anchor="middle" font-size="11.5" fill="#CBD5E1">Output'ni to'g'ridan-to'g'ri o'zgartirib bo'lmaydi — faqat kodni o'zgartirib qayta ishga tushirasiz. Uzoq hisobda [*] chiqadi.</text>
</svg>
