<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="940" height="470" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Xato xabarini o'qish</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#475569">Xato — bu muvaffaqiyatsizlik emas, bu MASLAHAT</text>

  <!-- terminal -->
  <rect x="24" y="78" width="560" height="216" rx="12" fill="#0F172A"/>
  <rect x="24" y="78" width="560" height="30" rx="12" fill="#1E293B"/>
  <rect x="24" y="96" width="560" height="12" fill="#1E293B"/>
  <circle cx="46" cy="93" r="5" fill="#EF4444"/><circle cx="62" cy="93" r="5" fill="#F59E0B"/><circle cx="78" cy="93" r="5" fill="#22C55E"/>
  <text x="100" y="98" font-size="11" font-family="Consolas, monospace" fill="#94A3B8">Jupyter — output</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12">
    <text x="44" y="132" fill="#F87171">---------------------------------------------------</text>
    <text x="44" y="152" fill="#F87171">NameError      Traceback (most recent call last)</text>
    <text x="44" y="176" fill="#94A3B8">Cell In[3], line 1</text>
    <text x="44" y="196" fill="#E2E8F0">----&gt; 1 print(y)</text>
    <text x="44" y="228" fill="#CBD5E1">      2</text>
    <text x="44" y="256" fill="#FCA5A5" font-weight="700">NameError: name 'y' is not defined</text>
  </g>
  <rect x="40" y="240" width="440" height="26" rx="6" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="500" y="258" font-size="11" font-weight="700" fill="#FBBF24">← ENG MUHIM</text>

  <!-- key rule -->
  <rect x="604" y="78" width="312" height="216" rx="12" fill="#FEF9C3" stroke="#FDE68A" stroke-width="2"/>
  <text x="760" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#854D0E">🔑 OLTIN QOIDA</text>
  <text x="760" y="136" text-anchor="middle" font-size="12.5" fill="#713F12">Ko'p hollarda xato xabarining</text>
  <text x="760" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#854D0E">OXIRGI QATORI</text>
  <text x="760" y="180" text-anchor="middle" font-size="12.5" fill="#713F12">muammo qayerdan kelayotganini</text>
  <text x="760" y="200" text-anchor="middle" font-size="12.5" fill="#713F12">ko'rsatadi</text>

  <rect x="628" y="218" width="264" height="60" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="760" y="240" text-anchor="middle" font-size="11.5" fill="#334155">Interpretator kodni HARF-HARF va</text>
  <text x="760" y="258" text-anchor="middle" font-size="11.5" fill="#334155">QATOR-QATOR o'qiydi</text>
  <text x="760" y="274" text-anchor="middle" font-size="10.5" fill="#92400E">→ xatogacha bo'lgan hamma narsa to'g'ri edi</text>

  <!-- two fixes -->
  <text x="470" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Bu misolda ikki xil yechim bor</text>

  <rect x="24" y="334" width="440" height="60" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="46" y="356" font-size="12.5" font-weight="700" fill="#047857">1 · y ga qiymat berish</text>
  <text x="46" y="378" font-size="12" font-family="Consolas, monospace" fill="#065F46">y = 8  →  print(y)</text>

  <rect x="496" y="334" width="420" height="60" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="518" y="356" font-size="12.5" font-weight="700" fill="#047857">2 · to'g'ri o'zgaruvchiga murojaat qilish</text>
  <text x="518" y="378" font-size="12" font-family="Consolas, monospace" fill="#065F46">print(x)   # x allaqachon mavjud</text>

  <!-- workflow -->
  <rect x="24" y="406" width="892" height="50" rx="11" fill="#0F172A"/>
  <text x="470" y="426" text-anchor="middle" font-size="12.5" font-weight="700" fill="#93C5FD">Xatoga duch kelganda: OXIRGI QATORNI o'qing → tushuning → tuzating → yana ishga tushiring</text>
  <text x="470" y="445" text-anchor="middle" font-size="11.5" fill="#CBD5E1">Yechilmasa — oxirgi qatorni Google'ga qo'ying. Bu — ishdagi normal amaliyot, uyat emas.</text>
</svg>
