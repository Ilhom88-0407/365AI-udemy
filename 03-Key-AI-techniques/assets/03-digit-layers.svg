<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="980" height="340" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Har bir yashirin qatlam nimani o'rganadi</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#475569">"3" raqamini tanish: oddiydan murakkabga</text>

  <!-- input -->
  <rect x="24" y="86" width="152" height="176" rx="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">INPUT</text>
  <text x="100" y="186" text-anchor="middle" font-size="56" fill="#0F172A">3</text>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#64748B">28 × 28 = 784 px</text>
  <text x="100" y="242" text-anchor="middle" font-size="11" fill="#64748B">har biri = 1 node</text>

  <line x1="184" y1="174" x2="204" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ad)"/>

  <!-- hidden 1 -->
  <rect x="208" y="86" width="176" height="176" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="296" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">HIDDEN 1</text>
  <g stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240,140 L272,140"/>
    <path d="M292,132 Q312,140 292,152"/>
    <path d="M240,172 L272,190"/>
    <path d="M292,168 Q308,182 292,196"/>
  </g>
  <text x="296" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Chekka va egri chiziqlar</text>
  <text x="296" y="246" text-anchor="middle" font-size="11" fill="#64748B">yumaloq tepa · egik past</text>

  <line x1="392" y1="174" x2="412" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ad)"/>

  <!-- hidden 2 -->
  <rect x="416" y="86" width="176" height="176" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="504" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">HIDDEN 2</text>
  <g stroke="#7C3AED" stroke-width="3" fill="none">
    <circle cx="462" cy="152" r="18"/>
    <path d="M508,134 Q536,152 508,170"/>
    <path d="M462,182 L462,206 M448,194 L476,194"/>
    <path d="M508,182 Q536,200 508,218"/>
  </g>
  <text x="504" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Halqa va kesishmalar</text>
  <text x="504" y="246" text-anchor="middle" font-size="11" fill="#64748B">murakkabroq shakllar</text>

  <line x1="600" y1="174" x2="620" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ad)"/>

  <!-- hidden 3 -->
  <rect x="624" y="86" width="176" height="176" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="712" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">HIDDEN 3</text>
  <path d="M686,140 Q736,132 736,158 Q736,176 706,176 Q736,176 736,198 Q736,224 686,214"
        fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <text x="712" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Umumiy shakl</text>
  <text x="712" y="256" text-anchor="middle" font-size="11" fill="#64748B">"bu 3 ga o'xshaydi"</text>

  <line x1="808" y1="174" x2="828" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ad)"/>

  <!-- output -->
  <rect x="832" y="86" width="124" height="176" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="894" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">OUTPUT</text>
  <text x="894" y="182" text-anchor="middle" font-size="44" font-weight="700" fill="#047857">3</text>
  <text x="894" y="216" text-anchor="middle" font-size="11.5" fill="#065F46">qaror qabul qilindi</text>
  <text x="894" y="240" text-anchor="middle" font-size="11" fill="#64748B">10 ta variantdan</text>

  <rect x="24" y="282" width="932" height="42" rx="10" fill="#0F172A"/>
  <text x="490" y="309" text-anchor="middle" font-size="12.5" fill="#93C5FD">Hech kim bu bosqichlarni dasturlashtirmagan — model ularni minglab takrorlash orqali O'ZI shakllantirgan</text>
</svg>
