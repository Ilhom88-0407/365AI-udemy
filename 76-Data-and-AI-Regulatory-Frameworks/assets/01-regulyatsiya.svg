<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="780" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Bizning ilova EU AI Act bo'yicha YUQORI XAVF — 8 talabdan 2 tasi bajarilgan</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">EU · AQSh · Xitoy · Afrika — va har kamchilik oldingi modulda o'lchangan</text>

  <!-- 1. AI Act -->
  <rect x="24" y="74" width="450" height="228" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="249" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">YUQORI XAVF — 2/8</text>
  <line x1="44" y1="110" x2="454" y2="110" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11">
    <text x="44" y="132" fill="#4ade80">OK  xavf boshqaruv tizimi</text>
    <text x="330" y="132" fill="#64748b">[73]</text>
    <text x="44" y="150" fill="#f87171">BAD bias auditi</text>
    <text x="330" y="150" fill="#64748b">[71]</text>
    <text x="44" y="168" fill="#f87171">BAD texnik hujjatlar</text>
    <text x="330" y="168" fill="#64748b">[72: 1/8]</text>
    <text x="44" y="186" fill="#4ade80">OK  avtomatik jurnal</text>
    <text x="330" y="186" fill="#64748b">[73]</text>
    <text x="44" y="204" fill="#f87171">BAD foydalanuvchiga ko'rsatma</text>
    <text x="44" y="222" fill="#f87171">BAD INSON NAZORATI</text>
    <text x="330" y="222" fill="#64748b">[73]</text>
    <text x="44" y="240" fill="#f87171">BAD aniqlik / mustahkamlik</text>
    <text x="330" y="240" fill="#64748b">[72: 37.5%]</text>
    <text x="44" y="258" fill="#f87171">BAD muvofiqlik baholovi</text>
  </g>
  <line x1="44" y1="270" x2="454" y2="270" stroke="#475569" stroke-width="1"/>
  <text x="44" y="292" fill="#fca5a5" font-size="12" font-weight="700">EU da ISHGA TUSHIRIB BO'LMAYDI. GDPR: 1/8.</text>

  <!-- 2. Cambridge Analytica -->
  <rect x="486" y="74" width="450" height="228" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="711" y="98" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">270 000 ROZILIK -&gt; 87 MLN TA'SIR</text>
  <text x="506" y="124" fill="#94a3b8" font-size="11">Cambridge Analytica arifmetikasi:</text>
  <line x1="506" y1="132" x2="916" y2="132" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="506" y="156" fill="#94a3b8">270,000 x 320 do'st</text>
    <text x="800" y="156" fill="#f87171">86.4 mln</text>
    <text x="506" y="178" fill="#94a3b8">kuchaytirish</text>
    <text x="800" y="178" fill="#f87171">~322x</text>
    <text x="506" y="202" fill="#94a3b8">eng past taxmin (50 do'st)</text>
    <text x="800" y="202" fill="#fbbf24">13.5 mln</text>
  </g>
  <line x1="506" y1="216" x2="916" y2="216" stroke="#475569" stroke-width="1"/>
  <text x="506" y="238" fill="#fde68a" font-size="11.5" font-weight="700">270k rozilik berdi. 87 mln BERMADI.</text>
  <text x="506" y="262" fill="#94a3b8" font-size="11">70-modulda ham shunday edi: ism o'chirilgan,</text>
  <text x="506" y="280" fill="#94a3b8" font-size="11">159/200 baribir aniqlandi. Ma'lumot BOG'LANGAN.</text>

  <!-- 3. ismlar -->
  <rect x="24" y="322" width="450" height="212" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="249" y="346" fill="#bfdbfe" font-size="14" font-weight="700" text-anchor="middle">"G'ARB MA'LUMOTIDA QURILGAN" — O'LCHANDI</text>
  <text x="44" y="368" fill="#94a3b8" font-size="11">Ism -&gt; token (o200k_base), mintaqa bo'yicha o'rtacha:</text>
  <line x1="44" y1="376" x2="454" y2="376" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="398" fill="#94a3b8">AQSh/Britaniya</text>
    <text x="260" y="398" fill="#4ade80">2.00</text>
    <text x="330" y="398" fill="#64748b">min=max=2</text>
    <text x="44" y="418" fill="#94a3b8">Janubiy Afrika</text>
    <text x="260" y="418" fill="#fbbf24">5.00</text>
    <text x="330" y="418" fill="#f87171">2.50x</text>
    <text x="44" y="438" fill="#94a3b8">Nigeriya</text>
    <text x="260" y="438" fill="#f87171">6.17</text>
    <text x="330" y="438" fill="#f87171">3.08x</text>
    <text x="44" y="458" fill="#94a3b8">O'zbekiston</text>
    <text x="260" y="458" fill="#f87171">6.67</text>
    <text x="330" y="458" fill="#f87171">3.33x</text>
  </g>
  <rect x="260" y="390" width="16" height="9" fill="#4ade80" opacity="0.5"/>
  <rect x="260" y="450" width="53" height="9" fill="#f87171" opacity="0.5"/>
  <line x1="44" y1="472" x2="454" y2="472" stroke="#475569" stroke-width="1"/>
  <text x="44" y="494" fill="#bfdbfe" font-size="11.5" font-weight="700">Har AQSh/Britaniya ismi AYNAN 2 token —</text>
  <text x="44" y="512" fill="#bfdbfe" font-size="11.5" font-weight="700">tokenizator ularning har birini "biladi".</text>

  <!-- 4. yurisdiksiya -->
  <rect x="486" y="322" width="450" height="212" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="711" y="346" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">"GDPR YETARLI" — ATIGI 60%</text>
  <text x="506" y="368" fill="#94a3b8" font-size="11">To'rt yurisdiksiya, 10 ta noyob talab:</text>
  <line x1="506" y1="376" x2="916" y2="376" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="506" y="398" fill="#94a3b8">EU dan boshlansa</text>
    <text x="790" y="398" fill="#4ade80">6/10 qoplandi</text>
    <text x="506" y="418" fill="#94a3b8">qolgan talablar</text>
    <text x="790" y="418" fill="#f87171">4 ta</text>
  </g>
  <text x="506" y="444" fill="#fbbf24" font-size="10.5">- ma'lumot tasnifi (Xitoy DSL)</text>
  <text x="506" y="460" fill="#fbbf24" font-size="10.5">- chegaradan o'tkazish ruxsati (Xitoy PIPL)</text>
  <text x="506" y="476" fill="#fbbf24" font-size="10.5">- nomzodga xabar (NY LL144)</text>
  <text x="506" y="492" fill="#fbbf24" font-size="10.5">- kirish (POPIA)</text>
  <text x="506" y="516" fill="#bbf7d0" font-size="11.5" font-weight="700">union — intersection EMAS (72-modul mantigi).</text>

  <!-- 5. strip -->
  <rect x="24" y="550" width="912" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="574" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">UCH REJIM — UCH XIL TALAB</text>
  <line x1="44" y1="584" x2="916" y2="584" stroke="#475569" stroke-width="1"/>
  <g font-size="11.5">
    <text x="70" y="608" fill="#cbd5e1" font-weight="700">EU</text>
    <text x="140" y="608" fill="#94a3b8">JARAYON talab qiladi</text>
    <text x="380" y="608" fill="#64748b">8 ta talab, xavf darajasi bo'yicha</text>
    <text x="70" y="630" fill="#cbd5e1" font-weight="700">AQSh</text>
    <text x="140" y="630" fill="#94a3b8">AUDIT talab qiladi</text>
    <text x="380" y="630" fill="#64748b">5 shtat -&gt; 10 talab (yamoq)</text>
    <text x="70" y="652" fill="#cbd5e1" font-weight="700">Xitoy</text>
    <text x="140" y="652" fill="#94a3b8">ARXITEKTURA talab qiladi</text>
    <text x="380" y="652" fill="#f87171">keyin tuzatish ENG QIMMAT (server ko'chirish)</text>
  </g>

  <!-- 6. rule -->
  <rect x="24" y="684" width="912" height="82" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="712" fill="#fde68a" font-size="15" font-weight="700" text-anchor="middle">REGULYATSIYA YANGI ISH TALAB QILMAYDI</text>
  <text x="480" y="736" fill="#94a3b8" font-size="12" text-anchor="middle">U 68-75-modullarda qilishimiz kerak bo'lgan ishni MAJBURIY qiladi.</text>
  <text x="480" y="756" fill="#86efac" font-size="11" text-anchor="middle">10 qadamdan 5 tasi — 7 kun ichida. Birinchi uchtasi hech qanday bog'liqliksiz.</text>
</svg>
