<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="880" height="470" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Uchta rol — uchta vazifa</text>
  <text x="440" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">messages = [{"role": ..., "content": ...}, ...]</text>

  <!-- system -->
  <rect x="26" y="76" width="270" height="200" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="161" y="104" fill="#f3e8ff" font-size="16" font-weight="700" text-anchor="middle">SYSTEM</text>
  <text x="161" y="124" fill="#d8b4fe" font-size="11.5" text-anchor="middle">modelni YO'NALTIRADI</text>
  <rect x="46" y="138" width="230" height="76" rx="7" fill="#6b21a8"/>
  <text x="60" y="158" fill="#f3e8ff" font-size="10.5" font-family="Consolas, monospace">"You are Marv, a chatbot</text>
  <text x="60" y="174" fill="#f3e8ff" font-size="10.5" font-family="Consolas, monospace"> that reluctantly answers</text>
  <text x="60" y="190" fill="#f3e8ff" font-size="10.5" font-family="Consolas, monospace"> questions with sarcastic</text>
  <text x="60" y="206" fill="#f3e8ff" font-size="10.5" font-family="Consolas, monospace"> responses."</text>
  <text x="46" y="234" fill="#d8b4fe" font-size="11">• shaxsiyat (persona)</text>
  <text x="46" y="252" fill="#d8b4fe" font-size="11">• chiqish formati</text>
  <text x="46" y="270" fill="#d8b4fe" font-size="11">• cheklovlar va qoidalar</text>

  <!-- user -->
  <rect x="306" y="76" width="270" height="200" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="441" y="104" fill="#bae6fd" font-size="16" font-weight="700" text-anchor="middle">USER</text>
  <text x="441" y="124" fill="#7dd3fc" font-size="11.5" text-anchor="middle">bu — SIZ</text>
  <rect x="326" y="138" width="230" height="76" rx="7" fill="#075985"/>
  <text x="340" y="158" fill="#e0f2fe" font-size="10.5" font-family="Consolas, monospace">"I've recently adopted</text>
  <text x="340" y="174" fill="#e0f2fe" font-size="10.5" font-family="Consolas, monospace"> a dog. Could you suggest</text>
  <text x="340" y="190" fill="#e0f2fe" font-size="10.5" font-family="Consolas, monospace"> some dog names?"</text>
  <text x="326" y="234" fill="#7dd3fc" font-size="11">• savol</text>
  <text x="326" y="252" fill="#7dd3fc" font-size="11">• topshiriq</text>
  <text x="326" y="270" fill="#7dd3fc" font-size="11">• qayta ishlanadigan matn</text>

  <!-- assistant -->
  <rect x="586" y="76" width="268" height="200" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="720" y="104" fill="#dcfce7" font-size="16" font-weight="700" text-anchor="middle">ASSISTANT</text>
  <text x="720" y="124" fill="#86efac" font-size="11.5" text-anchor="middle">MISOL javob</text>
  <rect x="606" y="138" width="228" height="76" rx="7" fill="#166534"/>
  <text x="620" y="158" fill="#dcfce7" font-size="10.5" font-family="Consolas, monospace">user: "extraordinary"</text>
  <text x="620" y="174" fill="#4ade80" font-size="10.5" font-family="Consolas, monospace">asst: "positive"   ← MISOL</text>
  <text x="620" y="192" fill="#dcfce7" font-size="10.5" font-family="Consolas, monospace">user: "all right"</text>
  <text x="620" y="208" fill="#4ade80" font-size="10.5" font-family="Consolas, monospace">asst: "neutral"    ← MISOL</text>
  <text x="606" y="234" fill="#86efac" font-size="11">• few-shot misollar</text>
  <text x="606" y="252" fill="#86efac" font-size="11">• yozish uslubi</text>
  <text x="606" y="270" fill="#86efac" font-size="11">• ⭐ modelning O'Z javobi ham</text>

  <path d="M440 286 L440 306" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#r1)"/>

  <rect x="120" y="314" width="640" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="440" y="336" fill="#cbd5e1" font-size="12.5" font-weight="700" text-anchor="middle">SISTEM XABARI BO'LMASA — model UMUMIY yordamchi bo'lib qoladi</text>
  <text x="440" y="356" fill="#94a3b8" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">"This new song blew my mind" → "That's great to hear! What's the song?"  (kutilgan: "positive")</text>

  <rect x="120" y="380" width="640" height="54" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="440" y="402" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">FEW-SHOT BILAN — model FORMATNI o'rganadi</text>
  <text x="440" y="422" fill="#86efac" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">"This new song blew my mind" → "positive"     ⭐ bitta so'z</text>

  <text x="440" y="456" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">💡 Assistant roli — modelni O'QITISH emas, unga FORMAT KO'RSATISH</text>
</svg>
