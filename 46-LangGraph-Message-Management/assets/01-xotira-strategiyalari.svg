<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="940" height="540" fill="#0f172a" rx="14"/>
  <text x="470" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Uch xotira strategiyasi — o'lchangan narx bilan</text>
  <text x="470" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">20 burilish · 1000 suhbat/kun · gpt-4o-mini · 🇺🇿 o'zbekcha ×1.88</text>

  <!-- 1 append -->
  <rect x="24" y="76" width="288" height="196" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
