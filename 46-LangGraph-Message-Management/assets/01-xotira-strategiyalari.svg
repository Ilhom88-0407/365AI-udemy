  <rect x="628" y="76" width="288" height="196" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="3"/>
  <text x="772" y="102" fill="#bbf7d0" font-size="15" font-weight="700" text-anchor="middle">③ ⭐ XULOSALASH</text>
