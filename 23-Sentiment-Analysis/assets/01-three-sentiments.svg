<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="420" fill="#f7f9fc"/>
  <text x="430" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a2b4c">Uchta sentiment</text>

  <!-- scale -->
  <defs>
    <linearGradient id="sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect x="80" y="60" width="700" height="18" rx="9" fill="url(#sc)"/>
  <text x="80" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">−1.0</text>
  <text x="430" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">0.0</text>
  <text x="780" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">+1.0</text>

  <!-- negative -->
  <rect x="30" y="118" width="256" height="256" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="158" y="164" text-anchor="middle" font-size="44">😞</text>
  <text x="158" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#991b1b">SALBIY</text>
  <line x1="56" y1="212" x2="260" y2="212" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="158" y="234" text-anchor="middle" font-size="13" fill="#7f1d1d">Salbiy hissiyot ifodasi</text>

  <rect x="52" y="248" width="212" height="66" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="158" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#b91c1c">"The smell was really bad</text>
  <text x="158" y="288" text-anchor="middle" font-size="12" font-style="italic" fill="#b91c1c">and it made me feel sick."</text>
  <text x="158" y="306" text-anchor="middle" font-size="11" fill="#dc2626">bad · sick</text>

  <text x="158" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">ball &lt; 0</text>
  <text x="158" y="362" text-anchor="middle" font-size="11" fill="#b91c1c">shikoyat · norozilik · g'azab</text>

  <!-- neutral -->
  <rect x="302" y="118" width="256" height="256" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="430" y="164" text-anchor="middle" font-size="44">😐</text>
  <text x="430" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">NEYTRAL</text>
  <line x1="328" y1="212" x2="532" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="234" text-anchor="middle" font-size="13" fill="#475569">Hissiyot YO'Q — sof fakt</text>

  <rect x="324" y="248" width="212" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="430" y="278" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">"It was raining."</text>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#64748b">hech qanday hissiy so'z yo'q</text>

  <text x="430" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ball ≈ 0</text>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#475569">fakt · xabar · ta'rif</text>

  <!-- positive -->
  <rect x="574" y="118" width="256" height="256" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="702" y="164" text-anchor="middle" font-size="44">😀</text>
  <text x="702" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">IJOBIY</text>
  <line x1="600" y1="212" x2="804" y2="212" stroke="#86efac" stroke-width="1.5"/>
  <text x="702" y="234" text-anchor="middle" font-size="13" fill="#14532d">Yoqtirish, zavq, ijobiy his</text>

  <rect x="596" y="248" width="212" height="66" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="702" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#15803d">"The music made me feel</text>
  <text x="702" y="288" text-anchor="middle" font-size="12" font-style="italic" fill="#15803d">really calm and relaxed."</text>
  <text x="702" y="306" text-anchor="middle" font-size="11" fill="#16a34a">calm · relaxed</text>

  <text x="702" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">ball &gt; 0</text>
  <text x="702" y="362" text-anchor="middle" font-size="11" fill="#15803d">maqtov · mamnunlik · quvonch</text>

  <rect x="30" y="386" width="800" height="26" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="430" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">SENTIMENT — bu MAVZU emas, HISSIYOT. Bir mavzuda uchala sentiment ham bo'lishi mumkin.</text>
</svg>
