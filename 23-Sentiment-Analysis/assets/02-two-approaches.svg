    <marker id="v" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
  </defs>
  <path d="M 380 92 L 220 122" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
