  <rect x="30" y="452" width="800" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="430" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">100 ta kitob sharhida: Transformer 95.2%  ·  VADER 72.3%  ·  TextBlob 63.9%</text>
