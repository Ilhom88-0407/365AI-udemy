<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="440" fill="#0f172a"/>
  <text x="430" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Funksiya ichida funksiya</text>

  <rect x="40" y="66" width="360" height="110" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <text x="62" y="94" fill="#38bdf8" font-size="15" font-weight="bold">1 · Asosiy funksiya</text>
  <text x="62" y="124" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">def wage(w_hours):</text>
  <text x="62" y="148" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">    return w_hours * 25</text>
  <text x="62" y="168" fill="#94a3b8" font-size="12">soatlik ish haqi: $25</text>

  <rect x="460" y="66" width="360" height="110" rx="10" fill="#020617" stroke="#4ade80" stroke-width="2"/>
  <text x="482" y="94" fill="#4ade80" font-size="15" font-weight="bold">2 · Ikkinchi funksiya</text>
  <text x="482" y="124" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">def with_bonus(w_hours):</text>
  <text x="482" y="148" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">    return wage(w_hours) + 50</text>
  <text x="482" y="168" fill="#fbbf24" font-size="12">↑ 1-funksiya SHU YERDA ishlatiladi</text>

  <text x="430" y="212" text-anchor="middle" fill="#94a3b8" font-size="15">with_bonus(8)  chaqirilganda nima bo'ladi:</text>

  <rect x="40" y="230" width="160" height="60" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="120" y="256" text-anchor="middle" fill="#4ade80" font-size="14" font-family="Consolas, monospace">with_bonus(8)</text>
  <text x="120" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">chaqirildi</text>

  <text x="216" y="266" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>

  <rect x="232" y="230" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="312" y="256" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="Consolas, monospace">wage(8)</text>
  <text x="312" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">ichkarida chaqirildi</text>

  <text x="408" y="266" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>

  <rect x="424" y="230" width="160" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="504" y="256" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="Consolas, monospace">8 * 25 = 200</text>
  <text x="504" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">qaytarildi</text>

  <text x="600" y="266" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>

  <rect x="616" y="230" width="204" height="60" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="718" y="256" text-anchor="middle" fill="#4ade80" font-size="14" font-family="Consolas, monospace">200 + 50 = 250</text>
  <text x="718" y="278" text-anchor="middle" fill="#bbf7d0" font-size="12">YAKUNIY NATIJA</text>

  <rect x="40" y="312" width="780" height="52" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="62" y="344" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">wage(8), with_bonus(8)     →     (200, 250)</text>

  <rect x="40" y="378" width="780" height="48" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="62" y="408" fill="#38bdf8" font-size="15" font-weight="bold">💡 Nima uchun foydali: bir marta yozgan mantiqni QAYTA-QAYTA ishlatasiz</text>
</svg>
