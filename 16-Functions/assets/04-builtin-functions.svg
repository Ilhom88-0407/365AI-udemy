<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="560" fill="#0f172a"/>
  <text x="440" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Python'ning ichki funksiyalari</text>
  <text x="440" y="62" text-anchor="middle" fill="#94a3b8" font-size="14">Python bilan birga o'rnatiladi — kodini yozish shart emas</text>

  <text x="150" y="96" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold">TUR bilan ishlash</text>
  <rect x="28" y="108" width="244" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="136" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">type(10)</text>
  <text x="180" y="136" fill="#4ade80" font-size="14" font-family="Consolas, monospace">int</text>
  <text x="48" y="164" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">int(5.0)</text>
  <text x="180" y="164" fill="#4ade80" font-size="14" font-family="Consolas, monospace">5</text>
  <text x="48" y="192" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">float(3)</text>
  <text x="180" y="192" fill="#4ade80" font-size="14" font-family="Consolas, monospace">3.0</text>
  <text x="48" y="220" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">str(500)</text>
  <text x="180" y="220" fill="#4ade80" font-size="14" font-family="Consolas, monospace">'500'</text>
  <text x="48" y="246" fill="#64748b" font-size="12">12-modulda ko'rgansiz</text>

  <text x="440" y="96" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="bold">SONLAR bilan</text>
  <rect x="318" y="108" width="244" height="150" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="338" y="136" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">max(10,20,30)</text>
  <text x="500" y="136" fill="#4ade80" font-size="14" font-family="Consolas, monospace">30</text>
  <text x="338" y="164" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">min(10,20,30)</text>
  <text x="500" y="164" fill="#4ade80" font-size="14" font-family="Consolas, monospace">10</text>
  <text x="338" y="192" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">abs(-20)</text>
  <text x="500" y="192" fill="#4ade80" font-size="14" font-family="Consolas, monospace">20</text>
  <text x="338" y="220" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">pow(2,10)</text>
  <text x="500" y="220" fill="#4ade80" font-size="14" font-family="Consolas, monospace">1024</text>
  <text x="338" y="246" fill="#64748b" font-size="12">pow(a,b)  =  a ** b</text>

  <text x="730" y="96" text-anchor="middle" fill="#4ade80" font-size="17" font-weight="bold">TO'PLAMLAR bilan</text>
  <rect x="608" y="108" width="244" height="150" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="628" y="136" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">sum([1,2,3,4])</text>
  <text x="800" y="136" fill="#4ade80" font-size="14" font-family="Consolas, monospace">10</text>
  <text x="628" y="164" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">len('Python')</text>
  <text x="800" y="164" fill="#4ade80" font-size="14" font-family="Consolas, monospace">6</text>
  <text x="628" y="196" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">round(3.555, 2)</text>
  <text x="628" y="218" fill="#4ade80" font-size="14" font-family="Consolas, monospace">   →  3.56</text>
  <text x="628" y="246" fill="#64748b" font-size="12">2-argument — xona soni</text>

  <rect x="28" y="284" width="824" height="112" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="52" y="312" fill="#f87171" font-size="17" font-weight="bold">⚠️  round() ning KUTILMAGAN xatti-harakati</text>
  <text x="52" y="342" fill="#fecaca" font-size="15" font-family="Consolas, monospace">round(0.5) → 0      round(1.5) → 2      round(2.5) → 2      round(3.5) → 4</text>
  <text x="52" y="366" fill="#fecaca" font-size="14">Python .5 ni ENG YAQIN JUFT songa yaxlitlaydi ("bankir yaxlitlashi").</text>
  <text x="52" y="388" fill="#fecaca" font-size="14">Sabab: ko'p yaxlitlashda xatolik to'planib ketmasligi uchun.</text>

  <rect x="28" y="414" width="824" height="126" rx="12" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="52" y="442" fill="#38bdf8" font-size="16" font-weight="bold">🔑 Ichki funksiya  vs  o'z funksiyangiz</text>
  <text x="52" y="472" fill="#e2e8f0" font-size="14">Ichki funksiya  —  Python bilan birga keladi, darrov ishlatiladi:</text>
  <text x="52" y="494" fill="#4ade80" font-size="14" font-family="Consolas, monospace">      len("Python")</text>
  <text x="52" y="518" fill="#e2e8f0" font-size="14">O'z funksiyangiz  —  avval  def  bilan e'lon qilinadi, keyin chaqiriladi:</text>
  <text x="52" y="536" fill="#a78bfa" font-size="14" font-family="Consolas, monospace">      def plus_ten(a): ...     →     plus_ten(2)</text>
</svg>
