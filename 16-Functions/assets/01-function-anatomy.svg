<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="470" fill="#0f172a"/>
  <text x="430" y="40" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Funksiyaning tuzilishi</text>

  <rect x="40" y="70" width="780" height="130" rx="12" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="70" y="120" fill="#4ade80" font-size="26" font-weight="bold" font-family="Consolas, monospace">def</text>
  <text x="130" y="120" fill="#38bdf8" font-size="26" font-weight="bold" font-family="Consolas, monospace">plus_ten</text>
  <text x="272" y="120" fill="#fbbf24" font-size="26" font-family="Consolas, monospace">(</text>
  <text x="290" y="120" fill="#f472b6" font-size="26" font-weight="bold" font-family="Consolas, monospace">a</text>
  <text x="308" y="120" fill="#fbbf24" font-size="26" font-family="Consolas, monospace">)</text>
  <text x="326" y="120" fill="#f87171" font-size="26" font-weight="bold" font-family="Consolas, monospace">:</text>
  <text x="100" y="165" fill="#a78bfa" font-size="24" font-weight="bold" font-family="Consolas, monospace">return</text>
  <text x="220" y="165" fill="#e2e8f0" font-size="24" font-family="Consolas, monospace">a + 10</text>

  <line x1="88" y1="128" x2="88" y2="230" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="60" y="250" fill="#4ade80" font-size="13" font-weight="bold">kalit so'z</text>
  <text x="60" y="268" fill="#94a3b8" font-size="12">buyruq emas!</text>

  <line x1="200" y1="128" x2="200" y2="290" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="168" y="310" fill="#38bdf8" font-size="13" font-weight="bold">NOM</text>
  <text x="168" y="328" fill="#94a3b8" font-size="12">aniq va qisqa</text>

  <line x1="298" y1="128" x2="298" y2="230" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="268" y="250" fill="#f472b6" font-size="13" font-weight="bold">PARAMETR</text>
  <text x="268" y="268" fill="#94a3b8" font-size="12">0 ta ham bo'lishi mumkin</text>

  <line x1="332" y1="128" x2="420" y2="290" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="404" y="310" fill="#f87171" font-size="13" font-weight="bold">IKKI NUQTA</text>
  <text x="404" y="328" fill="#94a3b8" font-size="12">majburiy</text>

  <line x1="140" y1="172" x2="140" y2="230" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="560" y="250" fill="#a78bfa" font-size="13" font-weight="bold">TANA (body) — chekintirilgan</text>
  <text x="560" y="268" fill="#94a3b8" font-size="12">return — natijani QAYTARADI</text>

  <rect x="40" y="348" width="380" height="102" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="62" y="376" fill="#4ade80" font-size="16" font-weight="bold">1 · E'LON QILISH (definition)</text>
  <text x="62" y="404" fill="#bbf7d0" font-size="15" font-family="Consolas, monospace">def plus_ten(a):</text>
  <text x="62" y="426" fill="#bbf7d0" font-size="15" font-family="Consolas, monospace">    return a + 10</text>
  <text x="62" y="444" fill="#94a3b8" font-size="12">funksiya YARATILADI, lekin BAJARILMAYDI</text>

  <rect x="440" y="348" width="380" height="102" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="462" y="376" fill="#38bdf8" font-size="16" font-weight="bold">2 · CHAQIRISH (call)</text>
  <text x="462" y="404" fill="#bae6fd" font-size="15" font-family="Consolas, monospace">plus_ten(2)   →  12</text>
  <text x="462" y="426" fill="#bae6fd" font-size="15" font-family="Consolas, monospace">plus_ten(5)   →  15</text>
  <text x="462" y="444" fill="#94a3b8" font-size="12">2 va 5 — ARGUMENTLAR</text>
</svg>
