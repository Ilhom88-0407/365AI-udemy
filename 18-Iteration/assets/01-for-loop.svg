<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="500" fill="#0f172a"/>
  <text x="440" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">for sikli — qanday ishlaydi</text>

  <rect x="30" y="64" width="360" height="96" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="52" y="94" fill="#4ade80" font-size="17" font-family="Consolas, monospace">for</text>
  <text x="100" y="94" fill="#f472b6" font-size="17" font-weight="bold" font-family="Consolas, monospace">n</text>
  <text x="126" y="94" fill="#4ade80" font-size="17" font-family="Consolas, monospace">in</text>
  <text x="166" y="94" fill="#38bdf8" font-size="17" font-family="Consolas, monospace">even</text>
  <text x="222" y="94" fill="#f87171" font-size="17" font-weight="bold" font-family="Consolas, monospace">:</text>
  <text x="76" y="122" fill="#e2e8f0" font-size="17" font-family="Consolas, monospace">print(n)</text>
  <text x="52" y="148" fill="#94a3b8" font-size="12">↑ CHEKINISH majburiy — bu SIKL TANASI</text>

  <text x="410" y="94" fill="#f472b6" font-size="13">← sikl o'zgaruvchisi (istalgan nom)</text>
  <text x="410" y="116" fill="#38bdf8" font-size="13">← ketma-ketlik (ro'yxat, tuple, satr, range)</text>
  <text x="410" y="138" fill="#f87171" font-size="13">← ikki nuqta majburiy</text>

  <text x="440" y="192" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="bold">Har bir aylanish = ITERATSIYA (pass)</text>

  <g font-family="Consolas, monospace">
    <rect x="30" y="212" width="98" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="79" y="240" text-anchor="middle" fill="#38bdf8" font-size="20">0</text>
    <text x="79" y="264" text-anchor="middle" fill="#94a3b8" font-size="12">1-iteratsiya</text>

    <rect x="140" y="212" width="98" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="189" y="240" text-anchor="middle" fill="#38bdf8" font-size="20">2</text>
    <text x="189" y="264" text-anchor="middle" fill="#94a3b8" font-size="12">2-iteratsiya</text>

    <rect x="250" y="212" width="98" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="299" y="240" text-anchor="middle" fill="#38bdf8" font-size="20">4</text>
    <text x="299" y="264" text-anchor="middle" fill="#94a3b8" font-size="12">3-iteratsiya</text>

    <text x="380" y="248" text-anchor="middle" fill="#94a3b8" font-size="22">...</text>

    <rect x="412" y="212" width="98" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="461" y="240" text-anchor="middle" fill="#38bdf8" font-size="20">20</text>
    <text x="461" y="264" text-anchor="middle" fill="#94a3b8" font-size="12">11-iteratsiya</text>

    <text x="542" y="248" text-anchor="middle" fill="#4ade80" font-size="22">→</text>

    <rect x="566" y="212" width="130" height="66" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="631" y="248" text-anchor="middle" fill="#4ade80" font-size="15">TUGADI</text>
  </g>

  <rect x="30" y="300" width="400" height="106" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="52" y="328" fill="#fbbf24" font-size="15" font-weight="bold">HAR BIR AYLANISHDA</text>
  <text x="52" y="354" fill="#e2e8f0" font-size="14">1. Ro'yxatdan keyingi element olinadi</text>
  <text x="52" y="376" fill="#e2e8f0" font-size="14">2. Sikl tanasi bajariladi</text>
  <text x="52" y="398" fill="#e2e8f0" font-size="14">3. for ga qaytiladi — element tugaguncha</text>

  <rect x="450" y="300" width="400" height="106" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="472" y="328" fill="#38bdf8" font-size="15" font-weight="bold">end=" " — bitta qatorda chiqarish</text>
  <text x="472" y="356" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">print(n)</text>
  <text x="640" y="356" fill="#94a3b8" font-size="13">→ har biri YANGI qatorda</text>
  <text x="472" y="382" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">print(n, end=" ")</text>
  <text x="640" y="382" fill="#94a3b8" font-size="13">→ BIR qatorda</text>
  <text x="472" y="400" fill="#fbbf24" font-size="12">qo'shtirnoqlar orasida BITTA bo'sh joy</text>

  <rect x="30" y="422" width="820" height="60" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="52" y="450" fill="#4ade80" font-size="16" font-weight="bold">💡 Iteratsiya — barcha dasturlarning FUNDAMENTAL qurilish bloki</text>
  <text x="52" y="472" fill="#bbf7d0" font-size="14">Bu — ma'lum kodni QAYTA-QAYTA bajarish qobiliyati.</text>
</svg>
