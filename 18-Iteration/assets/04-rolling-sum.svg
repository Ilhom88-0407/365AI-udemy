<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="520" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Yig'uvchi o'zgaruvchi (rolling sum)</text>
  <text x="440" y="60" text-anchor="middle" fill="#94a3b8" font-size="14">Sikl + shart + funksiya — hammasi birga</text>

  <rect x="30" y="80" width="400" height="180" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="52" y="110" fill="#4ade80" font-size="15" font-family="Consolas, monospace">def count(numbers):</text>
  <text x="52" y="134" fill="#fbbf24" font-size="15" font-family="Consolas, monospace">    total = 0</text>
  <text x="52" y="158" fill="#38bdf8" font-size="15" font-family="Consolas, monospace">    for x in numbers:</text>
  <text x="52" y="182" fill="#f472b6" font-size="15" font-family="Consolas, monospace">        if x &lt; 20:</text>
  <text x="52" y="206" fill="#fbbf24" font-size="15" font-family="Consolas, monospace">            total += 1</text>
  <text x="52" y="230" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">    return total</text>
  <text x="52" y="252" fill="#94a3b8" font-size="12">Diqqat: if BLOKI yana O'NGGA chekintirilgan</text>

  <text x="446" y="110" fill="#4ade80" font-size="12">← funksiya</text>
  <text x="446" y="134" fill="#fbbf24" font-size="12">← YIG'UVCHI: NOLDAN boshlanadi</text>
  <text x="446" y="158" fill="#38bdf8" font-size="12">← sikl: har bir elementni ko'rib chiqadi</text>
  <text x="446" y="182" fill="#f472b6" font-size="12">← shart: faqat 20 dan kichiklar</text>
  <text x="446" y="206" fill="#fbbf24" font-size="12">← shart bajarilsa — BIRGA o'sadi</text>
  <text x="446" y="230" fill="#e2e8f0" font-size="12">← natija qaytariladi</text>

  <text x="440" y="292" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="bold">count([1, 3, 7, 15, 23, 43, 56, 98])  —  qadamma-qadam</text>

  <g font-family="Consolas, monospace">
    <rect x="30" y="308" width="100" height="66" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="80" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">1</text>
    <text x="80" y="354" text-anchor="middle" fill="#4ade80" font-size="13">total=1</text>

    <rect x="138" y="308" width="100" height="66" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="188" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">3</text>
    <text x="188" y="354" text-anchor="middle" fill="#4ade80" font-size="13">total=2</text>

    <rect x="246" y="308" width="100" height="66" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="296" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">7</text>
    <text x="296" y="354" text-anchor="middle" fill="#4ade80" font-size="13">total=3</text>

    <rect x="354" y="308" width="100" height="66" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="404" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">15</text>
    <text x="404" y="354" text-anchor="middle" fill="#4ade80" font-size="13">total=4</text>

    <rect x="462" y="308" width="100" height="66" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
    <text x="512" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">23</text>
    <text x="512" y="354" text-anchor="middle" fill="#f87171" font-size="13">total=4</text>

    <rect x="570" y="308" width="100" height="66" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">43</text>
    <text x="620" y="354" text-anchor="middle" fill="#f87171" font-size="13">total=4</text>

    <rect x="678" y="308" width="80" height="66" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
    <text x="718" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">56</text>
    <text x="718" y="354" text-anchor="middle" fill="#f87171" font-size="13">4</text>

    <rect x="766" y="308" width="84" height="66" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
    <text x="808" y="332" text-anchor="middle" fill="#e2e8f0" font-size="15">98</text>
    <text x="808" y="354" text-anchor="middle" fill="#f87171" font-size="13">4</text>
  </g>

  <text x="30" y="396" fill="#4ade80" font-size="13">✅ 20 dan kichik — total o'sadi</text>
  <text x="330" y="396" fill="#f87171" font-size="13">❌ 20 dan katta — total o'zgarmaydi</text>
  <text x="660" y="396" fill="#fbbf24" font-size="15" font-weight="bold">NATIJA: 4</text>

  <rect x="30" y="414" width="820" height="90" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="52" y="442" fill="#38bdf8" font-size="16" font-weight="bold">🔑 YIG'UVCHI O'ZGARUVCHI NAQSHI — eng ko'p ishlatiladigan naqsh</text>
  <text x="52" y="468" fill="#e2e8f0" font-size="14">1. NOLDAN boshlang:  total = 0     (yoki bo'sh ro'yxat:  natija = [])</text>
  <text x="52" y="490" fill="#e2e8f0" font-size="14">2. Sikl ichida O'STIRING:  total += 1   (yoki  natija.append(x))</text>
</svg>
