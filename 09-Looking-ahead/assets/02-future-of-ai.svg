<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="980" height="520" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">AI ning kelajagi — uchta resurs</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#475569">O'sish sur'ati aynan shu uchtasiga bog'liq</text>

  <!-- forecasts -->
  <rect x="24" y="76" width="932" height="94" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Generativ AI bozori prognozlari — ikki manba, ULKAN tafovut</text>

  <rect x="60" y="112" width="380" height="44" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="82" y="132" font-size="12" font-weight="700" fill="#1D4ED8">Bloomberg (2032)</text>
  <text x="410" y="132" text-anchor="end" font-size="17" font-weight="700" fill="#1D4ED8">$1.3 trln</text>
  <text x="82" y="149" font-size="10.5" fill="#64748B">taqqoslash uchun: AQSh yillik YaIM ≈ $25 trln</text>

  <rect x="540" y="112" width="380" height="44" rx="9" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="562" y="132" font-size="12" font-weight="700" fill="#6D28D9">PwC (2030)</text>
  <text x="890" y="132" text-anchor="end" font-size="17" font-weight="700" fill="#6D28D9">$15.7 trln</text>
  <text x="562" y="149" font-size="10.5" fill="#64748B">12 barobar yuqori bashorat — qaysi biri to'g'ri, bilmaymiz</text>

  <!-- three resources -->
  <text x="490" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">AI modellariga kerak bo'lgan uchta muhim resurs</text>

  <!-- 1 DATA -->
  <rect x="24" y="210" width="300" height="230" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="24" y="210" width="300" height="40" rx="12" fill="#2563EB"/>
  <rect x="24" y="236" width="300" height="14" fill="#2563EB"/>
  <text x="174" y="237" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">1 · MA'LUMOT</text>
  <g font-size="11.5" fill="#334155">
    <text x="44" y="274">⚖️ Ijtimoiy tarmoq va sayt ma'lumoti —</text>
    <text x="58" y="291">noetik bo'lishi mumkin</text>
    <text x="44" y="315">📈 LLM lar yanada KATTALASHADI</text>
    <text x="44" y="339">💵 Ko'proq LITSENZIYA shartnomalari</text>
    <text x="44" y="363">🏛 Hukumatlar shaxsiy ma'lumotda</text>
    <text x="58" y="380">o'qitishni TAQIQLASHI mumkin</text>
    <text x="44" y="404">💰 Kompaniyalar foydalanuvchiga</text>
    <text x="58" y="421">ma'lumoti uchun TO'LASHI mumkin</text>
  </g>

  <!-- 2 ELECTRICITY -->
  <rect x="340" y="210" width="300" height="230" rx="12" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2.5"/>
  <rect x="340" y="210" width="300" height="40" rx="12" fill="#CA8A04"/>
  <rect x="340" y="236" width="300" height="14" fill="#CA8A04"/>
  <text x="490" y="237" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">2 · ELEKTR ENERGIYASI</text>
  <g font-size="11.5" fill="#334155">
    <text x="360" y="274">⚡ Katta modellar KO'P elektr talab qiladi</text>
    <text x="360" y="298">🌍 Global qabul o'sgani sari</text>
    <text x="374" y="315">talab KESKIN OSHADI</text>
    <text x="360" y="339">♻️ Energiya va uglerod izini</text>
    <text x="374" y="356">baholash kerak bo'ladi</text>
    <text x="360" y="380">💡 AI global energiya narxlarini</text>
    <text x="374" y="397">shakllantirishda muhim rol o'ynaydi</text>
  </g>
  <rect x="360" y="406" width="260" height="24" rx="6" fill="#FEFCE8"/>
  <text x="490" y="422" text-anchor="middle" font-size="10" fill="#854D0E">Conference Board: "AQSh elektr talabini portlatish xavfi"</text>

  <!-- 3 COMPUTE -->
  <rect x="656" y="210" width="300" height="230" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="656" y="210" width="300" height="40" rx="12" fill="#059669"/>
  <rect x="656" y="236" width="300" height="14" fill="#059669"/>
  <text x="806" y="237" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">3 · HISOBLASH QUVVATI</text>
  <g font-size="11.5" fill="#334155">
    <text x="676" y="274">🔲 Nihoyatda qobiliyatli AI CHIPLAR</text>
    <text x="676" y="298">📊 2023–2024: Nvidia qiymati</text>
    <text x="690" y="315">keskin oshdi</text>
    <text x="676" y="339">⚠️ Sifatli AI chiplarda</text>
    <text x="690" y="356">JIDDIY TAQCHILLIK</text>
    <text x="676" y="380">🔄 Lekin bu o'zgarishi mumkin —</text>
    <text x="690" y="397">boshqa ishlab chiqaruvchilar</text>
    <text x="690" y="414">e'tibor qaratmoqda</text>
  </g>

  <!-- feedback loop warning -->
  <rect x="24" y="454" width="460" height="52" rx="11" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="254" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">↻ AI kontenti bilan o'qitish xavfi</text>
  <text x="254" y="494" text-anchor="middle" font-size="11" fill="#7F1D1D">feedback loop · aniqlik pasayishi · bias larning kuchayishi</text>

  <rect x="496" y="454" width="460" height="52" rx="11" fill="#0F172A"/>
  <text x="726" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FBBF24">Yakuniy savol: open source raqobatbardosh bo'ladimi?</text>
  <text x="726" y="494" text-anchor="middle" font-size="11" fill="#CBD5E1">Yoki Google va OpenAI bozorda hukmronlik qiladimi?</text>
</svg>
