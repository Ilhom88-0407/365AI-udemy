<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="940" height="480" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Chekinish (indentation) — Python'ning eng muhim qoidasi</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#475569">Bo'sh joy — bezak emas, MA'NO. U kod bloklarini belgilaydi.</text>

  <!-- WRONG -->
  <rect x="24" y="80" width="440" height="200" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
  <rect x="24" y="80" width="440" height="40" rx="12" fill="#DC2626"/>
  <rect x="24" y="106" width="440" height="14" fill="#DC2626"/>
  <text x="244" y="107" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">❌ NOTO'G'RI</text>

  <g font-family="Consolas, monospace" font-size="13.5">
    <rect x="48" y="132" width="392" height="112" rx="8" fill="#FEF2F2"/>
    <text x="64" y="154" fill="#0F172A">def ten(x):</text>
    <text x="64" y="176" fill="#0F172A">    x = 10</text>
    <text x="64" y="198" fill="#0F172A">    return x</text>
    <text x="64" y="220" fill="#991B1B">    print(ten(3))</text>
  </g>
  <rect x="48" y="204" width="392" height="24" rx="4" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="244" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">Natija: HECH NARSA chiqmaydi</text>

  <!-- RIGHT -->
  <rect x="476" y="80" width="440" height="200" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="476" y="80" width="440" height="40" rx="12" fill="#059669"/>
  <rect x="476" y="106" width="440" height="14" fill="#059669"/>
  <text x="696" y="107" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">✅ TO'G'RI</text>

  <g font-family="Consolas, monospace" font-size="13.5">
    <rect x="500" y="132" width="392" height="112" rx="8" fill="#ECFDF5"/>
    <text x="516" y="154" fill="#0F172A">def ten(x):</text>
    <text x="516" y="176" fill="#0F172A">    x = 10</text>
    <text x="516" y="198" fill="#0F172A">    return x</text>
    <text x="516" y="228" fill="#047857">print(ten(3))</text>
  </g>
  <rect x="500" y="212" width="392" height="24" rx="4" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="696" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Natija: 10</text>

  <!-- explanation -->
  <text x="470" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Nima uchun farq qiladi</text>

  <rect x="24" y="320" width="440" height="86" rx="11" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="244" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">print — FUNKSIYA ICHIDA</text>
  <text x="244" y="366" text-anchor="middle" font-size="11.5" fill="#7F1D1D">U faqat funksiya CHAQIRILGANDA bajariladi</text>
  <text x="244" y="386" text-anchor="middle" font-size="11.5" fill="#7F1D1D">Lekin undan oldin `return` bor — kod u yerga yetmaydi</text>

  <rect x="476" y="320" width="440" height="86" rx="11" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="696" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">print — MUSTAQIL blok</text>
  <text x="696" y="366" text-anchor="middle" font-size="11.5" fill="#065F46">`def` bilan bir chiziqda turibdi</text>
  <text x="696" y="386" text-anchor="middle" font-size="11.5" fill="#065F46">U o'zicha bajariladi va funksiyani CHAQIRADI</text>

  <!-- rule -->
  <rect x="24" y="420" width="892" height="46" rx="11" fill="#0F172A"/>
  <text x="470" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FBBF24">Funksiyaga tegishli hamma narsa — BITTA chekinish ichkariga</text>
  <text x="470" y="459" text-anchor="middle" font-size="11.5" fill="#CBD5E1">Boshqa narsa yozmoqchi bo'lsangiz — yangi qator, chekinishsiz. Standart: 4 ta bo'sh joy.</text>
</svg>
