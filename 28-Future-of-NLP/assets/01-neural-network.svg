<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="430" fill="#0f172a" rx="14"/>
  <text x="440" y="38" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Neyron tarmoq — chuqur o'qitish asosi</text>
  <text x="440" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">"chuqur" = YASHIRIN qatlamlar KO'P</text>

  <!-- layer labels -->
  <text x="120" y="100" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">KIRISH</text>
  <text x="120" y="118" fill="#64748b" font-size="11" text-anchor="middle">input layer</text>
  <text x="340" y="100" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">YASHIRIN 1</text>
  <text x="340" y="118" fill="#64748b" font-size="11" text-anchor="middle">hidden layer</text>
  <text x="560" y="100" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">YASHIRIN 2</text>
  <text x="560" y="118" fill="#64748b" font-size="11" text-anchor="middle">hidden layer</text>
  <text x="770" y="100" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">CHIQISH</text>
  <text x="770" y="118" fill="#64748b" font-size="11" text-anchor="middle">output layer</text>

  <!-- connections input -> h1 -->
  <g stroke="#334155" stroke-width="1">
    <line x1="120" y1="170" x2="340" y2="160"/><line x1="120" y1="170" x2="340" y2="220"/>
    <line x1="120" y1="170" x2="340" y2="280"/><line x1="120" y1="170" x2="340" y2="340"/>
    <line x1="120" y1="240" x2="340" y2="160"/><line x1="120" y1="240" x2="340" y2="220"/>
    <line x1="120" y1="240" x2="340" y2="280"/><line x1="120" y1="240" x2="340" y2="340"/>
    <line x1="120" y1="310" x2="340" y2="160"/><line x1="120" y1="310" x2="340" y2="220"/>
    <line x1="120" y1="310" x2="340" y2="280"/><line x1="120" y1="310" x2="340" y2="340"/>
  </g>
  <!-- h1 -> h2 -->
  <g stroke="#334155" stroke-width="1">
    <line x1="340" y1="160" x2="560" y2="160"/><line x1="340" y1="160" x2="560" y2="220"/>
    <line x1="340" y1="160" x2="560" y2="280"/><line x1="340" y1="160" x2="560" y2="340"/>
    <line x1="340" y1="220" x2="560" y2="160"/><line x1="340" y1="220" x2="560" y2="220"/>
    <line x1="340" y1="220" x2="560" y2="280"/><line x1="340" y1="220" x2="560" y2="340"/>
    <line x1="340" y1="280" x2="560" y2="160"/><line x1="340" y1="280" x2="560" y2="220"/>
    <line x1="340" y1="280" x2="560" y2="280"/><line x1="340" y1="280" x2="560" y2="340"/>
    <line x1="340" y1="340" x2="560" y2="160"/><line x1="340" y1="340" x2="560" y2="220"/>
    <line x1="340" y1="340" x2="560" y2="280"/><line x1="340" y1="340" x2="560" y2="340"/>
  </g>
  <!-- h2 -> out -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="560" y1="160" x2="770" y2="205"/><line x1="560" y1="160" x2="770" y2="275"/>
    <line x1="560" y1="220" x2="770" y2="205"/><line x1="560" y1="220" x2="770" y2="275"/>
    <line x1="560" y1="280" x2="770" y2="205"/><line x1="560" y1="280" x2="770" y2="275"/>
    <line x1="560" y1="340" x2="770" y2="205"/><line x1="560" y1="340" x2="770" y2="275"/>
  </g>

  <!-- input nodes -->
  <g>
    <circle cx="120" cy="170" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="175" fill="#e0f2fe" font-size="12" text-anchor="middle">good</text>
    <circle cx="120" cy="240" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="245" fill="#e0f2fe" font-size="12" text-anchor="middle">not</text>
    <circle cx="120" cy="310" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="315" fill="#e0f2fe" font-size="12" text-anchor="middle">waste</text>
  </g>
  <!-- hidden nodes -->
  <g fill="#3b0764" stroke="#a78bfa" stroke-width="2">
    <circle cx="340" cy="160" r="19"/><circle cx="340" cy="220" r="19"/>
    <circle cx="340" cy="280" r="19"/><circle cx="340" cy="340" r="19"/>
    <circle cx="560" cy="160" r="19"/><circle cx="560" cy="220" r="19"/>
    <circle cx="560" cy="280" r="19"/><circle cx="560" cy="340" r="19"/>
  </g>
  <!-- output nodes -->
  <circle cx="770" cy="205" r="26" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="770" y="203" fill="#dcfce7" font-size="11" text-anchor="middle">ijobiy</text>
  <text x="770" y="217" fill="#86efac" font-size="10" text-anchor="middle">0.87</text>
  <circle cx="770" cy="275" r="26" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="770" y="273" fill="#fee2e2" font-size="11" text-anchor="middle">salbiy</text>
  <text x="770" y="287" fill="#fca5a5" font-size="10" text-anchor="middle">0.13</text>

  <!-- bottom note -->
  <rect x="60" y="376" width="760" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="398" fill="#cbd5e1" font-size="13" text-anchor="middle">Har bir bog'lanishning OG'IRLIGI bor · o'qitish = og'irliklarni to'g'rilash</text>
</svg>
