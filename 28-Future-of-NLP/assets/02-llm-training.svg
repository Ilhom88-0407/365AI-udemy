  <!-- model box -->
  <rect x="272" y="130" width="230" height="186" rx="14" fill="#3b0764" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="387" y="162" fill="#f5f3ff" font-size="17" font-weight="700" text-anchor="middle">TRANSFORMER</text>
  <text x="387" y="182" fill="#c4b5fd" font-size="12" text-anchor="middle">milliardlab parametr</text>
  <line x1="292" y1="196" x2="482" y2="196" stroke="#6d28d9"/>
  <text x="387" y="220" fill="#ddd6fe" font-size="12.5" text-anchor="middle">grammatika</text>
  <text x="387" y="242" fill="#ddd6fe" font-size="12.5" text-anchor="middle">naqshlar</text>
  <text x="387" y="264" fill="#ddd6fe" font-size="12.5" text-anchor="middle">semantik munosabatlar</text>
  <text x="387" y="286" fill="#ddd6fe" font-size="12.5" text-anchor="middle">faktlar · uslub</text>
  <text x="387" y="306" fill="#a78bfa" font-size="11" text-anchor="middle">← buni O'ZI o'rganadi</text>

