  <!-- arrows into model -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M205 131 Q245 131 265 200"/>
    <path d="M205 177 Q245 177 265 210"/>
    <path d="M205 223 L265 223"/>
    <path d="M205 269 Q245 269 265 236"/>
    <path d="M205 315 Q245 315 265 246"/>
