  <text x="725" y="96" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">QO'LLANISHI</text>
  <g>
    <rect x="570" y="112" width="280" height="34" rx="8" fill="#14532d" stroke="#4ade80"/>
    <text x="710" y="134" fill="#dcfce7" font-size="13" text-anchor="middle">💬  Chatbot  (ChatGPT, Claude)</text>
    <rect x="570" y="154" width="280" height="34" rx="8" fill="#14532d" stroke="#4ade80"/>
    <text x="710" y="176" fill="#dcfce7" font-size="13" text-anchor="middle">✍️  Kontent yaratish</text>
