  <text x="440" y="372" fill="#fde68a" font-size="13.5" font-weight="700" text-anchor="middle">⚡ Siz buni 23-MODULDA allaqachon ishlatgansiz:</text>
  <text x="440" y="391" fill="#cbd5e1" font-size="12.5" font-family="Consolas, monospace" text-anchor="middle">pipeline("sentiment-analysis")  →  bir xil arxitektura, faqat kichikroq</text>
