<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="560" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Matnni oldindan qayta ishlash — quvur</text>
  <text x="440" y="60" text-anchor="middle" fill="#94a3b8" font-size="14">"Garbage in, garbage out" — axlat kirsa, axlat chiqadi</text>

  <rect x="30" y="82" width="820" height="52" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="52" y="106" fill="#f87171" font-size="14" font-weight="bold">XOM MATN</text>
  <text x="52" y="126" fill="#fecaca" font-size="13" font-family="Consolas, monospace">"Her Cat's name is Luna! It was TOO far to go to the shop..."</text>

  <text x="440" y="152" text-anchor="middle" fill="#94a3b8" font-size="20">↓</text>

  <rect x="30" y="160" width="400" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="52" y="181" fill="#38bdf8" font-size="14" font-weight="bold">1 · KICHIK HARF  (lowercase)</text>
  <text x="52" y="200" fill="#94a3b8" font-size="12">"Her" va "her" BIR XIL bo'lsin</text>
  <rect x="450" y="160" width="400" height="48" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="190" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">.lower()</text>

  <text x="440" y="226" text-anchor="middle" fill="#94a3b8" font-size="20">↓</text>

  <rect x="30" y="234" width="400" height="48" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="52" y="255" fill="#4ade80" font-size="14" font-weight="bold">2 · TO'XTATISH SO'ZLARI  (stopwords)</text>
  <text x="52" y="274" fill="#94a3b8" font-size="12">"the", "and", "of" — ma'no bermaydi</text>
  <rect x="450" y="234" width="400" height="48" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="264" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">stopwords.words('english')</text>

  <text x="440" y="300" text-anchor="middle" fill="#94a3b8" font-size="20">↓</text>

  <rect x="30" y="308" width="400" height="48" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="52" y="329" fill="#fbbf24" font-size="14" font-weight="bold">3 · TINISH BELGILAR  (regex)</text>
  <text x="52" y="348" fill="#94a3b8" font-size="12">! ? . , — olib tashlanadi</text>
  <rect x="450" y="308" width="400" height="48" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="338" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">re.sub(r"[^\w\s]", "", s)</text>

  <text x="440" y="374" text-anchor="middle" fill="#94a3b8" font-size="20">↓</text>

  <rect x="30" y="382" width="400" height="48" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="52" y="403" fill="#f472b6" font-size="14" font-weight="bold">4 · TOKENIZATSIYA  (tokenization)</text>
  <text x="52" y="422" fill="#94a3b8" font-size="12">matn → so'zlar ro'yxati</text>
  <rect x="450" y="382" width="400" height="48" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="412" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">word_tokenize(s)</text>

  <text x="440" y="448" text-anchor="middle" fill="#94a3b8" font-size="20">↓</text>

  <rect x="30" y="456" width="400" height="48" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="52" y="477" fill="#a78bfa" font-size="14" font-weight="bold">5 · STANDARTLASHTIRISH</text>
  <text x="52" y="496" fill="#94a3b8" font-size="12">stemming YOKI lemmatization</text>
  <rect x="450" y="456" width="400" height="48" rx="8" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="480" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">PorterStemmer().stem(w)</text>
  <text x="472" y="498" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">WordNetLemmatizer().lemmatize(w)</text>

  <rect x="30" y="514" width="820" height="36" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="52" y="538" fill="#4ade80" font-size="14" font-weight="bold">TOZA TOKENLAR  →  ['nice', 'hotel', 'expensive', 'parking', ...]  →  ML ga TAYYOR</text>
</svg>
