<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="880" height="470" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">LCEL — hamma narsa Runnable</text>
  <text x="440" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">| operatori — bu Runnable sinfining __or__ metodi, boshqa hech nima</text>

  <!-- manual -->
  <rect x="26" y="76" width="400" height="128" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="226" y="102" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">QO'LDA (39–40-modul)</text>
  <g font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">
    <text x="46" y="128">pv = chat_template.invoke({"pet": "dog"})</text>
    <text x="46" y="148">am = chat.invoke(pv)</text>
    <text x="46" y="168">r  = parser.invoke(am)</text>
  </g>
  <text x="226" y="192" fill="#fbbf24" font-size="11.5" text-anchor="middle">3 satr · o'rtadagi o'zgaruvchilar</text>

  <!-- lcel -->
  <rect x="454" y="76" width="400" height="128" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="654" y="102" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">⭐ LCEL</text>
  <g font-family="Consolas, monospace" font-size="11.5" fill="#86efac">
    <text x="474" y="132">chain = chat_template | chat | parser</text>
    <text x="474" y="158">r = chain.invoke({"pet": "dog"})</text>
  </g>
  <text x="654" y="192" fill="#4ade80" font-size="11.5" text-anchor="middle">+ batch · stream · retry · fallback · graph</text>

  <!-- pipeline -->
  <rect x="60" y="222" width="180" height="46" rx="9" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="150" y="243" fill="#f3e8ff" font-size="12.5" font-weight="700" text-anchor="middle">ChatPromptTemplate</text>
  <text x="150" y="260" fill="#d8b4fe" font-size="10.5" text-anchor="middle">dict → ChatPromptValue</text>
  <path d="M244 245 L282 245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#l1)"/>

  <rect x="290" y="222" width="180" height="46" rx="9" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="380" y="243" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">ChatOpenAI</text>
  <text x="380" y="260" fill="#7dd3fc" font-size="10.5" text-anchor="middle">PromptValue → AIMessage</text>
  <path d="M474 245 L512 245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#l1)"/>

  <rect x="520" y="222" width="180" height="46" rx="9" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="610" y="243" fill="#ffedd5" font-size="12.5" font-weight="700" text-anchor="middle">OutputParser</text>
  <text x="610" y="260" fill="#fdba74" font-size="10.5" text-anchor="middle">AIMessage → str / list</text>
  <path d="M704 245 L742 245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#l1)"/>

  <rect x="750" y="222" width="104" height="46" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="802" y="250" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">NATIJA</text>

  <text x="440" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">HAMMASI Runnable — shuning uchun ~40 metod HAR BIRIDA bor</text>

  <!-- methods -->
  <rect x="26" y="306" width="270" height="106" rx="10" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="161" y="330" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">ASOSIY (kursda)</text>
  <text x="46" y="352" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">invoke · batch · stream</text>
  <text x="46" y="372" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">get_graph</text>
  <text x="46" y="396" fill="#4ade80" font-size="11">batch: 1.20s → 0.30s (o'lchandi)</text>

  <rect x="306" y="306" width="270" height="106" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="441" y="330" fill="#dcfce7" font-size="13" font-weight="700" text-anchor="middle">⭐ KURSDA YO'Q</text>
  <text x="326" y="352" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">with_retry · with_fallbacks</text>
  <text x="326" y="372" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">assign · pick · map · bind</text>
  <text x="326" y="392" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">ainvoke · astream_events</text>

  <rect x="586" y="306" width="268" height="106" rx="10" fill="#581c87" stroke="#c084fc"/>
  <text x="720" y="330" fill="#f3e8ff" font-size="13" font-weight="700" text-anchor="middle">TUZILISH</text>
  <text x="606" y="352" fill="#d8b4fe" font-size="11.5" font-family="Consolas, monospace">RunnableSequence   (|)</text>
  <text x="606" y="372" fill="#d8b4fe" font-size="11.5" font-family="Consolas, monospace">RunnableParallel   ({})</text>
  <text x="606" y="392" fill="#d8b4fe" font-size="11.5" font-family="Consolas, monospace">RunnableLambda     (@chain)</text>

  <rect x="26" y="424" width="828" height="34" rx="9" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="440" y="446" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">🏆 chains · memory · output_parsers OLIB TASHLANDI — LCEL QOLDI. Bu bilim ESKIRMADI.</text>
