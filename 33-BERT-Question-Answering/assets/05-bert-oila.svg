<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="880" height="470" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">BERT oilasi — o'lchangan taqqoslash</text>
  <text x="440" y="55" fill="#94a3b8" font-size="12" text-anchor="middle">raqamlar CPU'da, 4 oqim, 30 marta o'rtacha</text>

  <!-- root -->
  <rect x="340" y="70" width="200" height="52" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="440" y="92" fill="#dbeafe" font-size="15" font-weight="700" text-anchor="middle">BERT</text>
  <text x="440" y="112" fill="#93c5fd" font-size="11.5" text-anchor="middle">2018 · Google</text>

  <path d="M400 124 L240 158" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <path d="M480 124 L640 158" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <text x="285" y="146" fill="#c084fc" font-size="11" font-weight="700">yaxshiroq O'QITISH</text>
  <text x="545" y="146" fill="#4ade80" font-size="11" font-weight="700">DISTILLYATSIYA</text>

  <!-- roberta -->
  <rect x="40" y="166" width="360" height="52" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="220" y="188" fill="#f3e8ff" font-size="15" font-weight="700" text-anchor="middle">RoBERTa</text>
  <text x="220" y="208" fill="#d8b4fe" font-size="11.5" text-anchor="middle">2019 · Meta · 160 GB ma'lumot · NSP yo'q</text>

  <!-- distil -->
  <rect x="480" y="166" width="360" height="52" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="660" y="188" fill="#dcfce7" font-size="15" font-weight="700" text-anchor="middle">DistilBERT</text>
  <text x="660" y="208" fill="#86efac" font-size="11.5" text-anchor="middle">2019 · Hugging Face · 6 qatlam</text>

  <!-- table -->
  <rect x="40" y="240" width="800" height="180" rx="10" fill="#1e293b" stroke="#334155"/>
  <line x1="40" y1="272" x2="840" y2="272" stroke="#475569"/>
  <line x1="280" y1="240" x2="280" y2="420" stroke="#475569"/>
  <line x1="466" y1="240" x2="466" y2="420" stroke="#475569"/>
  <line x1="653" y1="240" x2="653" y2="420" stroke="#475569"/>

  <text x="60"  y="263" fill="#94a3b8" font-size="12.5" font-weight="700">O'LCHOV</text>
  <text x="373" y="263" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">BERT</text>
  <text x="560" y="263" fill="#d8b4fe" font-size="13" font-weight="700" text-anchor="middle">RoBERTa</text>
  <text x="746" y="263" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">DistilBERT</text>

  <g font-size="12.5" font-family="Consolas, monospace">
    <text x="60"  y="296" fill="#cbd5e1" font-family="Segoe UI, Arial">parametr</text>
    <text x="373" y="296" fill="#e0f2fe" text-anchor="middle">109.5 M</text>
    <text x="560" y="296" fill="#f3e8ff" text-anchor="middle">124.6 M</text>
    <text x="746" y="296" fill="#4ade80" text-anchor="middle" font-weight="700">66.4 M</text>

    <text x="60"  y="326" fill="#cbd5e1" font-family="Segoe UI, Arial">qatlam</text>
    <text x="373" y="326" fill="#e0f2fe" text-anchor="middle">12</text>
    <text x="560" y="326" fill="#f3e8ff" text-anchor="middle">12</text>
    <text x="746" y="326" fill="#4ade80" text-anchor="middle" font-weight="700">6</text>

    <text x="60"  y="356" fill="#cbd5e1" font-family="Segoe UI, Arial">lug'at</text>
    <text x="373" y="356" fill="#e0f2fe" text-anchor="middle">30 522</text>
    <text x="560" y="356" fill="#c084fc" text-anchor="middle" font-weight="700">50 265</text>
    <text x="746" y="356" fill="#dcfce7" text-anchor="middle">30 522</text>

    <text x="60"  y="386" fill="#cbd5e1" font-family="Segoe UI, Arial">tezlik (ms)</text>
    <text x="373" y="386" fill="#f87171" text-anchor="middle">115.6</text>
    <text x="560" y="386" fill="#f3e8ff" text-anchor="middle">63.2</text>
    <text x="746" y="386" fill="#4ade80" text-anchor="middle" font-weight="700">34.8</text>

    <text x="60"  y="412" fill="#cbd5e1" font-family="Segoe UI, Arial">token_type_ids</text>
    <text x="373" y="412" fill="#4ade80" text-anchor="middle">bor</text>
    <text x="560" y="412" fill="#4ade80" text-anchor="middle">bor</text>
    <text x="746" y="412" fill="#f87171" text-anchor="middle" font-weight="700">YO'Q</text>
  </g>

  <text x="440" y="446" fill="#facc15" font-size="12.5" font-weight="700" text-anchor="middle">DistilBERT: −39.4% parametr · +69.9% tezlik (kurs "60%" degan edi)</text>
  <text x="440" y="464" fill="#94a3b8" font-size="11" text-anchor="middle">RoBERTa parametri ko'p, lekin tezroq — chunki farq LUG'AT embeddingida, hisobda emas</text>
</svg>
