  <text x="230" y="338" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Consolas, monospace">'?' → [30]      ✅ o'lchandi</text>

  <rect x="450" y="296" width="400" height="52" rx="9" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
