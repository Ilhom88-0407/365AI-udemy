  <text x="440" y="399" fill="#7dd3fc" font-size="12" text-anchor="middle" font-family="Consolas, monospace">inglizcha ilmiy: 90 so'z  (kurs: 75, ehtiyotkor)      🇺🇿 o'zbekcha: 48 so'z</text>
