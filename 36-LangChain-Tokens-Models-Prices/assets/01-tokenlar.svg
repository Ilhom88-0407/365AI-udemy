    <text x="150" y="196" fill="#d8b4fe" font-size="11.5">ID 1148</text>
    <text x="250" y="196" fill="#f3e8ff" font-size="11.5" font-family="Segoe UI">bo'shliq BOR + kichik harf  →  ODDIY SO'Z</text>

    <rect x="30" y="220" width="820" height="62" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="50" y="244" fill="#dcfce7" font-size="12.5">"Have you listened to What a Wonderful World..."</text>
    <rect x="50" y="252" width="86" height="22" rx="4" fill="#7f1d1d" stroke="#f87171"/>
    <text x="93" y="268" fill="#fecaca" font-size="11.5" text-anchor="middle">' What'</text>
    <text x="150" y="268" fill="#86efac" font-size="11.5">ID 3639</text>
    <text x="250" y="268" fill="#dcfce7" font-size="11.5" font-family="Segoe UI">bo'shliq BOR + katta harf  →  NOM / SARLAVHA</text>
