  <text x="650" y="338" fill="#fbbf24" font-size="12" text-anchor="middle" font-family="Consolas, monospace">"salom" ≠ " salom"  — turli tokenlar</text>

  <rect x="30" y="360" width="820" height="46" rx="9" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
