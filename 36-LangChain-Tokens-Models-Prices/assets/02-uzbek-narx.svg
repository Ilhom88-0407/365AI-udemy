<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="470" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">🇺🇿 O'zbekcha matn qancha qimmat? — O'LCHANDI</text>
  <text x="440" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">5 ta ingliz–o'zbek juftligi, tiktoken bilan</text>

  <!-- ratio bars -->
  <text x="60" y="90" fill="#cbd5e1" font-size="13" font-weight="700">TOKEN NISBATI (o'zbek / ingliz)</text>

  <text x="60" y="122" fill="#94a3b8" font-size="12">inglizcha</text>
  <rect x="180" y="108" width="180" height="22" rx="4" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="270" y="124" fill="#bae6fd" font-size="11.5" text-anchor="middle">1.00×  (asos)</text>

  <text x="60" y="158" fill="#94a3b8" font-size="12">o'zbek · o200k</text>
  <rect x="180" y="144" width="299" height="22" rx="4" fill="#166534" stroke="#4ade80" stroke-width="2"/>
  <text x="330" y="160" fill="#dcfce7" font-size="11.5" text-anchor="middle">1.66×   ⭐ gpt-4o oilasi</text>

  <text x="60" y="194" fill="#94a3b8" font-size="12">o'zbek · cl100k</text>
  <rect x="180" y="180" width="338" height="22" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="349" y="196" fill="#fecaca" font-size="11.5" text-anchor="middle">1.88×   gpt-4 / gpt-3.5</text>

  <text x="540" y="196" fill="#facc15" font-size="12" font-weight="700">→ gpt-4o 12% ARZONROQ</text>

  <!-- why -->
  <rect x="30" y="220" width="820" height="128" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="440" y="244" fill="#cbd5e1" font-size="13.5" font-weight="700" text-anchor="middle">NIMA UCHUN? — uchta sabab</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="52" y="270" fill="#fbbf24">① APOSTROF ALOHIDA TOKEN</text>
    <text x="72" y="288" fill="#94a3b8">"sun'iy"  →  ['sun', "'", 'iy']          3 token, 1 tasi apostrof</text>
    <text x="52" y="312" fill="#fbbf24">② AGGLUTINATSIYA</text>
    <text x="72" y="330" fill="#94a3b8">"Toshkentda" → ['T','osh','k','ent','da']   qo'shimcha so'zni NOYOB qiladi</text>
  </g>
  <text x="52" y="344" fill="#fbbf24" font-size="11.5" font-family="Consolas, monospace">③ LUG'ATDA O'ZBEKCHA DEYARLI YO'Q</text>

  <!-- o200k win -->
  <rect x="30" y="358" width="400" height="52" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="230" y="378" fill="#dcfce7" font-size="12" font-weight="700" text-anchor="middle">o200k lug'atida 'kent' BOR</text>
  <text x="230" y="398" fill="#86efac" font-size="11" text-anchor="middle" font-family="Consolas, monospace">['T','osh','kent','da'] = 4  (5 emas)</text>

  <rect x="450" y="358" width="400" height="52" rx="9" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="650" y="378" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">KONTEKST OYNASI HAM YARIM</text>
  <text x="650" y="398" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="Consolas, monospace">128k → 115 200 en so'z · 61 211 uz so'z</text>

  <rect x="30" y="422" width="820" height="36" rx="9" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="440" y="446" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">🏆 XULOSA: o'zbekcha loyihada gpt-4o oilasini tanlang — sifatliroq VA tokenda arzonroq</text>
</svg>
