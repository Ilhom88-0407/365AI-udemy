<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/></marker></defs>
<text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Model qudrati &#8212; ikkita omil</text>
<text x="470" y="58" text-anchor="middle" font-size="13" fill="#475569">Kutubxona va o&#8216;quvchi analogiyasi</text>
<rect x="24" y="80" width="440" height="150" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
<text x="244" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">1 &#183; DATASET HAJMI</text>
<text x="244" y="132" text-anchor="middle" font-size="30">&#128218;</text>
<text x="244" y="162" text-anchor="middle" font-size="13" fill="#334155">= kitoblar to&#8216;la KUTUBXONA</text>
<text x="244" y="184" text-anchor="middle" font-size="12" fill="#64748B">Qancha ko&#8216;p sifatli kitob bo&#8216;lsa,</text>
<text x="244" y="202" text-anchor="middle" font-size="12" fill="#64748B">shuncha ko&#8216;p o&#8216;rganish mumkin</text>
<text x="244" y="222" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1D4ED8">&#8594; o&#8216;rganish SALOHIYATI</text>
<rect x="480" y="80" width="436" height="150" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="698" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#6D28D9">2 &#183; MODEL HAJMI</text>
<text x="698" y="132" text-anchor="middle" font-size="30">&#127891;</text>
<text x="698" y="162" text-anchor="middle" font-size="13" fill="#334155">= o&#8216;quvchining O&#8216;ZLASHTIRISH quvvati</text>
<text x="698" y="184" text-anchor="middle" font-size="12" fill="#64748B">Ko&#8216;proq parametr &#8594; murakkabroq</text>
<text x="698" y="202" text-anchor="middle" font-size="12" fill="#64748B">naqshlarni ushlash</text>
<text x="698" y="222" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6D28D9">&#8594; o&#8216;rganish SIG&#8216;IMI</text>
<rect x="24" y="246" width="892" height="66" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
<text x="470" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">&#9888; LEKIN: eng katta modelni qurish har doim ham eng yaxshi strategiya emas</text>
<text x="470" y="294" text-anchor="middle" font-size="12.5" fill="#7F1D1D">UNUMDORLIK  &#8596;  NARX SAMARADORLIGI  &#8212; aniq trade-off</text>
<rect x="24" y="326" width="440" height="86" rx="12" fill="#0F172A"/>
<text x="244" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#FBBF24">Sam Altman ma&#8216;lumoti</text>
<text x="244" y="376" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">GPT-4 o&#8216;qitish: $100 mln+</text>
<text x="244" y="398" text-anchor="middle" font-size="11.5" fill="#CBD5E1">Ko&#8216;p tashkilot bir necha marta urina olmaydi &#8212; BIRINCHI safar to&#8216;g&#8216;ri qilishi shart</text>
<rect x="480" y="326" width="436" height="86" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
<text x="698" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">&#10003; Ba&#8216;zan KICHIKROQ model mantiqiyroq</text>
<text x="698" y="374" text-anchor="middle" font-size="12" fill="#065F46">Tez-tez qayta o&#8216;qitiladigan va fine-tune qilinadigan</text>
<text x="698" y="394" text-anchor="middle" font-size="12" fill="#065F46">kichik ixtisoslashgan modellar &#8212; arzonroq va tezroq</text>
