<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="stair" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="55%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="450" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">AI ning uch pog'onasi</text>
  <text x="450" y="62" text-anchor="middle" font-size="13.5" fill="#475569">Narrow → Semi-strong → AGI</text>

  <!-- step 1 -->
  <rect x="56" y="286" width="248" height="112" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="180" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">1 · NARROW AI</text>
  <text x="180" y="334" text-anchor="middle" font-size="11.5" fill="#1E40AF">(weak AI — tor AI)</text>
  <text x="180" y="358" text-anchor="middle" font-size="12" fill="#0F172A">Faqat bitta aniq vazifa</text>
  <text x="180" y="378" text-anchor="middle" font-size="11" fill="#64748B">film tavsiyasi, spam filtri, Face ID</text>
  <rect x="94" y="256" width="172" height="24" rx="12" fill="#2563EB"/>
  <text x="180" y="273" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">✅ BUGUN ATROFIMIZDA</text>

  <!-- step 2 -->
  <rect x="324" y="216" width="248" height="182" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="448" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#6D28D9">2 · SEMI-STRONG AI</text>
  <text x="448" y="264" text-anchor="middle" font-size="11.5" fill="#5B21B6">2022 · ChatGPT, GPT-3.5</text>
  <text x="448" y="288" text-anchor="middle" font-size="12" fill="#0F172A">Keng doiradagi vazifalar</text>
  <g font-size="10.5" fill="#475569">
    <text x="348" y="310">• hazil yozadi</text><text x="348" y="326">• matn tahrirlaydi</text>
    <text x="348" y="342">• rasm o'qiydi/yaratadi</text><text x="348" y="358">• Excel/Python formulasi</text>
    <text x="348" y="374">• matematika yechadi</text><text x="348" y="390">• maslahat beradi</text>
  </g>
  <rect x="362" y="186" width="172" height="24" rx="12" fill="#7C3AED"/>
  <text x="448" y="203" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">✅ TURING TESTIDAN O'TDI</text>

  <!-- step 3 -->
  <rect x="592" y="118" width="252" height="280" rx="12" fill="#FDF2F8" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="718" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#9D174D">3 · AGI</text>
  <text x="718" y="166" text-anchor="middle" font-size="11.5" fill="#9D174D">(strong AI — kuchli AI)</text>
  <text x="718" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0F172A">"insoniyat yaratgan eng</text>
  <text x="718" y="208" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0F172A">qudratli texnologiya"</text>
  <text x="718" y="226" text-anchor="middle" font-size="10.5" fill="#64748B">— Sam Altman, OpenAI CEO</text>
  <line x1="616" y1="240" x2="820" y2="240" stroke="#F9A8D4"/>
  <g font-size="11" fill="#475569">
    <text x="616" y="262">• Bir qancha vazifada</text>
    <text x="616" y="278">  insondan aqlliroq</text>
    <text x="616" y="300">• Mustaqil FAN yaratadi</text>
    <text x="616" y="316">  — yangi kashfiyotlar qiladi</text>
    <text x="616" y="338">• Barcha jamoaviy bilimdan</text>
    <text x="616" y="354">  foydalanadi</text>
  </g>
  <rect x="622" y="368" width="192" height="22" rx="11" fill="#FEE2E2"/>
  <text x="718" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">⏳ HALI ERISHILMAGAN</text>
  <rect x="632" y="88" width="172" height="24" rx="12" fill="#DB2777"/>
  <text x="718" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">"close-ish future"</text>

  <!-- ground -->
  <rect x="40" y="398" width="820" height="6" rx="3" fill="#CBD5E1"/>

  <rect x="40" y="418" width="820" height="38" rx="9" fill="#FEF9C3" stroke="#FDE68A"/>
  <text x="450" y="442" text-anchor="middle" font-size="12.5" fill="#854D0E">⚖️ Bu chegaraga yaqinlashar ekanmiz — etik oqibatlar haqida o'ylash shart</text>
</svg>
