    <text x="340" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Python</text>
    <text x="340" y="222" text-anchor="middle" font-size="11" fill="#64748B">asoslar, API,</text>
    <text x="340" y="236" text-anchor="middle" font-size="11" fill="#64748B">web scraping</text>
  </g>

  <g>
