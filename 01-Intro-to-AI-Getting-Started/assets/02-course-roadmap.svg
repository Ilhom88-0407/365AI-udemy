    <text x="720" y="309" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">8</text>
    <text x="720" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Applied AI</text>
