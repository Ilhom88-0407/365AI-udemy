  <rect x="70" y="146" width="840" height="8" rx="4" fill="url(#path)" opacity="0.25"/>
  <rect x="70" y="296" width="840" height="8" rx="4" fill="url(#path)" opacity="0.25"/>

  <!-- Row 1 -->
  <g>
