    <text x="530" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">NLP</text>
    <text x="530" y="222" text-anchor="middle" font-size="11" fill="#64748B">matnni qayta ishlash,</text>
    <text x="530" y="236" text-anchor="middle" font-size="11" fill="#64748B">vektorlashtirish</text>
