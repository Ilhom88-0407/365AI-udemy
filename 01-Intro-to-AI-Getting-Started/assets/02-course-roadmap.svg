  <line x1="758" y1="300" x2="790" y2="300" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#ar2)"/>

  <rect x="70" y="422" width="840" height="40" rx="10" fill="#FEF9C3" stroke="#FDE68A"/>
  <text x="490" y="447" text-anchor="middle" font-size="13" font-weight="600" fill="#854D0E">⚠️ Ma'ruzalarni tashlab ketmang — har bir bosqich oldingisi ustiga quriladi</text>
