<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="940" height="540" fill="#0f172a" rx="14"/>
  <text x="470" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Metrika tanlovi JAVOBNI o'zgartiradi</text>
  <text x="470" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">Bir xil ma'lumot · bir xil so'rov [4, 0, 1] — lekin natija BOSHQA</text>

  <!-- table -->
  <rect x="24" y="74" width="892" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="44" y="98" fill="#bae6fd" font-size="13" font-weight="700" font-family="Consolas, monospace">hayvon      vektor         |v|     evklid   manhetten   skalyar   kosinus</text>
  <line x1="44" y1="106" x2="896" y2="106" stroke="#475569" stroke-width="1"/>
  <text x="44" y="126" fill="#4ade80" font-size="12.5" font-family="Consolas, monospace">Dog         [4, 0, 1]      4.12     0.0000      0.0      17.0    1.0000</text>
  <text x="44" y="146" fill="#94a3b8" font-size="12.5" font-family="Consolas, monospace">Cat         [4, 0, 1]      4.12     0.0000      0.0      17.0    1.0000</text>
  <text x="44" y="166" fill="#94a3b8" font-size="12.5" font-family="Consolas, monospace">Chicken     [2, 2, 1]      3.00     2.8284      4.0       9.0    0.7276</text>
  <text x="44" y="186" fill="#f87171" font-size="12.5" font-family="Consolas, monospace">Mantis      [6, 2, 3]      7.00     3.4641      6.0      27.0    0.9355</text>
  <text x="44" y="206" fill="#94a3b8" font-size="12.5" font-family="Consolas, monospace">Elephant    [4, 0, 1]      4.12     0.0000      0.0      17.0    1.0000</text>

  <!-- rankings -->
  <rect x="24" y="240" width="440" height="132" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="244" y="264" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">✅ TO'G'RI natija</text>
  <text x="44" y="290" fill="#86efac" font-size="12" font-family="Consolas, monospace">evklid    → Dog · Cat · Elephant</text>
  <text x="44" y="312" fill="#86efac" font-size="12" font-family="Consolas, monospace">manhetten → Dog · Cat · Elephant</text>
  <text x="44" y="334" fill="#86efac" font-size="12" font-family="Consolas, monospace">kosinus   → Dog · Cat · Elephant</text>
  <text x="44" y="358" fill="#4ade80" font-size="11.5">so'rov AYNAN Dog vektori — u birinchi bo'lishi kerak</text>

  <rect x="480" y="240" width="436" height="132" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="698" y="264" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">💥 SKALYAR — noto'g'ri</text>
  <text x="500" y="290" fill="#fca5a5" font-size="12" font-family="Consolas, monospace">skalyar   → Mantis · Dog · Cat</text>
  <text x="500" y="316" fill="#f87171" font-size="12" font-weight="700">Mantis BIRINCHI — garchi TENG EMAS</text>
  <text x="500" y="338" fill="#fca5a5" font-size="11.5">sabab: |Mantis| = 7.00 · |Dog| = 4.12</text>
  <text x="500" y="358" fill="#fca5a5" font-size="11.5">skalyar = yo'nalish × MAGNITUDA → uzun vektor yutadi</text>

  <!-- cosine vs dot -->
  <rect x="24" y="388" width="440" height="128" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="244" y="412" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">Skalyar ↔ Kosinus farqi</text>
  <text x="44" y="436" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">A=[1,1]  B=[10,10]  D=[0.1,0.1]  (bir yo'nalish)</text>
  <text x="44" y="458" fill="#f87171" font-size="11.5" font-family="Consolas, monospace">skalyar: B=20.00  D=0.20     → 100× farq</text>
  <text x="44" y="480" fill="#4ade80" font-size="11.5" font-family="Consolas, monospace">kosinus: B=1.0000 D=1.0000   → ⭐ BIR XIL</text>
  <text x="44" y="504" fill="#fbbf24" font-size="11.5" font-weight="700">⭐ MATN UCHUN — DOIM KOSINUS</text>

  <!-- layers -->
  <rect x="480" y="388" width="436" height="128" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="698" y="412" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">⚠️ Uch qatlam — tartib muhim</text>
  <text x="500" y="438" fill="#fcd34d" font-size="11.5">① MA'LUMOT SIFATI — iflos matn, 256 token chegarasi</text>
  <text x="500" y="460" fill="#4ade80" font-size="11.5" font-weight="700">② EMBEDDING MODELI — ⭐ ENG MUHIM</text>
  <text x="500" y="482" fill="#fcd34d" font-size="11.5">③ MASOFA METRIKASI — faqat ①② to'g'ri bo'lsa</text>
  <text x="500" y="506" fill="#f87171" font-size="11.5" font-weight="700">💥 Ko'p kishi ③ ni sozlaydi, muammo esa ② da</text>
</svg>
