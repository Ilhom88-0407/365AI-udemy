<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="520" fill="#0f172a"/>
  <text x="440" y="36" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Kesish (slicing)</text>
  <text x="440" y="62" text-anchor="middle" fill="#94a3b8" font-size="15" font-family="Consolas, monospace">ro'yxat[boshlanish : tugash]</text>

  <g font-family="Consolas, monospace">
    <rect x="24" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="90" y="116" text-anchor="middle" fill="#e2e8f0" font-size="14">'John'</text>
    <rect x="164" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="230" y="116" text-anchor="middle" fill="#e2e8f0" font-size="14">'Leila'</text>
    <rect x="304" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="370" y="116" text-anchor="middle" fill="#e2e8f0" font-size="14">'Maria'</text>
    <rect x="444" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="510" y="116" text-anchor="middle" fill="#e2e8f0" font-size="14">'Dwayne'</text>
    <rect x="584" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="650" y="116" text-anchor="middle" fill="#e2e8f0" font-size="14">'George'</text>
    <rect x="724" y="84" width="132" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="790" y="116" text-anchor="middle" fill="#e2e8f0" font-size="13">'Catherine'</text>

    <text x="90" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">0</text>
    <text x="230" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">1</text>
    <text x="370" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">2</text>
    <text x="510" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">3</text>
    <text x="650" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">4</text>
    <text x="790" y="158" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">5</text>
    <text x="90" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-6</text>
    <text x="230" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-5</text>
    <text x="370" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-4</text>
    <text x="510" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-3</text>
    <text x="650" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-2</text>
    <text x="790" y="178" text-anchor="middle" fill="#f472b6" font-size="14">-1</text>
  </g>

  <rect x="164" y="196" width="272" height="34" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="219" fill="#38bdf8" font-size="15" font-family="Consolas, monospace">[1:3]  →  ['Leila', 'Maria']</text>
  <text x="700" y="219" fill="#94a3b8" font-size="12">1 dan, 3 GACHA (3 KIRMAYDI)</text>

  <rect x="24" y="240" width="272" height="34" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="310" y="263" fill="#4ade80" font-size="15" font-family="Consolas, monospace">[:2]   →  ['John', 'Leila']</text>
  <text x="620" y="263" fill="#94a3b8" font-size="12">boshidan 2 tagacha</text>

  <rect x="584" y="284" width="272" height="34" rx="6" fill="#7c2d12" stroke="#fbbf24" stroke-width="2"/>
  <text x="150" y="307" fill="#fbbf24" font-size="15" font-family="Consolas, monospace">[4:]   →  ['George', 'Catherine']</text>
  <text x="450" y="307" fill="#94a3b8" font-size="12">4-dan oxirigacha</text>

  <rect x="584" y="328" width="272" height="34" rx="6" fill="#500724" stroke="#f472b6" stroke-width="2"/>
  <text x="150" y="351" fill="#f472b6" font-size="15" font-family="Consolas, monospace">[-2:]  →  ['George', 'Catherine']</text>
  <text x="450" y="351" fill="#94a3b8" font-size="12">oxirgi 2 ta</text>

  <rect x="24" y="380" width="832" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="46" y="408" fill="#f87171" font-size="16" font-weight="bold">⚠️  IKKINCHI RAQAM — kerakli oxirgi pozitsiyadan BITTA YUQORI</text>
  <text x="46" y="430" fill="#fecaca" font-size="14">1 va 2-pozitsiya kerak bo'lsa → [1:3]   chunki  2 + 1 = 3</text>

  <rect x="24" y="452" width="832" height="56" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="46" y="478" fill="#38bdf8" font-size="15" font-weight="bold">🔑 Farqni eslang</text>
  <text x="46" y="500" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">P[1]   →  'Leila'      (BITTA element)          P[1:2] →  ['Leila']   (RO'YXAT)</text>
</svg>
