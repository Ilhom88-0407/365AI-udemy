<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="500" fill="#0f172a"/>
  <text x="440" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Uchta ketma-ketlik turi</text>

  <rect x="24" y="66" width="272" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" fill="#38bdf8" font-size="21" font-weight="bold">LIST</text>
  <text x="160" y="122" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="bold" font-family="Consolas, monospace">[ ]</text>
  <text x="44" y="154" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">['John', 'Leila', 'Cate']</text>
  <text x="44" y="184" fill="#4ade80" font-size="14">✅ O'zgartirish mumkin</text>
  <text x="44" y="208" fill="#4ade80" font-size="14">✅ append / extend / del</text>
  <text x="44" y="232" fill="#4ade80" font-size="14">✅ sort / index</text>
  <text x="44" y="256" fill="#4ade80" font-size="14">✅ Indeks va kesish</text>
  <text x="44" y="284" fill="#94a3b8" font-size="13">Qachon: ma'lumot O'ZGARADI</text>

  <rect x="304" y="66" width="272" height="230" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="440" y="98" text-anchor="middle" fill="#f472b6" font-size="21" font-weight="bold">TUPLE</text>
  <text x="440" y="122" text-anchor="middle" fill="#f472b6" font-size="24" font-weight="bold" font-family="Consolas, monospace">( )</text>
  <text x="324" y="154" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">(40, 41, 42)</text>
  <text x="324" y="184" fill="#f87171" font-size="14">❌ O'zgartirib BO'LMAYDI</text>
  <text x="324" y="208" fill="#f87171" font-size="14">❌ append / del yo'q</text>
  <text x="324" y="232" fill="#4ade80" font-size="14">✅ Indeks va kesish</text>
  <text x="324" y="256" fill="#4ade80" font-size="14">✅ Python'ning STANDART turi</text>
  <text x="324" y="284" fill="#94a3b8" font-size="13">Qachon: ma'lumot O'ZGARMAYDI</text>

  <rect x="584" y="66" width="272" height="230" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="720" y="98" text-anchor="middle" fill="#4ade80" font-size="21" font-weight="bold">DICT</text>
  <text x="720" y="122" text-anchor="middle" fill="#4ade80" font-size="24" font-weight="bold" font-family="Consolas, monospace">{ }</text>
  <text x="604" y="154" fill="#e2e8f0" font-size="13" font-family="Consolas, monospace">{'k1': 'cat', 'k2': 'dog'}</text>
  <text x="604" y="184" fill="#4ade80" font-size="14">✅ O'zgartirish mumkin</text>
  <text x="604" y="208" fill="#fbbf24" font-size="14">🔑 KALIT bilan murojaat</text>
  <text x="604" y="232" fill="#f87171" font-size="14">❌ Indeks va kesish YO'Q</text>
  <text x="604" y="256" fill="#4ade80" font-size="14">✅ .get() — xatosiz</text>
  <text x="604" y="284" fill="#94a3b8" font-size="13">Qachon: NOM bilan izlash</text>

  <rect x="24" y="316" width="832" height="80" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="46" y="344" fill="#fbbf24" font-size="16" font-weight="bold">Murojaat qilish usuli</text>
  <text x="46" y="372" fill="#38bdf8" font-size="15" font-family="Consolas, monospace">list[1]</text>
  <text x="180" y="372" fill="#f472b6" font-size="15" font-family="Consolas, monospace">tuple[0]</text>
  <text x="330" y="372" fill="#4ade80" font-size="15" font-family="Consolas, monospace">dict['k1']</text>
  <text x="500" y="372" fill="#94a3b8" font-size="14">← barchasi kvadrat qavs bilan!</text>
  <text x="46" y="390" fill="#94a3b8" font-size="13">list/tuple — POZITSIYA raqami        dict — KALIT nomi</text>

  <rect x="24" y="410" width="832" height="76" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="46" y="438" fill="#38bdf8" font-size="16" font-weight="bold">💡 Immutable (o'zgarmas) nima uchun kerak?</text>
  <text x="46" y="464" fill="#e2e8f0" font-size="14">Tuple'ni tasodifan o'zgartirib bo'lmaydi — bu ma'lumotni HIMOYALAYDI.</text>
  <text x="46" y="482" fill="#e2e8f0" font-size="14">Shuning uchun funksiyalar bir necha qiymatni tuple sifatida qaytaradi.</text>
</svg>
