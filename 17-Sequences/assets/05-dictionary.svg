<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="480" fill="#0f172a"/>
  <text x="430" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Lug'at (dictionary) — kalit-qiymat juftliklari</text>

  <text x="430" y="68" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Consolas, monospace">dict = {'k1': "cat", 'k2': "dog", 'k3': "mouse", 'k4': "fish"}</text>

  <g>
    <rect x="80" y="92" width="150" height="48" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="155" y="122" text-anchor="middle" fill="#38bdf8" font-size="17" font-family="Consolas, monospace">'k1'</text>
    <text x="248" y="122" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>
    <rect x="270" y="92" width="150" height="48" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="345" y="122" text-anchor="middle" fill="#4ade80" font-size="17" font-family="Consolas, monospace">'cat'</text>

    <rect x="80" y="150" width="150" height="48" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="155" y="180" text-anchor="middle" fill="#38bdf8" font-size="17" font-family="Consolas, monospace">'k2'</text>
    <text x="248" y="180" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>
    <rect x="270" y="150" width="150" height="48" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="345" y="180" text-anchor="middle" fill="#4ade80" font-size="17" font-family="Consolas, monospace">'dog'</text>

    <rect x="80" y="208" width="150" height="48" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="155" y="238" text-anchor="middle" fill="#38bdf8" font-size="17" font-family="Consolas, monospace">'k3'</text>
    <text x="248" y="238" text-anchor="middle" fill="#94a3b8" font-size="22">→</text>
    <rect x="270" y="208" width="150" height="48" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="345" y="238" text-anchor="middle" fill="#4ade80" font-size="17" font-family="Consolas, monospace">'mouse'</text>

    <text x="155" y="278" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">KALIT (key)</text>
    <text x="345" y="278" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="bold">QIYMAT (value)</text>
  </g>

  <rect x="460" y="92" width="376" height="186" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="482" y="120" fill="#fbbf24" font-size="16" font-weight="bold">AMALLAR</text>
  <text x="482" y="150" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">dict['k1']         →  'cat'</text>
  <text x="482" y="174" fill="#94a3b8" font-size="12">olish — indeks emas, KALIT bilan</text>
  <text x="482" y="202" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">dict['k5'] = 'parrot'</text>
  <text x="482" y="222" fill="#94a3b8" font-size="12">yangi kalit → QO'SHILADI</text>
  <text x="482" y="248" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">dict['k2'] = 'squirrel'</text>
  <text x="482" y="268" fill="#94a3b8" font-size="12">mavjud kalit → ALMASHTIRILADI</text>

  <rect x="24" y="300" width="404" height="94" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="46" y="328" fill="#f87171" font-size="16" font-weight="bold">❌  dict['Coach']</text>
  <text x="46" y="354" fill="#fecaca" font-size="14" font-family="Consolas, monospace">KeyError: 'Coach'</text>
  <text x="46" y="380" fill="#fecaca" font-size="13">kalit yo'q bo'lsa — dastur TO'XTAYDI</text>

  <rect x="444" y="300" width="392" height="94" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="466" y="328" fill="#4ade80" font-size="16" font-weight="bold">✅  dict.get('Coach')</text>
  <text x="466" y="354" fill="#bbf7d0" font-size="14" font-family="Consolas, monospace">None</text>
  <text x="466" y="380" fill="#bbf7d0" font-size="13">kalit yo'q bo'lsa — XATO YO'Q, None qaytadi</text>

  <rect x="24" y="410" width="812" height="60" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="46" y="438" fill="#38bdf8" font-size="15" font-weight="bold">💡 Qiymat sifatida RO'YXAT ham bo'lishi mumkin</text>
  <text x="46" y="460" fill="#e2e8f0" font-size="14" font-family="Consolas, monospace">{'dep_1': 'Peter', 'dep_2': ['Jennifer', 'Michael', 'Tommy']}</text>
</svg>
