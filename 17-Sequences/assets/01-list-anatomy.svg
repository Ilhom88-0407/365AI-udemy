<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="460" fill="#0f172a"/>
  <text x="440" y="38" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="bold">Ro'yxat (list) va indekslar</text>

  <text x="440" y="70" text-anchor="middle" fill="#94a3b8" font-size="15" font-family="Consolas, monospace">Participants = ['John', 'Leila', 'Gregory', 'Cate']</text>

  <rect x="60" y="94" width="180" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="134" text-anchor="middle" fill="#e2e8f0" font-size="19" font-family="Consolas, monospace">'John'</text>
  <rect x="250" y="94" width="180" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="340" y="134" text-anchor="middle" fill="#e2e8f0" font-size="19" font-family="Consolas, monospace">'Leila'</text>
  <rect x="440" y="94" width="180" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="530" y="134" text-anchor="middle" fill="#e2e8f0" font-size="19" font-family="Consolas, monospace">'Gregory'</text>
  <rect x="630" y="94" width="180" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="720" y="134" text-anchor="middle" fill="#e2e8f0" font-size="19" font-family="Consolas, monospace">'Cate'</text>

  <text x="150" y="186" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="bold" font-family="Consolas, monospace">0</text>
  <text x="340" y="186" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="bold" font-family="Consolas, monospace">1</text>
  <text x="530" y="186" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="bold" font-family="Consolas, monospace">2</text>
  <text x="720" y="186" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="bold" font-family="Consolas, monospace">3</text>
  <text x="30" y="186" fill="#4ade80" font-size="13" font-weight="bold">musbat →</text>

  <text x="150" y="216" text-anchor="middle" fill="#f472b6" font-size="19" font-weight="bold" font-family="Consolas, monospace">-4</text>
  <text x="340" y="216" text-anchor="middle" fill="#f472b6" font-size="19" font-weight="bold" font-family="Consolas, monospace">-3</text>
  <text x="530" y="216" text-anchor="middle" fill="#f472b6" font-size="19" font-weight="bold" font-family="Consolas, monospace">-2</text>
  <text x="720" y="216" text-anchor="middle" fill="#f472b6" font-size="19" font-weight="bold" font-family="Consolas, monospace">-1</text>
  <text x="30" y="216" fill="#f472b6" font-size="13" font-weight="bold">← manfiy</text>

  <rect x="60" y="240" width="360" height="104" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="82" y="268" fill="#38bdf8" font-size="15" font-weight="bold">OLISH</text>
  <text x="82" y="294" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">Participants[1]   →  'Leila'</text>
  <text x="82" y="316" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">Participants[-1]  →  'Cate'</text>
  <text x="82" y="338" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">Participants[-2]  →  'Gregory'</text>

  <rect x="450" y="240" width="360" height="104" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="472" y="268" fill="#fbbf24" font-size="15" font-weight="bold">O'ZGARTIRISH va O'CHIRISH</text>
  <text x="472" y="294" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">Participants[3] = 'Maria'</text>
  <text x="472" y="316" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">del Participants[2]</text>
  <text x="472" y="338" fill="#94a3b8" font-size="13">→ keyingi indekslar SURILADI</text>

  <rect x="60" y="364" width="750" height="76" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="82" y="392" fill="#f87171" font-size="16" font-weight="bold">⚠️  Faqat KVADRAT QAVSLAR  [ ]</text>
  <text x="82" y="418" fill="#fecaca" font-size="14" font-family="Consolas, monospace">[ ]  ro'yxat        ( )  tuple        { }  lug'at</text>
  <text x="82" y="436" fill="#fecaca" font-size="13">Sanash 0 dan boshlanadi — manfiy indeksda esa -1 dan</text>
</svg>
