<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1020" height="520" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="510" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">AI sohasidagi uchta lavozim</text>
  <text x="510" y="58" text-anchor="middle" font-size="13" fill="#475569">⚠️ Soha yosh — ish e'lonlarida nomlar chalkash. Bu — ma'ruzachining talqini.</text>

  <!-- key distinction -->
  <rect x="24" y="76" width="972" height="52" rx="11" fill="#0F172A"/>
  <text x="510" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#FBBF24">🔑 ASOSIY FARQ</text>
  <text x="290" y="120" text-anchor="middle" font-size="12.5" fill="#93C5FD">AI DEVELOPER → foundation MODELLARNI quradi</text>
  <text x="740" y="120" text-anchor="middle" font-size="12.5" fill="#6EE7B7">AI ENGINEER → foundation modellar USTIGA ilova quradi</text>

  <!-- STRATEGIST -->
  <rect x="24" y="142" width="312" height="308" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="24" y="142" width="312" height="42" rx="12" fill="#2563EB"/>
  <rect x="24" y="170" width="312" height="14" fill="#2563EB"/>
  <text x="180" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AI STRATEGIST</text>
  <text x="180" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">"nomi texnik emas, LEKIN bu TEXNIK rol"</text>

  <text x="44" y="234" font-size="11.5" font-weight="700" fill="#1D4ED8">NIMA QILADI</text>
  <g font-size="11" fill="#334155">
    <text x="52" y="254">• Biznes strategiyasiga MOS AI use case</text>
    <text x="52" y="272">• Optimal model turini tanlashda yo'l ko'rsatish</text>
    <text x="52" y="290">• Production'ga joylashtirishni tasavvur qilish</text>
    <text x="52" y="308">• Baholash va optimallashtirish protseduralari</text>
    <text x="52" y="326">• 📣 AI EVANGELIZM — kompaniya bo'ylab targ'ib</text>
  </g>

  <text x="44" y="352" font-size="11.5" font-weight="700" fill="#1D4ED8">KELIB CHIQISHI</text>
  <text x="52" y="372" font-size="11" fill="#334155">Data scientist + biznes tajribasi</text>

  <text x="44" y="396" font-size="11.5" font-weight="700" fill="#1D4ED8">LAVOZIM DARAJASI</text>
  <text x="52" y="416" font-size="11" fill="#334155">Direktor · jamoa rahbari · VP · C-suite</text>
  <rect x="44" y="424" width="272" height="20" rx="6" fill="#DBEAFE"/>
  <text x="180" y="438" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1D4ED8">yoki KONSULTANT sifatida</text>

  <!-- DEVELOPER -->
  <rect x="354" y="142" width="312" height="308" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="354" y="142" width="312" height="42" rx="12" fill="#7C3AED"/>
  <rect x="354" y="170" width="312" height="14" fill="#7C3AED"/>
  <text x="510" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AI DEVELOPER</text>
  <text x="510" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">"tech olamidagi ENG TALABCHAN ishlardan biri"</text>

  <text x="374" y="234" font-size="11.5" font-weight="700" fill="#6D28D9">NIMA QILADI</text>
  <g font-size="11" fill="#334155">
    <text x="382" y="254">• 🔬 R&amp;D — chegaralarni surish tadqiqoti</text>
    <text x="382" y="272">• Arxitektura va model design tanlash</text>
    <text x="382" y="290">• Dataset engineering</text>
    <text x="382" y="308">• Pre-training (xato uchun joy YO'Q)</text>
    <text x="382" y="326">• Baholash va takomillashtirish</text>
  </g>

  <text x="374" y="352" font-size="11.5" font-weight="700" fill="#6D28D9">KO'NIKMALAR</text>
  <g font-size="10.5" fill="#334155">
    <text x="382" y="370">Python · NumPy · pandas · statistika</text>
    <text x="382" y="386">chiziqli algebra · analiz · ehtimollik</text>
    <text x="382" y="402">NLP · transformer · embedding · tokenizatsiya</text>
    <text x="382" y="418">Docker · DevOps · API design · cloud</text>
  </g>
  <rect x="374" y="426" width="272" height="18" rx="6" fill="#EDE9FE"/>
  <text x="510" y="439" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6D28D9">kam odam malakali</text>

  <!-- ENGINEER -->
  <rect x="684" y="142" width="312" height="308" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
  <rect x="684" y="142" width="312" height="42" rx="12" fill="#059669"/>
  <rect x="684" y="170" width="312" height="14" fill="#059669"/>
  <text x="840" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AI ENGINEER ⭐</text>
  <text x="840" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">"kelajakning eng qizg'in karyeralaridan biri"</text>

  <text x="704" y="234" font-size="11.5" font-weight="700" fill="#047857">NIMA QILADI</text>
  <g font-size="11" fill="#334155">
    <text x="712" y="254">• 🌉 Foundation model ⟷ mahsulot KO'PRIGI</text>
    <text x="712" y="272">• Sayt, mobil ilova, IoT, smart home ga ulash</text>
    <text x="712" y="290">• Fine-tuning · prompt engineering · RAG</text>
    <text x="712" y="308">• UX va javob sifatiga e'tibor</text>
    <text x="712" y="326">• Model o'qitish EMAS — INTEGRATSIYA</text>
  </g>

  <text x="704" y="352" font-size="11.5" font-weight="700" fill="#047857">KO'NIKMALAR</text>
  <g font-size="10.5" fill="#334155">
    <text x="712" y="370">Python · pandas · NumPy</text>
    <text x="712" y="386">Hugging Face · LangChain · Pinecone</text>
    <text x="712" y="402">LLM va NLP tushunchasi · cloud · Docker</text>
    <text x="712" y="418">Bakalavr/magistr: CS, matematika, statistika...</text>
  </g>
  <rect x="704" y="426" width="272" height="18" rx="6" fill="#D1FAE5"/>
  <text x="840" y="439" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">talab EKSPONENSIAL o'sadi</text>

  <rect x="24" y="462" width="972" height="42" rx="10" fill="#FEF9C3" stroke="#FDE68A"/>
  <text x="510" y="480" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854D0E">Bu kursning nomi — "AI Engineer Course". Ya'ni siz 3-ustunga tayyorlanyapsiz.</text>
  <text x="510" y="497" text-anchor="middle" font-size="11.5" fill="#713F12">AI muhandisligi AI developer'dan biroz kamroq talabchan, lekin ish o'rinlari ancha ko'p</text>
</svg>
