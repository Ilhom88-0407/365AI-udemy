<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="920" height="380" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Ma'lumot qayerdan kelib, qayerga boradi</text>

  <!-- Column 1: sources -->
  <rect x="28" y="62" width="228" height="286" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="28" y="62" width="228" height="38" rx="12" fill="#2563EB"/>
  <rect x="28" y="88" width="228" height="12" fill="#2563EB"/>
  <text x="142" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1 · MANBALAR</text>
  <g font-size="13" fill="#1E293B">
    <text x="48" y="128">📡  Sensorlar / IoT</text>
    <text x="48" y="156">🎥  Video</text>
    <text x="48" y="184">🎙  Audio</text>
    <text x="48" y="212">📝  Matnlar</text>
    <text x="48" y="240">📱  Ijtimoiy tarmoqlar</text>
    <text x="48" y="268">🛰  Sun'iy yo'ldosh</text>
    <text x="48" y="296">🌐  Brauzer tarixi</text>
  </g>
  <text x="142" y="330" text-anchor="middle" font-size="11.5" fill="#64748B">Xom (raw) ma'lumot</text>

  <line x1="258" y1="205" x2="298" y2="205" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- Column 2: collection -->
  <rect x="302" y="62" width="228" height="286" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="302" y="62" width="228" height="38" rx="12" fill="#7C3AED"/>
  <rect x="302" y="88" width="228" height="12" fill="#7C3AED"/>
  <text x="416" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2 · YIG'ISH USULI</text>
  <g font-size="13" fill="#1E293B">
    <rect x="322" y="118" width="188" height="46" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="416" y="140" text-anchor="middle" font-weight="700">Web scraping</text>
    <text x="416" y="157" text-anchor="middle" font-size="11.5" fill="#64748B">saytdan qirib olish</text>

    <rect x="322" y="176" width="188" height="46" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="416" y="198" text-anchor="middle" font-weight="700">API</text>
    <text x="416" y="215" text-anchor="middle" font-size="11.5" fill="#64748B">rasmiy so'rov interfeysi</text>

    <rect x="322" y="234" width="188" height="46" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="416" y="256" text-anchor="middle" font-weight="700">Big data analytics</text>
    <text x="416" y="273" text-anchor="middle" font-size="11.5" fill="#64748B">katta oqimlarni qayta ishlash</text>
  </g>
  <text x="416" y="316" text-anchor="middle" font-size="11.5" fill="#64748B">Hammasi 0 va 1 ga aylanadi</text>

  <line x1="532" y1="205" x2="572" y2="205" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- Column 3: model -->
  <rect x="576" y="62" width="316" height="286" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <rect x="576" y="62" width="316" height="38" rx="12" fill="#059669"/>
  <rect x="576" y="88" width="316" height="12" fill="#059669"/>
  <text x="734" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3 · AI MODEL</text>

  <g font-size="12.5" fill="#1E293B">
    <rect x="598" y="118" width="272" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="734" y="140" text-anchor="middle">Algoritmni o'rgatish  (train)</text>
    <rect x="598" y="160" width="272" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="734" y="182" text-anchor="middle">Modelni takomillashtirish  (refine)</text>
    <rect x="598" y="202" width="272" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="734" y="224" text-anchor="middle">Tizimni kuchaytirish  (enhance)</text>
  </g>

  <rect x="598" y="252" width="272" height="72" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="734" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#991B1B">⚠  Garbage in, garbage out</text>
  <text x="734" y="299" text-anchor="middle" font-size="12" fill="#7F1D1D">Sifatsiz ma'lumot kirsa —</text>
  <text x="734" y="315" text-anchor="middle" font-size="12" fill="#7F1D1D">eng zo'r algoritm ham qutqara olmaydi</text>
</svg>
