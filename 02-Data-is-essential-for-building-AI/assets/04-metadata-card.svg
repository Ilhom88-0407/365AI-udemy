<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCA5A5"/>
    </linearGradient>
  </defs>
  <rect width="860" height="430" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Bitta fotosurat — ikki qavat ma'lumot</text>
  <text x="430" y="62" text-anchor="middle" font-size="13.5" fill="#475569">Ko'zga ko'rinadigan rasm va uning ortidagi metadata</text>

  <!-- photo -->
  <rect x="44" y="88" width="300" height="230" rx="12" fill="url(#ph)" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="120" cy="150" r="24" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="70,300 150,200 210,262 260,214 320,300" fill="#92400E" opacity="0.35"/>
  <text x="194" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">DATA — biz ko'radigan qism</text>
  <text x="194" y="378" text-anchor="middle" font-size="12.5" fill="#64748B">itlar datasetidagi 1 ta rasm</text>

  <line x1="356" y1="200" x2="410" y2="200" stroke="#F59E0B" stroke-width="3" marker-end="url(#a4)"/>

  <!-- metadata card -->
  <rect x="420" y="88" width="396" height="230" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="420" y="88" width="396" height="38" rx="12" fill="#1E293B"/>
  <rect x="420" y="114" width="396" height="12" fill="#1E293B"/>
  <text x="440" y="114" font-size="14" font-weight="700" fill="#93C5FD">📋  METADATA</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <text x="440" y="152" fill="#64748B">name</text><text x="580" y="152" fill="#E2E8F0">dog_04217.jpg</text>
    <text x="440" y="176" fill="#64748B">asset_type</text><text x="580" y="176" fill="#E2E8F0">image / JPEG</text>
    <text x="440" y="200" fill="#64748B">capture_date</text><text x="580" y="200" fill="#E2E8F0">2025-03-14  16:42</text>
    <text x="440" y="224" fill="#64748B">photographer</text><text x="580" y="224" fill="#E2E8F0">A. Karimova</text>
    <text x="440" y="248" fill="#64748B">file_size</text><text x="580" y="248" fill="#E2E8F0">2.4 MB</text>
    <text x="440" y="272" fill="#64748B">resolution</text><text x="580" y="272" fill="#E2E8F0">4032 x 3024</text>
    <text x="440" y="296" fill="#64748B">usage</text><text x="580" y="296" fill="#E2E8F0">train / licensed</text>
  </g>

  <text x="618" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">METADATA — ma'lumot haqidagi ma'lumot</text>
  <text x="618" y="378" text-anchor="middle" font-size="12.5" fill="#64748B">rasmni ochmasdan turib uni topish, saralash, tekshirish</text>

  <rect x="44" y="396" width="772" height="0.5" fill="#E2E8F0"/>
  <text x="430" y="418" text-anchor="middle" font-size="12.5" fill="#475569">Metadata bo'lmasa — 10 000 ta rasm shunchaki tartibsiz uyum bo'lib qoladi</text>
</svg>
