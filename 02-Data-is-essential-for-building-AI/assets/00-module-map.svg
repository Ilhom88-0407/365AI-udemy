  </g>

  <line x1="460" y1="151" x2="488" y2="151" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#am)"/>

  <g>
    <rect x="494" y="76" width="192" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <circle cx="524" cy="106" r="16" fill="#059669"/>
