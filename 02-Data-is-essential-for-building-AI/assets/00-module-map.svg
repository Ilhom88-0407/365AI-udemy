    <text x="552" y="112" font-size="14" font-weight="700" fill="#065F46">TAYYORLIGI</text>
    <text x="514" y="146" font-size="13" fill="#1E293B">Belgilanganmi?</text>
    <text x="514" y="172" font-size="12.5" fill="#475569">Labelled yoki</text>
