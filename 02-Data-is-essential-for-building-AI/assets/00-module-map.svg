  <rect width="900" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">02-modul xaritasi: ma'lumotning 4 ta savoli</text>

  <g>
