<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="560" fill="#0f172a"/>
  <text x="440" y="40" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold">Mantiqiy operatorlar: not · and · or</text>

  <!-- AND -->
  <rect x="28" y="66" width="266" height="196" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="161" y="98" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="bold" font-family="Consolas, monospace">and</text>
  <text x="161" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">IKKALASI ham True bo'lsa</text>
  <text x="52" y="152" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">True  and True</text>
  <text x="228" y="152" fill="#4ade80" font-size="15" font-family="Consolas, monospace">True</text>
  <text x="52" y="180" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">True  and False</text>
  <text x="228" y="180" fill="#f87171" font-size="15" font-family="Consolas, monospace">False</text>
  <text x="52" y="208" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">False and True</text>
  <text x="228" y="208" fill="#f87171" font-size="15" font-family="Consolas, monospace">False</text>
  <text x="52" y="236" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">False and False</text>
  <text x="228" y="236" fill="#f87171" font-size="15" font-family="Consolas, monospace">False</text>

  <!-- OR -->
  <rect x="308" y="66" width="266" height="196" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="441" y="98" text-anchor="middle" fill="#4ade80" font-size="24" font-weight="bold" font-family="Consolas, monospace">or</text>
  <text x="441" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">KAMIDA BITTASI True bo'lsa</text>
  <text x="332" y="152" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">True  or True</text>
  <text x="508" y="152" fill="#4ade80" font-size="15" font-family="Consolas, monospace">True</text>
  <text x="332" y="180" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">True  or False</text>
  <text x="508" y="180" fill="#4ade80" font-size="15" font-family="Consolas, monospace">True</text>
  <text x="332" y="208" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">False or True</text>
  <text x="508" y="208" fill="#4ade80" font-size="15" font-family="Consolas, monospace">True</text>
  <text x="332" y="236" fill="#e2e8f0" font-size="15" font-family="Consolas, monospace">False or False</text>
  <text x="508" y="236" fill="#f87171" font-size="15" font-family="Consolas, monospace">False</text>

  <!-- NOT -->
  <rect x="588" y="66" width="264" height="196" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="720" y="98" text-anchor="middle" fill="#f472b6" font-size="24" font-weight="bold" font-family="Consolas, monospace">not</text>
  <text x="720" y="120" text-anchor="middle" fill="#94a3b8" font-size="13">TESKARISIGA aylantiradi</text>
  <text x="620" y="160" fill="#e2e8f0" font-size="16" font-family="Consolas, monospace">not True</text>
  <text x="770" y="160" fill="#f87171" font-size="16" font-family="Consolas, monospace">False</text>
  <text x="620" y="196" fill="#e2e8f0" font-size="16" font-family="Consolas, monospace">not False</text>
  <text x="770" y="196" fill="#4ade80" font-size="16" font-family="Consolas, monospace">True</text>
  <text x="620" y="236" fill="#94a3b8" font-size="13">Faqat BITTA qiymat bilan</text>

  <!-- Priority -->
  <text x="440" y="302" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="bold">⚡ Muhimlik tartibi</text>
  <rect x="140" y="320" width="180" height="58" rx="10" fill="#7c2d12" stroke="#f472b6" stroke-width="2"/>
  <text x="230" y="345" text-anchor="middle" fill="#f472b6" font-size="20" font-weight="bold" font-family="Consolas, monospace">not</text>
  <text x="230" y="368" text-anchor="middle" fill="#fed7aa" font-size="13">1 — birinchi</text>
  <text x="340" y="355" text-anchor="middle" fill="#94a3b8" font-size="24">→</text>
  <rect x="360" y="320" width="180" height="58" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="345" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold" font-family="Consolas, monospace">and</text>
  <text x="450" y="368" text-anchor="middle" fill="#bae6fd" font-size="13">2 — ikkinchi</text>
  <text x="560" y="355" text-anchor="middle" fill="#94a3b8" font-size="24">→</text>
  <rect x="580" y="320" width="180" height="58" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="670" y="345" text-anchor="middle" fill="#4ade80" font-size="20" font-weight="bold" font-family="Consolas, monospace">or</text>
  <text x="670" y="368" text-anchor="middle" fill="#bbf7d0" font-size="13">3 — oxirgi</text>

  <!-- Worked example -->
  <rect x="28" y="398" width="824" height="140" rx="12" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="50" y="426" fill="#fbbf24" font-size="16" font-weight="bold">Misol: bosqichma-bosqich</text>
  <text x="50" y="456" fill="#e2e8f0" font-size="16" font-family="Consolas, monospace">False or not True and True</text>
  <text x="50" y="482" fill="#f472b6" font-size="15" font-family="Consolas, monospace">  1. not →   False or  False  and True</text>
  <text x="50" y="506" fill="#38bdf8" font-size="15" font-family="Consolas, monospace">  2. and →   False or       False</text>
  <text x="50" y="530" fill="#4ade80" font-size="15" font-family="Consolas, monospace">  3. or  →              False</text>
</svg>
