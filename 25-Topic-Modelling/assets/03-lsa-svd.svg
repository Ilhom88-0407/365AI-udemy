  <text x="430" y="352" text-anchor="middle" font-size="20" fill="#7c3aed">→</text>
  <rect x="470" y="330" width="240" height="32" rx="6" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="590" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">100 hujjat × 5 mavzu</text>
  <text x="750" y="351" font-size="12" font-weight="bold" fill="#dc2626">99.94%!</text>

  <rect x="30" y="392" width="800" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="430" y="414" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#854d0e">TAQSIMOT GIPOTEZASI: "O'xshash ma'noli so'zlar BIRGA uchraydi"</text>
  <text x="430" y="434" text-anchor="middle" font-size="12.5" fill="#a16207">"doctor" va "nurse" bir xil qo'shnilarga ega → bir xil ma'no → BIR MAVZU</text>
