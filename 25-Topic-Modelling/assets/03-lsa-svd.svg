  <text x="534" y="176" font-size="9.5" fill="#dc2626">kuchli</text>
  <text x="534" y="220" font-size="9.5" fill="#94a3b8">kuchsiz</text>
  <text x="517" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">"Qanchalik MUHIM?"</text>

  <text x="598" y="180" text-anchor="middle" font-size="24" font-weight="bold" fill="#475569">×</text>

  <rect x="616" y="96" width="214" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="723" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Vᵀ</text>
