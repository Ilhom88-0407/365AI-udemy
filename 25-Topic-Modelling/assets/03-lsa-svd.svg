  <text x="723" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">"Mavzuda qaysi SO'ZLAR?"</text>

  <rect x="30" y="292" width="800" height="86" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
