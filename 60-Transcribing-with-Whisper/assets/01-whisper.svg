<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="690" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Whisper-base: 61 so'zdan 60 tasi to'g'ri. Yagona "xato" — havolaning o'zi.</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">o'lchangan: speech_01.wav 23.5 s · CPU · transformers (ffmpeg SIZ)</text>

  <!-- model sizes -->
  <rect x="24" y="74" width="450" height="196" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="249" y="98" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">MODEL O'LCHAMLARI</text>
  <text x="44" y="122" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">model    par(M)   vaqt   tezlik    WER</text>
  <line x1="44" y1="129" x2="454" y2="129" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="150" fill="#86efac">tiny      37.8   2.21s  10.64x  0.0328</text>
    <text x="44" y="172" fill="#4ade80">base      72.6   2.91s   8.07x  0.0164</text>
    <text x="44" y="194" fill="#fbbf24">small    241.7   6.81s   3.45x  0.0164</text>
  </g>
  <text x="44" y="224" fill="#4ade80" font-size="12" font-weight="700">base — eng yaxshi tanlov.</text>
  <text x="44" y="244" fill="#f87171" font-size="12" font-weight="700">small 2.3x sekin, lekin WER AYNAN bir xil.</text>
  <text x="44" y="262" fill="#94a3b8" font-size="11">"Kattaroq model = yaxshiroq" — bu qoida EMAS.</text>

  <!-- determinism -->
  <rect x="490" y="74" width="446" height="196" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="713" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">"MODEL STOXASTIK" — TEKSHIRDIK</text>
  <text x="510" y="122" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">temperature   turli natija   WER    'data'</text>
  <line x1="510" y1="129" x2="916" y2="129" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="150" fill="#4ade80">    0.0          1/3      0.0164   BOR</text>
    <text x="510" y="170" fill="#fbbf24">    0.2          2/3      0.0328   YO'Q</text>
    <text x="510" y="190" fill="#f87171">    0.5          3/3      0.0328   YO'Q</text>
    <text x="510" y="210" fill="#f87171">    0.8          3/3      0.0820   YO'Q</text>
    <text x="510" y="230" fill="#f87171">    1.0          3/3      0.0820   YO'Q</text>
  </g>
  <text x="510" y="254" fill="#4ade80" font-size="12" font-weight="700">Model deterministik. Tasodifiylik — DEKODLASHDAN.</text>

  <!-- google vs whisper -->
  <rect x="24" y="286" width="450" height="184" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="249" y="310" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">GOOGLE vs WHISPER</text>
  <text x="44" y="334" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">                    Google    Whisper</text>
  <line x1="44" y1="341" x2="454" y2="341" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="360" fill="#94a3b8">WER xom             0.2951    0.1148</text>
    <text x="44" y="380" fill="#4ade80">WER toza            0.0328    0.0164</text>
    <text x="44" y="400" fill="#94a3b8">CER toza            0.0170    0.0113</text>
    <text x="44" y="420" fill="#4ade80">tinish belgilari         0         9</text>
    <text x="44" y="440" fill="#94a3b8">internet             SHART   kerak emas</text>
  </g>
  <text x="44" y="462" fill="#fbbf24" font-size="11.5" font-weight="700">Farq — asosan FORMATLASHDA. Ikkalasi ham juda yaxshi.</text>

  <!-- hallucination -->
  <rect x="490" y="286" width="446" height="184" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="713" y="310" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">WHISPER NING HAQIQIY ZAIFLIGI</text>
  <text x="510" y="334" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">  SNR    Whisper WER   Google WER</text>
  <line x1="510" y1="341" x2="916" y2="341" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="360" fill="#4ade80"> 30 dB      0.0164       0.0328</text>
    <text x="510" y="380" fill="#4ade80"> 10 dB      0.0492       0.0656</text>
    <text x="510" y="400" fill="#fbbf24">  0 dB      0.2623       0.0656</text>
    <text x="510" y="420" fill="#f87171"> -5 dB      5.3279       0.4262</text>
  </g>
  <text x="510" y="444" fill="#f87171" font-size="12" font-weight="700">-5 dB da 338 ta so'z: "a sound engineer" x 103</text>
  <text x="510" y="462" fill="#fbbf24" font-size="11.5" font-weight="700">GALLYUTSINATSIYA. 0 dB da Google YENGDI.</text>

  <!-- detector -->
  <rect x="24" y="486" width="912" height="180" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="510" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">GALLYUTSINATSIYA DETEKTORI: noyob so'zlar ulushi + nutq tezligi</text>
  <text x="44" y="534" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">   SNR     so'z   noyob    ulush   eng ko'p takror   so'z/sek   holat</text>
  <line x1="44" y1="541" x2="916" y2="541" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="560" fill="#4ade80"> 30 dB       61      51    83.6%              3        2.59   normal</text>
    <text x="44" y="580" fill="#4ade80">  5 dB       62      50    80.6%              3        2.64   normal</text>
    <text x="44" y="600" fill="#4ade80">  0 dB       63      51    81.0%              4        2.68   normal</text>
    <text x="44" y="620" fill="#f87171"> -5 dB      338      24     7.1%            105       14.38   GALLYUTSINATSIYA</text>
    <text x="44" y="640" fill="#f87171">-10 dB        1       1   100.0%              1        0.04   MODEL TAQ QOLDI</text>
  </g>
  <text x="44" y="660" fill="#fbbf24" font-size="11.5" font-weight="700">Odam nutqi — 2.0-3.5 so'z/sek. 14.38 jismonan imkonsiz, 0.04 esa taslim. Ikki tomondan chegara qo'ying.</text>
</svg>
