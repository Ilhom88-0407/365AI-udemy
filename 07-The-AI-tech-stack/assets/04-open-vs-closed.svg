<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Open source ⟷ Closed source AI</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#475569">Dasturiy ta'minot olamining abadiy jangi — endi AI sohasida</text>

  <!-- leaked doc quote -->
  <rect x="24" y="76" width="952" height="66" rx="12" fill="#0F172A"/>
  <text x="44" y="100" font-size="12" font-weight="700" fill="#FBBF24">📄 Google'ning sizib chiqqan hujjatidan</text>
  <text x="44" y="122" font-size="12.5" font-style="italic" fill="#E2E8F0">"Biz OpenAI ga qarab turdik... Lekin noqulay haqiqat shuki, biz bu qurollanish poygasida g'olib bo'la olmaymiz. OpenAI ham."</text>
  <text x="44" y="138" font-size="11.5" fill="#93C5FD">"Biz janjallashayotganimizda, UCHINCHI TOMON jimgina bizning tushligimizni yeb qo'ydi." — ya'ni OPEN SOURCE</text>

  <!-- OPEN -->
  <rect x="24" y="158" width="470" height="248" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="24" y="158" width="470" height="40" rx="12" fill="#059669"/>
  <rect x="24" y="184" width="470" height="14" fill="#059669"/>
  <text x="259" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">OPEN SOURCE</text>

  <text x="46" y="222" font-size="12" font-weight="700" fill="#047857">✅ KUCHLI TOMONLARI</text>
  <g font-size="11.5" fill="#334155">
    <text x="60" y="244">• Hamjamiyat bir-birining ishi ustiga quradi</text>
    <text x="60" y="264">• Jamoaviy bilim va ijodkorlik</text>
    <text x="60" y="284">• Innovatsiya tezlashadi — "qabila yakkadan kuchli"</text>
    <text x="60" y="304">• Apparat talablari kamaydi → o'sish qor ko'chkisiday</text>
    <text x="60" y="324">• Google/OpenAI to'lovlaridan qutulasiz</text>
  </g>
  <text x="46" y="352" font-size="12" font-weight="700" fill="#991B1B">❌ ZAIF TOMONLARI</text>
  <g font-size="11.5" fill="#334155">
    <text x="60" y="374">• Hisoblash (compute) xarajati baribir bor</text>
    <text x="60" y="394">• Moslashtirish narxi noaniq bo'lishi mumkin</text>
  </g>

  <!-- CLOSED -->
  <rect x="506" y="158" width="470" height="248" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="506" y="158" width="470" height="40" rx="12" fill="#2563EB"/>
  <rect x="506" y="184" width="470" height="14" fill="#2563EB"/>
  <text x="741" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">CLOSED SOURCE</text>

  <text x="528" y="222" font-size="12" font-weight="700" fill="#1D4ED8">✅ KUCHLI TOMONLARI</text>
  <g font-size="11.5" fill="#334155">
    <text x="542" y="244">• Plug-and-play — minimal sozlash</text>
    <text x="542" y="264">• Optimallashtirilgan UX va mijoz qo'llab-quvvatlashi</text>
    <text x="542" y="284">• Mustahkam API lar</text>
    <text x="542" y="304">• Etika va huquqiy muvofiqlik (compliance)</text>
    <text x="542" y="324">• Biznes ma'lumoti sizib chiqishi ehtimoli PASTROQ</text>
  </g>
  <text x="528" y="352" font-size="12" font-weight="700" fill="#991B1B">❌ ZAIF TOMONLARI</text>
  <g font-size="11.5" fill="#334155">
    <text x="542" y="374">• Umuman qimmatroq bo'lib qoladi</text>
    <text x="542" y="394">• Fine-tuning uchun katta to'lov olinishi mumkin</text>
  </g>

  <!-- verdict -->
  <rect x="24" y="420" width="952" height="62" rx="12" fill="#FEF9C3" stroke="#FDE68A" stroke-width="2"/>
  <text x="500" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#854D0E">⚖️ Ma'ruzachining hukmi: "qaysi biri yutadi deb aytish — mavzuni cheklangan tushunishni bildiradi"</text>
  <text x="270" y="466" text-anchor="middle" font-size="11.5" fill="#713F12">OPEN → tor, ixtisoslashgan vazifalar (fine-tuning arzon)</text>
  <text x="740" y="466" text-anchor="middle" font-size="11.5" fill="#713F12">CLOSED → murakkab, umumlashgan tushunish talab qiladiganlar</text>
</svg>
