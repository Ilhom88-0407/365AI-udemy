<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="700" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Kursning tavsiya qilgan prompti — 60 ta so'rovda ENG YOMON chiqdi</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">o'lchangan: Qwen2.5-0.5B-Instruct · temperature=0.8 · n=12 · 4 ta tekshiruv</text>

  <!-- temperature -->
  <rect x="24" y="74" width="450" height="200" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="249" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">temperature=2 MATNNI BUZADI</text>
  <text x="44" y="122" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">temp   noyob%  ASCII%  o'rt.so'z</text>
  <line x1="44" y1="129" x2="454" y2="129" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="148" fill="#4ade80">0.0     78.5%  100.0%      4.48</text>
    <text x="44" y="168" fill="#4ade80">0.7     89.2%  100.0%      5.16</text>
    <text x="44" y="188" fill="#4ade80">1.0     83.1%  100.0%      5.21</text>
    <text x="44" y="208" fill="#fbbf24">1.5    100.0%   86.3%      8.53</text>
    <text x="44" y="228" fill="#f87171">2.0    100.0%   69.7%     12.74</text>
  </g>
  <text x="44" y="252" fill="#f87171" font-size="11" font-family="Consolas, monospace">"Data culture меняключения истории Д deform品尝"</text>
  <text x="44" y="268" fill="#fbbf24" font-size="11.5" font-weight="700">Buzilish 1.5 dan boshlanadi. Qoida: temperature &lt;= 1.2</text>

  <!-- top_p -->
  <rect x="490" y="74" width="446" height="200" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="713" y="98" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">top_p — "RO'YXAT UZUNLIGI"</text>
  <text x="510" y="122" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">temperature = 1.0 doimiy, 5 marta</text>
  <line x1="510" y1="132" x2="916" y2="132" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="152" fill="#4ade80">top_p=0.1   1/5 turli   DETERMINISTIK</text>
    <text x="510" y="172" fill="#a3e635">top_p=0.3   4/5 turli</text>
    <text x="510" y="192" fill="#fbbf24">top_p=0.6   5/5 turli</text>
    <text x="510" y="212" fill="#fbbf24">top_p=1.0   5/5 turli</text>
  </g>
  <text x="510" y="240" fill="#4ade80" font-size="12" font-weight="700">top_p=0.1 -&gt; temperature=1.0 bo'lsa ham BARQAROR.</text>
  <text x="510" y="260" fill="#fbbf24" font-size="11.5" font-weight="700">top_p — qattiqroq nazorat. Kursning tushuntirishi TASDIQLANDI.</text>

  <!-- prompt test -->
  <rect x="24" y="290" width="912" height="212" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="314" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">BESHTA PROMPT VERSIYASI — AVTOMATIK SINOV (n=12)</text>
  <text x="44" y="340" fill="#7dd3fc" font-size="11.5" font-family="Consolas, monospace">versiya          o'rt  ±std   bitta savol  preambulasiz  savol bilan  kontekstda</text>
  <line x1="44" y1="348" x2="916" y2="348" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="368" fill="#94a3b8">v1 oddiy         0.71 0.093        10/12         12/12        12/12         0/12</text>
    <text x="44" y="390" fill="#4ade80">v2 rol           0.77 0.190        10/12          7/12        11/12         9/12</text>
    <text x="44" y="412" fill="#a3e635">v3 cheklov       0.75 0.250        11/12         10/12        10/12         5/12</text>
    <text x="44" y="434" fill="#f87171">v4 KURSNIKI      0.58 0.186        11/12          3/12        11/12         3/12</text>
    <text x="44" y="456" fill="#4ade80">v5 few-shot      0.77 0.069        12/12         12/12        12/12         1/12</text>
  </g>
  <text x="44" y="480" fill="#f87171" font-size="12" font-weight="700">v4 = v3 + kursning qo'shimchasi. Natija 0.75 -&gt; 0.58. Preambula 10/12 -&gt; 3/12.</text>
  <text x="44" y="496" fill="#fbbf24" font-size="11.5" font-weight="700">Statistik g'olib YO'Q: farq 0.000, shovqin 0.500. n=4 dan n=12 ga oshirish yordam bermadi.</text>

  <!-- few-shot -->
  <rect x="24" y="518" width="450" height="160" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="249" y="542" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">FEW-SHOT 62-MODUL MUAMMOSINI TUZATDI</text>
  <g font-family="Consolas, monospace" font-size="11">
    <text x="44" y="566" fill="#f87171">zero (45 tok) "What is the purpose of using</text>
    <text x="44" y="582" fill="#f87171">               the pandas library in Python?"</text>
    <text x="44" y="606" fill="#4ade80">few  (97 tok) "Write a Python function to find</text>
    <text x="44" y="622" fill="#4ade80">               the second largest element..."</text>
  </g>
  <text x="44" y="648" fill="#fbbf24" font-size="11.5" font-weight="700">+52 token = $0.0000078. 10 000 so'rov uchun $0.08.</text>
  <text x="44" y="666" fill="#94a3b8" font-size="11">Halol baho: kod to'liq tuzatildi, boshqa ikkitasi qisman.</text>

  <!-- steps -->
  <rect x="490" y="518" width="446" height="160" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="713" y="542" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">QADAMLI PROMPT — JSON NI TUZATDI</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="568" fill="#f87171">qadamsiz (37 tok): JSON parse XATO</text>
    <text x="510" y="584" fill="#94a3b8">  Invalid control character line 4</text>
    <text x="510" y="608" fill="#4ade80">qadamli  (90 tok): JSON ok</text>
    <text x="510" y="624" fill="#4ade80">  imzo ✓  3 jumla (&lt;=4) ✓  request ✓</text>
  </g>
  <text x="510" y="650" fill="#fbbf24" font-size="11.5" font-weight="700">+53 token — va HAMMA talab bajarildi.</text>
  <text x="510" y="668" fill="#94a3b8" font-size="11">Men teskarisini kutgan edim. Kursning tavsiyasi TASDIQLANDI.</text>
</svg>
