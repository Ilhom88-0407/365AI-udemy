    <text x="44" y="454" fill="#94a3b8"> 5 dB |</text><text x="140" y="454" fill="#4ade80">      0.0492</text><text x="290" y="454" fill="#f87171">       0.3115</text><text x="450" y="454" fill="#4ade80">      0.0492</text><text x="600" y="454" fill="#f87171">       1.0000</text><text x="760" y="454" fill="#f87171">       1.0000</text>
