<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="920" height="470" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Buy vs Make — AI davridagi paradoks</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">Klassik biznes qoidasi AI da ishlamay qoldi</text>

  <!-- classic rule -->
  <rect x="24" y="82" width="872" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="46" y="106" font-size="12.5" font-weight="700" fill="#334155">📖 MBA OLTIN QOIDASI</text>
  <text x="46" y="128" font-size="12" fill="#475569">Strategik, qiymat qo'shuvchi faoliyatni — <tspan font-weight="700" fill="#0F172A">ichkarida saqlang</tspan></text>
  <text x="46" y="146" font-size="12" fill="#475569">Asosiy bo'lmagan, samaradorlikka qaratilgan ishlarni — <tspan font-weight="700" fill="#0F172A">tashqariga bering</tspan></text>

  <!-- paradox -->
  <rect x="24" y="168" width="872" height="86" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="460" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">⚠️ ZIDDIYAT</text>
  <text x="460" y="218" text-anchor="middle" font-size="12.5" fill="#7F1D1D">AI biznesning ASOSIY qiymat yaratuvchi jihati bo'lishi mumkin...</text>
  <text x="460" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">...lekin uning mavjudligi va rivoji kompaniyaning ichki kuchiga TO'LIQ BOG'LIQ EMAS</text>

  <!-- three paths -->
  <text x="460" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Kompaniya oldidagi uchta yo'l</text>

  <rect x="24" y="294" width="278" height="110" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="163" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">1 · O'z foundation modeli</text>
  <text x="163" y="342" text-anchor="middle" font-size="11.5" fill="#334155">Juda qimmat, kerakli miqyos</text>
  <text x="163" y="360" text-anchor="middle" font-size="11.5" fill="#334155">kam kompaniyada bor</text>
  <rect x="46" y="370" width="234" height="24" rx="6" fill="#FEE2E2"/>
  <text x="163" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">Faqat big tech va davlatlar</text>

  <rect x="320" y="294" width="278" height="110" rx="11" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
  <text x="459" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">2 · Open-source dan qurish</text>
  <text x="459" y="342" text-anchor="middle" font-size="11.5" fill="#334155">O'z versiyasini ishlab chiqish</text>
  <text x="459" y="360" text-anchor="middle" font-size="11.5" fill="#334155">ekspertiza va resurs kerak</text>
  <rect x="342" y="370" width="234" height="24" rx="6" fill="#FFEDD5"/>
  <text x="459" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#9A3412">O'rta va yirik kompaniyalar</text>

  <rect x="616" y="294" width="280" height="110" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <text x="756" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">3 · Model as a Service</text>
  <text x="756" y="342" text-anchor="middle" font-size="11.5" fill="#334155">OpenAI kabi tashkilotlar API si</text>
  <text x="756" y="360" text-anchor="middle" font-size="11.5" fill="#334155">bitta API chaqiruvi bilan</text>
  <rect x="638" y="370" width="236" height="24" rx="6" fill="#DCFCE7"/>
  <text x="756" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Ko'pchilik kompaniyalar</text>

  <!-- the answer -->
  <rect x="24" y="418" width="872" height="38" rx="10" fill="#0F172A"/>
  <text x="460" y="435" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FBBF24">Agar hamma bir xil API dan foydalansa — kim yutadi?</text>
  <text x="460" y="450" text-anchor="middle" font-size="11.5" fill="#6EE7B7">AI ni O'Z holatiga moslashtira olgan — prompt engineering · RAG · fine-tuning ekspertizasi</text>
</svg>
