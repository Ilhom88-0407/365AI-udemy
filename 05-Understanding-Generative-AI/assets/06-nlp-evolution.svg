<text x="407" y="152" text-anchor="middle" font-size="11.5" fill="#334155">oldingi qadamlarni eslab qoladi</text>
<rect x="308" y="222" width="198" height="98" rx="9" fill="#FEF2F2" stroke="#0891B2" stroke-opacity="0.4"/>
<text x="407" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">MUAMMO</text>
<text x="407" y="266" text-anchor="middle" font-size="11" fill="#991B1B">Uzun matnda oldingi</text>
<text x="407" y="282" text-anchor="middle" font-size="11" fill="#991B1B">ma'lumotni YO'QOTADI</text>
<text x="407" y="298" text-anchor="middle" font-size="11" fill="#991B1B">(vanishing gradient)</text>
<line x1="528" y1="213" x2="546" y2="213" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="550" y="88" width="238" height="250" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
