<text x="669" y="152" text-anchor="middle" font-size="11.5" fill="#334155">gate arxitekturasi: nimani saqlash,</text>
<text x="669" y="168" text-anchor="middle" font-size="11.5" fill="#334155">nimani tashlash</text>
<rect x="570" y="222" width="198" height="98" rx="9" fill="#FEF2F2" stroke="#7C3AED" stroke-opacity="0.4"/>
<text x="669" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">MUAMMO</text>
<text x="669" y="266" text-anchor="middle" font-size="11" fill="#991B1B">Hisoblash qimmat,</text>
<text x="669" y="282" text-anchor="middle" font-size="11" fill="#991B1B">sekin &#8212; masshtablanmaydi</text>
<line x1="790" y1="213" x2="808" y2="213" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ar)"/>
