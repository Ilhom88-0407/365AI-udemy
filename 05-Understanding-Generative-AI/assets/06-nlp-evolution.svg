<text x="931" y="152" text-anchor="middle" font-size="11.5" fill="#334155">attention mexanizmi:</text>
<text x="931" y="168" text-anchor="middle" font-size="11.5" fill="#334155">qaysi so'z muhim</text>
<rect x="832" y="222" width="198" height="98" rx="9" fill="#ECFDF5" stroke="#059669" stroke-opacity="0.4"/>
<text x="931" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">NATIJA</text>
<text x="931" y="266" text-anchor="middle" font-size="11" fill="#047857">&#10003; Arzon, masshtablanadi,</text>
<text x="931" y="282" text-anchor="middle" font-size="11" fill="#047857">uzoq bog'liqliklarni ushlaydi</text>
<rect x="26" y="356" width="1028" height="44" rx="10" fill="#0F172A"/>
<text x="540" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6EE7B7">ATTENTION: har bir so'zga ball beriladi &#8212; yuqori balli so'zlar muhimroq</text>
<text x="540" y="392" text-anchor="middle" font-size="11.5" fill="#CBD5E1">Model butun matnni bir vaqtda emas, tegishli qismlarga tanlab e'tibor beradi</text>
