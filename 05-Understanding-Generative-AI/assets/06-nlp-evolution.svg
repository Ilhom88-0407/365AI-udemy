<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/></marker></defs>
<text x="540" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">NLP evolyutsiyasi &#8212; har biri oldingisining muammosini yechdi</text>
<text x="540" y="60" text-anchor="middle" font-size="13" fill="#475569">1. N-gram &#8594; 2. RNN &#8594; 3. LSTM &#8594; 4. Transformer (2017, "Attention is All You Need")</text>
