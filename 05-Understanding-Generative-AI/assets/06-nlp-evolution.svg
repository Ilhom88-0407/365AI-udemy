<text x="145" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">MUAMMO</text>
<text x="145" y="266" text-anchor="middle" font-size="11" fill="#991B1B">Kontekst nozikliklarini</text>
<text x="145" y="282" text-anchor="middle" font-size="11" fill="#991B1B">sezmaydi &#8212; faqat chastota</text>
