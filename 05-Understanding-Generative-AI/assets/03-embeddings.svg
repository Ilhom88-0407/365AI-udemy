<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ae" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Vector embeddings — ma'noni sonlarga aylantirish</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">2000-yillar: statistik tahlil machine learning bilan uchrashdi</text>

  <!-- words -->
  <rect x="24" y="84" width="180" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="114" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">SO'ZLAR</text>
  <g font-size="14" text-anchor="middle" fill="#0F172A">
    <rect x="44" y="124" width="140" height="28" rx="7" fill="#FEF3C7"/><text x="114" y="143">banan</text>
    <rect x="44" y="158" width="140" height="28" rx="7" fill="#FEF3C7"/><text x="114" y="177">limon</text>
    <rect x="44" y="192" width="140" height="28" rx="7" fill="#DBEAFE"/><text x="114" y="211">mushuk</text>
    <rect x="44" y="226" width="140" height="28" rx="7" fill="#E2E8F0"/><text x="114" y="245">traktor</text>
  </g>

  <line x1="212" y1="174" x2="240" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ae)"/>
  <text x="226" y="164" text-anchor="middle" font-size="10" fill="#64748B">embed</text>

  <!-- vectors -->
  <rect x="246" y="84" width="330" height="180" rx="12" fill="#0F172A"/>
  <text x="411" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#93C5FD">VEKTORLAR (sonlar massivi)</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#E2E8F0">
    <text x="266" y="143">[0.9, 0.8, 0.1, 0.1, 0.0, ...]</text>
    <text x="266" y="177">[0.9, 0.9, 0.1, 0.1, 0.0, ...]</text>
    <text x="266" y="211">[0.0, 0.1, 0.9, 0.9, 0.0, ...]</text>
    <text x="266" y="245">[0.0, 0.3, 0.0, 0.0, 0.9, ...]</text>
  </g>

  <line x1="584" y1="174" x2="612" y2="174" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ae)"/>

  <!-- semantic space -->
  <rect x="618" y="84" width="318" height="180" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="777" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">MA'NO FAZOSI</text>
  <circle cx="700" cy="150" r="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="700" y="146" text-anchor="middle" font-size="10" fill="#92400E">banan</text>
  <text x="700" y="158" text-anchor="middle" font-size="10" fill="#92400E">limon</text>
  <circle cx="800" cy="200" r="26" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="196" text-anchor="middle" font-size="10" fill="#1E40AF">mushuk</text>
  <text x="800" y="208" text-anchor="middle" font-size="10" fill="#1E40AF">it</text>
  <circle cx="890" cy="132" r="20" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="890" y="136" text-anchor="middle" font-size="9.5" fill="#475569">traktor</text>
  <text x="777" y="248" text-anchor="middle" font-size="11" fill="#64748B">o'xshash ma'no → yaqin joylashadi</text>

  <!-- dimensions callout -->
  <rect x="24" y="286" width="452" height="112" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="250" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">⚠️ Nechta o'lcham?</text>
  <text x="250" y="338" text-anchor="middle" font-size="12.5" fill="#334155">2 emas. 3 emas.</text>
  <text x="250" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">bir necha YUZ yoki MING o'lcham</text>
  <text x="250" y="386" text-anchor="middle" font-size="11.5" fill="#64748B">Inson tili kabi murakkab narsani 3 o'lchamda ifodalab bo'lmaydi</text>

  <rect x="492" y="286" width="444" height="112" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="714" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">🔑 Asosiy g'oya</text>
  <text x="714" y="340" text-anchor="middle" font-size="12.5" fill="#334155">Embedding'lardan ma'lumotni</text>
  <text x="714" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">SEMANTIK O'XSHASHLIK bo'yicha</text>
  <text x="714" y="384" text-anchor="middle" font-size="12.5" fill="#334155">saqlash va topish uchun foydalanamiz</text>

  <rect x="24" y="412" width="912" height="44" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="480" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Vektorlar matn, rasm, audio — istalgan strukturalanmagan ma'lumotni ifodalay oladi</text>
  <text x="480" y="448" text-anchor="middle" font-size="11.5" fill="#6D28D9">Yangi ML modellari sarkazm va kinoya kabi nozik lingvistik ishoralarni ham seza boshladi</text>
</svg>
