<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="500" fill="#f7f9fc"/>
  <text x="430" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4c">Matn tasniflagichi — to'liq quvur</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#475569"/></marker>
  </defs>

  <text x="215" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">1 · O'QITISH  (fit)</text>
  <text x="645" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">2 · BASHORAT  (predict)</text>
  <line x1="430" y1="70" x2="430" y2="420" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- training -->
  <rect x="30" y="76" width="370" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="215" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">YORLIQLI ma'lumot</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#334155">
    <text x="52" y="120">"i love spending time..."   →  positive</text>
    <text x="52" y="138">"i have a headache..."      →  negative</text>
    <text x="52" y="156">"watching a sunset..."      →  positive</text>
  </g>
  <line x1="215" y1="164" x2="215" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="188" width="270" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="215" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">VEKTORLASHTIRISH</text>
  <text x="215" y="225" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#78350f">cv.fit_transform(X)</text>
  <line x1="215" y1="234" x2="215" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="258" width="270" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="215" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">TRAIN / TEST BO'LISH</text>
  <text x="215" y="295" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#475569">train_test_split(...)</text>
  <line x1="215" y1="304" x2="215" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="328" width="310" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="215" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">MODELNI O'QITISH  ·  .fit()</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#334155">
    <text x="82" y="372">LogisticRegression()</text>
    <text x="82" y="390">MultinomialNB()</text>
    <text x="82" y="408">SGDClassifier()</text>
  </g>

  <!-- prediction -->
  <rect x="460" y="76" width="370" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="645" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">YANGI matn (yorliqSIZ)</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#334155">
    <text x="482" y="122">"this book was wonderful"   →  ???</text>
    <text x="482" y="142">"complete waste of money"   →  ???</text>
  </g>
  <line x1="645" y1="164" x2="645" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="510" y="188" width="270" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="645" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">VEKTORLASHTIRISH</text>
  <text x="645" y="225" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#dc2626">cv.transform(X)  ⚠️ fit YO'Q!</text>
  <line x1="645" y1="234" x2="645" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="540" y="258" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="645" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">BASHORAT</text>
  <text x="645" y="295" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0369a1">model.predict(X)</text>
  <line x1="645" y1="304" x2="645" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="490" y="328" width="310" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="645" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NATIJA</text>
  <g font-size="12" font-family="Consolas, monospace">
    <text x="512" y="374" fill="#16a34a">positive   ✅</text>
    <text x="512" y="396" fill="#dc2626">negative   ✅</text>
  </g>

  <path d="M 370 371 L 486 371" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 3"/>
  <text x="428" y="364" text-anchor="middle" font-size="10" fill="#16a34a">o'qitilgan</text>

  <rect x="30" y="430" width="800" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="430" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">⚠️  ENG KENG TARQALGAN XATO</text>
  <text x="430" y="474" text-anchor="middle" font-size="12.5" fill="#b91c1c">Yangi ma'lumotda cv.fit_transform() ishlatish — ustunlar MOS KELMAYDI. Faqat cv.transform()!</text>
</svg>
