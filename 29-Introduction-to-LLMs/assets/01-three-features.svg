<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="380" fill="#0f172a" rx="14"/>
  <text x="440" y="40" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">LLM ning uchta asosiy xususiyati</text>
  <text x="440" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">bularsiz model "katta til modeli" hisoblanmaydi</text>

  <!-- 1 -->
  <rect x="30" y="92" width="262" height="210" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="70" cy="130" r="20" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="70" y="137" fill="#eff6ff" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text x="106" y="137" fill="#dbeafe" font-size="19" font-weight="700">KATTA</text>
  <text x="106" y="156" fill="#60a5fa" font-size="11.5">large</text>
  <line x1="52" y1="172" x2="270" y2="172" stroke="#1e40af"/>
  <text x="52" y="197" fill="#bfdbfe" font-size="13">Hajm = PARAMETRLAR soni</text>
  <text x="52" y="220" fill="#93c5fd" font-size="12.5">BERT      →   345 million</text>
  <text x="52" y="240" fill="#93c5fd" font-size="12.5">GPT-3     →   175 milliard</text>
  <text x="52" y="260" fill="#93c5fd" font-size="12.5">GPT-4     →   1.7 trillion</text>
  <text x="52" y="286" fill="#60a5fa" font-size="11.5">→ 4-dars</text>

  <!-- 2 -->
  <rect x="309" y="92" width="262" height="210" rx="14" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="349" cy="130" r="20" fill="#6d28d9" stroke="#ddd6fe" stroke-width="2"/>
  <text x="349" y="137" fill="#f5f3ff" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text x="385" y="137" fill="#ede9fe" font-size="17" font-weight="700">UMUMIY</text>
  <text x="385" y="156" fill="#a78bfa" font-size="11.5">general purpose</text>
  <line x1="331" y1="172" x2="549" y2="172" stroke="#6d28d9"/>
  <text x="331" y="197" fill="#ddd6fe" font-size="13">BITTA model — KO'P vazifa</text>
  <text x="331" y="220" fill="#c4b5fd" font-size="12.5">sentiment · tarjima</text>
  <text x="331" y="240" fill="#c4b5fd" font-size="12.5">xulosa · savol-javob</text>
  <text x="331" y="260" fill="#c4b5fd" font-size="12.5">NER · kod · chatbot</text>
  <text x="331" y="286" fill="#a78bfa" font-size="11.5">→ 5-dars</text>

  <!-- 3 -->
  <rect x="588" y="92" width="262" height="210" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <circle cx="628" cy="130" r="20" fill="#166534" stroke="#bbf7d0" stroke-width="2"/>
  <text x="628" y="137" fill="#f0fdf4" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text x="664" y="132" fill="#dcfce7" font-size="15" font-weight="700">OLDINDAN</text>
  <text x="664" y="150" fill="#dcfce7" font-size="15" font-weight="700">O'QITILGAN</text>
  <text x="664" y="166" fill="#4ade80" font-size="11">pre-trained + fine-tuned</text>
  <line x1="610" y1="178" x2="828" y2="178" stroke="#166534"/>
  <text x="610" y="202" fill="#bbf7d0" font-size="12.5">① internet → umumiy til</text>
  <text x="610" y="224" fill="#bbf7d0" font-size="12.5">② kichik to'plam → vazifa</text>
  <text x="610" y="250" fill="#86efac" font-size="12.5">zero-shot · few-shot</text>
  <text x="610" y="286" fill="#4ade80" font-size="11.5">→ 6-dars</text>

  <!-- footer -->
  <rect x="30" y="322" width="820" height="42" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="341" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">⚠️ Uchalasi ham TEKSHIRILDI — va uchtasida ham MUHIM istisno topildi</text>
  <text x="440" y="358" fill="#cbd5e1" font-size="12" text-anchor="middle">o'zbekcha sentiment: eng KATTA model (167M) eng YOMON natija berdi (0.500)</text>
</svg>
