<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="430" fill="#0f172a" rx="14"/>
  <text x="440" y="38" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Model hajmlari — parametrlar soni</text>
  <text x="440" y="60" fill="#94a3b8" font-size="12.5" text-anchor="middle">shkala LOGARIFMIK — aks holda kichik modellar ko'rinmay qolardi</text>

  <!-- bars: log scale, x from 150 to 800 -->
  <!-- distilgpt2 82M -->
  <text x="140" y="105" fill="#cbd5e1" font-size="13" text-anchor="end">distilgpt2</text>
  <rect x="150" y="92" width="150" height="20" rx="4" fill="#1e40af"/>
  <text x="310" y="107" fill="#93c5fd" font-size="12">82 million</text>

  <text x="140" y="143" fill="#cbd5e1" font-size="13" text-anchor="end">BERT (base)</text>
  <rect x="150" y="130" width="168" height="20" rx="4" fill="#1e40af"/>
  <text x="328" y="145" fill="#93c5fd" font-size="12">110 million</text>

  <text x="140" y="181" fill="#cbd5e1" font-size="13" text-anchor="end">BERT (large)</text>
  <rect x="150" y="168" width="205" height="20" rx="4" fill="#2563eb"/>
  <text x="365" y="183" fill="#93c5fd" font-size="12">345 million</text>

  <text x="140" y="219" fill="#cbd5e1" font-size="13" text-anchor="end">GPT-2 (XL)</text>
  <rect x="150" y="206" width="250" height="20" rx="4" fill="#2563eb"/>
  <text x="410" y="221" fill="#93c5fd" font-size="12">1.5 milliard</text>

  <text x="140" y="257" fill="#cbd5e1" font-size="13" text-anchor="end">GPT-3</text>
  <rect x="150" y="244" width="380" height="20" rx="4" fill="#7c3aed"/>
  <text x="540" y="259" fill="#c4b5fd" font-size="12">175 milliard</text>

  <text x="140" y="295" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="end">GPT-4</text>
  <rect x="150" y="282" width="470" height="20" rx="4" fill="#a855f7"/>
  <text x="630" y="297" fill="#e9d5ff" font-size="12.5" font-weight="700">1.7 TRILLION</text>

  <!-- your model marker -->
  <line x1="150" y1="322" x2="850" y2="322" stroke="#334155"/>
  <text x="140" y="348" fill="#4ade80" font-size="13" font-weight="700" text-anchor="end">sizniki</text>
  <rect x="150" y="335" width="6" height="20" rx="2" fill="#4ade80"/>
  <text x="166" y="350" fill="#86efac" font-size="12">26-modul sklearn — bir necha MING parametr (chiziqcha ham sig'maydi)</text>

  <!-- footer -->
  <rect x="30" y="372" width="820" height="44" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="391" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">🕐 Har parametrni 1 soniyada sanasangiz:</text>
  <text x="440" y="409" fill="#cbd5e1" font-size="12.5" text-anchor="middle">BERT — 11 yil  ·  GPT-3 — 5 500 yil  ·  GPT-4 — 54 000 yil</text>
</svg>
