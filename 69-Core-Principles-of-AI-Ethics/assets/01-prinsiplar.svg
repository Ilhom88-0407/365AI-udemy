<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="800" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">"Bias topilmadi" — chunki tizim javob sifatini ham ajratmaydi</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">Qwen2.5-0.5B-Instruct · 8 demografik guruh · do_sample=False · n=6/guruh</text>

  <!-- bias auditi -->
  <rect x="24" y="74" width="450" height="220" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="249" y="98" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">BIAS AUDITI — FARQ 0.00</text>
  <text x="44" y="124" fill="#94a3b8" font-size="11.5">Aynan bir xil javob, faqat ISM o'zgaradi:</text>
  <line x1="44" y1="132" x2="454" y2="132" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="152" fill="#4ade80">erkak (G'arb)    7.00    ayol (G'arb)   7.00</text>
    <text x="44" y="170" fill="#4ade80">erkak (o'zbek)   7.00    ayol (o'zbek)  7.00</text>
    <text x="44" y="188" fill="#4ade80">erkak (arab)     7.00    ayol (arab)    7.00</text>
    <text x="44" y="206" fill="#4ade80">erkak (xitoy)    7.00    ayol (xitoy)   7.00</text>
  </g>
  <line x1="44" y1="220" x2="454" y2="220" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="240" fill="#94a3b8">yosh (4 xil)              hammasi 7.00</text>
    <text x="44" y="258" fill="#94a3b8">universitet (5 xil)       hammasi 7.00</text>
    <text x="44" y="276" fill="#94a3b8">til (ingliz/o'zbek)       hammasi 7.00</text>
  </g>

  <!-- sezgirlik nazorati -->
  <rect x="490" y="74" width="446" height="220" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="713" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">SEZGIRLIK NAZORATI — AUDIT YAROQSIZ</text>
  <text x="510" y="124" fill="#94a3b8" font-size="11.5">Endi javob SIFATINI o'zgartiramiz:</text>
  <line x1="510" y1="132" x2="916" y2="132" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="154" fill="#f87171">A mukammal (raqam + A/B test)     7.00</text>
    <text x="510" y="176" fill="#94a3b8">B o'rtacha                        8.00</text>
    <text x="510" y="198" fill="#94a3b8">C bo'sh ("qiziq soha")            8.00</text>
    <text x="510" y="220" fill="#4ade80">D dahshatli ("idk")               1.00</text>
    <text x="510" y="242" fill="#f87171">E aloqasiz ("Toshkentda ob-havo") 8.00</text>
  </g>
  <line x1="510" y1="254" x2="916" y2="254" stroke="#475569" stroke-width="1"/>
  <text x="510" y="274" fill="#f87171" font-size="12.5" font-weight="700">OB-HAVO 8 &gt; MUKAMMAL TEXNIK JAVOB 7</text>
  <text x="510" y="290" fill="#fbbf24" font-size="11" font-weight="700">Yagona to'g'ri qaror: "idk" ga 1 ball</text>

  <!-- COMPAS -->
  <rect x="24" y="310" width="450" height="216" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="249" y="334" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">COMPAS: IKKALA TOMON HAM HAQ EDI</text>
  <text x="44" y="358" fill="#94a3b8" font-size="11.5">Haqiqiy qayta jinoyat: A 28.4%, B 29.8% (bir xil)</text>
  <text x="44" y="376" fill="#94a3b8" font-size="11.5">Model "yuqori xavf" dedi: A 45.9%, B 62.8%</text>
  <line x1="44" y1="386" x2="454" y2="386" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="406" fill="#f87171">demografik tenglik        0.169  BUZILDI</text>
    <text x="44" y="424" fill="#f87171">teng imkoniyat (TPR)      0.200  BUZILDI</text>
    <text x="44" y="442" fill="#f87171">tenglashtirilgan ehtimol  0.200  BUZILDI</text>
    <text x="44" y="460" fill="#4ade80">bashorat tengligi (PPV)   0.029  O'TDI</text>
  </g>
  <line x1="44" y1="472" x2="454" y2="472" stroke="#475569" stroke-width="1"/>
  <text x="44" y="492" fill="#fbbf24" font-size="11.5" font-weight="700">Kompaniya PPV ga tayandi. Jurnalistlar FPR ga.</text>
  <text x="44" y="512" fill="#f87171" font-size="11.5" font-weight="700">103 ta qo'shimcha aybsiz odam "yuqori xavf" oldi</text>

  <!-- impossibility -->
  <rect x="490" y="310" width="446" height="216" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="713" y="334" fill="#bae6fd" font-size="14" font-weight="700" text-anchor="middle">IMPOSSIBILITY THEOREM — O'LCHANDI</text>
  <text x="510" y="358" fill="#94a3b8" font-size="11.5">MUKAMMAL, BIASSIZ model. Baza: A 20%, B 50%.</text>
  <text x="510" y="376" fill="#94a3b8" font-size="11.5">To'g'ri ehtimol, IKKALA guruhga bir xil chegara.</text>
  <line x1="510" y1="386" x2="916" y2="386" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="510" y="406" fill="#4ade80">bashorat tengligi (PPV)   0.040  O'TDI</text>
    <text x="510" y="424" fill="#f87171">tenglashtirilgan ehtimol  0.483  BUZILDI</text>
    <text x="510" y="442" fill="#f87171">demografik tenglik        0.442  BUZILDI</text>
  </g>
  <line x1="510" y1="454" x2="916" y2="454" stroke="#475569" stroke-width="1"/>
  <text x="510" y="476" fill="#fbbf24" font-size="11.5" font-weight="700">Bias YO'Q — lekin ikkita ta'rif buzildi.</text>
  <text x="510" y="494" fill="#94a3b8" font-size="11.5">Sabab — baza darajasi, bias emas.</text>
  <text x="510" y="514" fill="#4ade80" font-size="11.5" font-weight="700">"Adolatli" — QAYSI ta'rif bo'yicha?</text>

  <!-- to'rtta prinsip -->
  <rect x="24" y="542" width="912" height="130" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="566" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">TO'RTTA PRINSIP — BIZNING ILOVA</text>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="60" y="596" fill="#f87171">MAXFIYLIK    1/5   20%</text>
    <text x="290" y="596" fill="#f87171">SHAFFOFLIK   2/5   40%</text>
    <text x="520" y="596" fill="#f87171">JAVOBGARLIK  1/4   25%</text>
    <text x="750" y="596" fill="#f87171">ADOLAT       1/3   33%</text>
  </g>
  <g font-size="11">
    <text x="60" y="618" fill="#94a3b8">PII filtri yo'q</text>
    <text x="290" y="618" fill="#94a3b8">qaror tushuntirilmaydi</text>
    <text x="520" y="618" fill="#94a3b8">shikoyat kanali yo'q</text>
    <text x="750" y="618" fill="#94a3b8">audit yaroqsiz</text>
  </g>
  <line x1="44" y1="632" x2="916" y2="632" stroke="#475569" stroke-width="1"/>
  <text x="480" y="658" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle" font-family="Consolas, monospace">UMUMIY: 5/17 = 29.4%</text>

  <!-- qoida -->
  <rect x="24" y="688" width="912" height="90" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="716" fill="#bbf7d0" font-size="15" font-weight="700" text-anchor="middle">QOIDA: AUDIT "FARQ YO'Q" DESA —</text>
  <text x="480" y="742" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">AVVAL U FARQNI SEZA OLISHINI ISBOTLANG</text>
  <text x="480" y="766" fill="#94a3b8" font-size="11.5" text-anchor="middle">Sezgirlik nazorati — har qanday bias auditining BIRINCHI qadami</text>
</svg>
