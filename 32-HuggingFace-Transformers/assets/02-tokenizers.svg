<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="420" fill="#0f172a" rx="14"/>
  <text x="440" y="36" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Bir xil jumla — uchta tokenizator</text>
  <text x="440" y="57" fill="#94a3b8" font-size="12.5" text-anchor="middle">"I am so excited to be learning about large language models"</text>

  <!-- BERT -->
  <rect x="26" y="78" width="270" height="152" rx="11" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="161" y="102" fill="#e0f2fe" font-size="14" font-weight="700" text-anchor="middle">🔵 BERT (uncased)</text>
  <line x1="46" y1="112" x2="276" y2="112" stroke="#075985"/>
  <text x="46" y="134" fill="#bae6fd" font-size="11">['i', 'am', 'so', 'excited', ...]</text>
  <text x="46" y="156" fill="#7dd3fc" font-size="11">[101, 1045, 2572, 2061, ...]</text>
  <text x="46" y="180" fill="#fbbf24" font-size="11">[CLS] BOSHIDA · [SEP] oxirida</text>
  <text x="46" y="200" fill="#94a3b8" font-size="10.5">lug'at 30 522 · 5 maxsus token</text>
  <text x="46" y="220" fill="#94a3b8" font-size="10.5">kichik harf (uncased)</text>

  <!-- XLNet -->
  <rect x="305" y="78" width="270" height="152" rx="11" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
  <text x="440" y="102" fill="#ede9fe" font-size="14" font-weight="700" text-anchor="middle">🟣 XLNet (cased)</text>
  <line x1="325" y1="112" x2="555" y2="112" stroke="#6d28d9"/>
  <text x="325" y="134" fill="#ddd6fe" font-size="11">['▁I', '▁am', '▁so', '▁excited']</text>
  <text x="325" y="156" fill="#c4b5fd" font-size="11">[35, 569, 102, 5564, ...]</text>
  <text x="325" y="180" fill="#fbbf24" font-size="11">&lt;sep&gt;&lt;cls&gt; IKKALASI OXIRIDA</text>
  <text x="325" y="200" fill="#94a3b8" font-size="10.5">lug'at 32 000 · 9 maxsus token</text>
  <text x="325" y="220" fill="#94a3b8" font-size="10.5">▁ = bo'shliq (SentencePiece)</text>

  <!-- GPT -->
  <rect x="584" y="78" width="270" height="152" rx="11" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="719" y="102" fill="#dcfce7" font-size="14" font-weight="700" text-anchor="middle">🟢 distilgpt2</text>
  <line x1="604" y1="112" x2="834" y2="112" stroke="#166534"/>
  <text x="604" y="134" fill="#bbf7d0" font-size="11">['I', 'Ġam', 'Ġso', 'Ġexcited']</text>
  <text x="604" y="156" fill="#86efac" font-size="11">11 token = 11 input_ids</text>
  <text x="604" y="180" fill="#f87171" font-size="11" font-weight="700">MAXSUS TOKEN QO'SHMAYDI!</text>
  <text x="604" y="200" fill="#94a3b8" font-size="10.5">lug'at 50 257 · 1 maxsus token</text>
  <text x="604" y="220" fill="#94a3b8" font-size="10.5">Ġ = bo'shliq (BPE)</text>

  <!-- warning -->
  <rect x="26" y="246" width="828" height="66" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="440" y="268" fill="#fecaca" font-size="13.5" font-weight="700" text-anchor="middle">💥 "102" BERT'da [SEP], XLNet'da esa "▁so" so'zi!</text>
  <text x="440" y="290" fill="#fca5a5" font-size="12" text-anchor="middle">TOKENIZATOR va MODEL JUFT bo'lishi SHART — aralashtirsangiz, model boshqa matnni ko'radi</text>
  <text x="440" y="306" fill="#fbbf24" font-size="11" text-anchor="middle">🔑 Arxitektura bog'liqligi: encoder (BERT) → ko'p token · decoder (GPT) → bitta token</text>

  <!-- uzbek -->
  <rect x="26" y="326" width="828" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="440" y="348" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">🇺🇿 "Toshkent O'zbekiston poytaxti. Bu shaharda ko'plab qiziqarli joylar bor."</text>
  <text x="60" y="370" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">bert-base-uncased              33 token   ['to','##sh','##ken','##t', ...]</text>
  <text x="60" y="386" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">xlnet-base-cased               36 token   ['▁To','sh','ken','t', ...]</text>
  <text x="60" y="402" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">bert-base-multilingual-cased   26 token   ['Toshkent', ...]  ← BUTUN SO'Z! ✅</text>
</svg>
