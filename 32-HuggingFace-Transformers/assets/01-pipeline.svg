<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="400" fill="#0f172a" rx="14"/>
  <text x="440" y="36" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">pipeline() ichida NIMA bor?</text>
  <text x="440" y="57" fill="#94a3b8" font-size="12.5" text-anchor="middle">bitta qator kod — beshta yashirin qadam</text>

  <!-- top: what you write -->
  <rect x="30" y="76" width="820" height="42" rx="9" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="52" y="102" fill="#dcfce7" font-size="13" font-weight="700">SIZ YOZASIZ:</text>
  <text x="190" y="102" fill="#86efac" font-size="12.5" font-family="Consolas, monospace">pipeline("sentiment-analysis")("I am so excited...")</text>

  <path d="M440 122 L440 142" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- 5 steps -->
  <rect x="30" y="148" width="152" height="94" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="106" y="172" fill="#e0f2fe" font-size="12.5" font-weight="700" text-anchor="middle">① TOKENIZATSIYA</text>
  <text x="106" y="194" fill="#7dd3fc" font-size="10.5" text-anchor="middle">tokenizer(matn,</text>
  <text x="106" y="209" fill="#7dd3fc" font-size="10.5" text-anchor="middle">return_tensors="pt")</text>
  <text x="106" y="230" fill="#bae6fd" font-size="10" text-anchor="middle">[101, 1045, ..., 102]</text>

  <rect x="190" y="148" width="152" height="94" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="266" y="172" fill="#e0f2fe" font-size="12.5" font-weight="700" text-anchor="middle">② TENZOR</text>
  <text x="266" y="196" fill="#7dd3fc" font-size="10.5" text-anchor="middle">shakl (1, 13)</text>
  <text x="266" y="216" fill="#bae6fd" font-size="10" text-anchor="middle">batch o'lchami</text>
  <text x="266" y="232" fill="#bae6fd" font-size="10" text-anchor="middle">qo'shiladi</text>

  <rect x="350" y="148" width="180" height="94" rx="10" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
  <text x="440" y="172" fill="#ede9fe" font-size="12.5" font-weight="700" text-anchor="middle">③ MODEL</text>
  <text x="440" y="196" fill="#c4b5fd" font-size="10.5" text-anchor="middle">with torch.no_grad():</text>
  <text x="440" y="212" fill="#c4b5fd" font-size="10.5" text-anchor="middle">model(**ids).logits</text>
  <text x="440" y="232" fill="#fbbf24" font-size="10.5" text-anchor="middle">[-3.9707, 4.2408]</text>

  <rect x="538" y="148" width="152" height="94" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="614" y="172" fill="#fef3c7" font-size="12.5" font-weight="700" text-anchor="middle">④ SOFTMAX</text>
  <text x="614" y="196" fill="#fcd34d" font-size="10.5" text-anchor="middle">torch.softmax(...)</text>
  <text x="614" y="218" fill="#fde68a" font-size="10" text-anchor="middle">[0.00027,</text>
  <text x="614" y="232" fill="#fde68a" font-size="10" text-anchor="middle"> 0.99973]</text>

  <rect x="698" y="148" width="152" height="94" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.8"/>
  <text x="774" y="172" fill="#dcfce7" font-size="12.5" font-weight="700" text-anchor="middle">⑤ YORLIQ</text>
  <text x="774" y="196" fill="#86efac" font-size="10.5" text-anchor="middle">id2label[argmax]</text>
  <text x="774" y="220" fill="#bbf7d0" font-size="11" text-anchor="middle">'POSITIVE'</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M184 195 L188 195"/><path d="M344 195 L348 195"/>
    <path d="M532 195 L536 195"/><path d="M692 195 L696 195"/>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/></marker>
  </defs>

  <!-- proof -->
  <rect x="30" y="258" width="820" height="66" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <text x="440" y="280" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">🏆 QO'LDA HISOBLANDI — NATIJA BIR XIL</text>
  <text x="60" y="302" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">QO'LDA    →  YORLIQ: POSITIVE     softmax: 9.9973e-01</text>
  <text x="60" y="318" fill="#cbd5e1" font-size="11.5" font-family="Consolas, monospace">PIPELINE  →  label: 'POSITIVE'    score:   0.9997285</text>

  <!-- footer -->
  <rect x="30" y="338" width="820" height="46" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="357" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">⚠️ ISHLAB CHIQARISHDA MODELNI DOIM KO'RSATING</text>
  <text x="440" y="375" fill="#cbd5e1" font-size="11.5" text-anchor="middle">pipeline("sentiment-analysis") → standart model VERSIYA bilan o'zgarishi mumkin</text>
</svg>
