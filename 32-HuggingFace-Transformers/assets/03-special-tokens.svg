    <rect x="246" y="94" width="26" height="22" rx="4" fill="#334155"/><text x="259" y="109" fill="#e2e8f0" text-anchor="middle">.</text>
    <rect x="276" y="94" width="58" height="22" rx="4" fill="#7c2d12" stroke="#fb923c"/>
    <text x="305" y="109" fill="#fed7aa" text-anchor="middle">[SEP]</text>
    <rect x="338" y="94" width="34" height="22" rx="4" fill="#1e3a8a"/><text x="355" y="109" fill="#dbeafe" text-anchor="middle">it</text>
    <rect x="376" y="94" width="44" height="22" rx="4" fill="#1e3a8a"/><text x="398" y="109" fill="#dbeafe" text-anchor="middle">was</text>
    <rect x="424" y="94" width="64" height="22" rx="4" fill="#1e3a8a"/><text x="456" y="109" fill="#dbeafe" text-anchor="middle">sleepy</text>
    <rect x="492" y="94" width="26" height="22" rx="4" fill="#1e3a8a"/><text x="505" y="109" fill="#dbeafe" text-anchor="middle">.</text>
    <rect x="522" y="94" width="58" height="22" rx="4" fill="#7c2d12" stroke="#fb923c"/>
    <text x="551" y="109" fill="#fed7aa" text-anchor="middle">[SEP]</text>
