<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="400" fill="#0f172a" rx="14"/>
  <text x="440" y="36" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Maxsus tokenlar — matn tuzilishining markerlari</text>

