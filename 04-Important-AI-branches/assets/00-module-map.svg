<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">04-modul xaritasi — AI ning muhim tarmoqlari</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#475569">Bitta "AI" so'zi ostida to'rtta butunlay boshqa dunyo</text>

  <g>
    <rect x="24" y="84" width="220" height="170" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="52" cy="112" r="15" fill="#2563EB"/>
    <text x="52" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="134" y="152" text-anchor="middle" font-size="30">🤖</text>
    <text x="134" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Robotics</text>
    <text x="134" y="204" text-anchor="middle" font-size="11" fill="#64748B">tana + sezgi + qaror</text>
    <text x="134" y="222" text-anchor="middle" font-size="11" fill="#64748B">interdisiplinar soha</text>
    <text x="134" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">ko'p model bir tizimda</text>
  </g>

  <g>
    <rect x="256" y="84" width="220" height="170" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="284" cy="112" r="15" fill="#7C3AED"/>
    <text x="284" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="366" y="152" text-anchor="middle" font-size="30">👁️</text>
    <text x="366" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Computer Vision</text>
    <text x="366" y="204" text-anchor="middle" font-size="11" fill="#64748B">rasm va videodan</text>
    <text x="366" y="222" text-anchor="middle" font-size="11" fill="#64748B">ma'no chiqarish</text>
    <text x="366" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#6D28D9">CNN · Transformer · GAN</text>
  </g>

  <g>
    <rect x="488" y="84" width="220" height="170" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <circle cx="516" cy="112" r="15" fill="#059669"/>
    <text x="516" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="598" y="152" text-anchor="middle" font-size="30">💼</text>
    <text x="598" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Traditional ML</text>
    <text x="598" y="204" text-anchor="middle" font-size="11" fill="#64748B">sarlavhalarga chiqmaydi,</text>
    <text x="598" y="222" text-anchor="middle" font-size="11" fill="#64748B">lekin pul ishlaydi</text>
    <text x="598" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">10+ yildan beri ishlaydi</text>
  </g>

  <g>
    <rect x="720" y="84" width="220" height="170" rx="12" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <circle cx="748" cy="112" r="15" fill="#DB2777"/>
    <text x="748" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="830" y="152" text-anchor="middle" font-size="30">✨</text>
    <text x="830" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Generative AI</text>
    <text x="830" y="204" text-anchor="middle" font-size="11" fill="#64748B">yangi kontent YARATADI</text>
    <text x="830" y="222" text-anchor="middle" font-size="11" fill="#64748B">mavjudini qayta ishlamaydi</text>
    <text x="830" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#9D174D">ChatGPT, DALL·E</text>
  </g>

  <rect x="24" y="270" width="916" height="42" rx="10" fill="#0F172A"/>
  <text x="482" y="296" text-anchor="middle" font-size="12.5" fill="#93C5FD">Muhim: eng shov-shuvli tarmoq (4) va eng ko'p qiymat yaratayotgan tarmoq (3) — bir xil emas</text>
</svg>
