<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="440" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Shov-shuv ≠ qiymat</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">AI bugun yaratayotgan qiymatning kattaroq qismi — kamroq yaltiroq biznes holatlarda</text>

  <!-- LEFT: headlines -->
  <rect x="24" y="80" width="416" height="128" rx="12" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
  <rect x="24" y="80" width="416" height="38" rx="12" fill="#DB2777"/>
  <rect x="24" y="106" width="416" height="12" fill="#DB2777"/>
  <text x="232" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">📰 SARLAVHALARGA CHIQADI</text>
  <g font-size="12.5" fill="#0F172A">
    <text x="48" y="144">• ChatGPT</text>
    <text x="48" y="168">• Tesla o'zi yuruvchi mashinalari</text>
    <text x="48" y="192">• Humanoid robotlar</text>
  </g>

  <!-- RIGHT: real value -->
  <rect x="24" y="222" width="872" height="176" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <rect x="24" y="222" width="872" height="38" rx="12" fill="#059669"/>
  <rect x="24" y="248" width="872" height="12" fill="#059669"/>
  <text x="460" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">💰 PUL ISHLAYDI — 10+ YILDAN BERI</text>

  <g font-size="12">
    <rect x="44" y="274" width="196" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="142" y="294" text-anchor="middle" font-weight="700" fill="#065F46">🏦 Moliya</text>
    <text x="142" y="313" text-anchor="middle" font-size="11" fill="#334155">firibgarlikni aniqlash</text>

    <rect x="252" y="274" width="196" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="350" y="294" text-anchor="middle" font-weight="700" fill="#065F46">🏦 Banklar</text>
    <text x="350" y="313" text-anchor="middle" font-size="11" fill="#334155">ipoteka qaytarish ehtimoli</text>

    <rect x="460" y="274" width="196" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="558" y="294" text-anchor="middle" font-weight="700" fill="#065F46">🛡 Sug'urta</text>
    <text x="558" y="313" text-anchor="middle" font-size="11" fill="#334155">aniqroq narx belgilash</text>

    <rect x="668" y="274" width="208" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="772" y="294" text-anchor="middle" font-weight="700" fill="#065F46">🛒 Riteyl</text>
    <text x="772" y="313" text-anchor="middle" font-size="11" fill="#334155">talabni bashorat qilish</text>

    <rect x="44" y="334" width="404" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="246" y="354" text-anchor="middle" font-weight="700" fill="#065F46">📦 E-commerce (Amazon)</text>
    <text x="246" y="373" text-anchor="middle" font-size="11" fill="#334155">narx va konversiyani optimallashtirish</text>

    <rect x="460" y="334" width="416" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="668" y="354" text-anchor="middle" font-weight="700" fill="#065F46">🎁 Tavsiya tizimlari</text>
    <text x="668" y="373" text-anchor="middle" font-size="11" fill="#334155">xarid tarixiga qarab keyingi mahsulotni bashorat qilish</text>
  </g>

  <!-- callout -->
  <rect x="460" y="80" width="436" height="128" rx="12" fill="#0F172A"/>
  <text x="678" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#FBBF24">🔑 Asosiy xulosa</text>
  <text x="678" y="140" text-anchor="middle" font-size="12" fill="#E2E8F0">Generativ AI moda va istiqbolli.</text>
  <text x="678" y="160" text-anchor="middle" font-size="12" fill="#E2E8F0">Lekin an'anaviy AI qo'llanishlari</text>
  <text x="678" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#93C5FD">bizneslarga ta'sir qilishda davom etmoqda</text>
  <text x="678" y="198" text-anchor="middle" font-size="11.5" fill="#CBD5E1">"Juda kam biznes AI dan foyda ko'rmaydi"</text>

  <text x="460" y="424" text-anchor="middle" font-size="12" fill="#64748B">Karyera uchun maslahat: bu bozorda ish o'rinlari ham eng ko'p aynan shu yerda</text>
</svg>
