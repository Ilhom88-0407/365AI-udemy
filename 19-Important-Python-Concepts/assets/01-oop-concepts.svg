  <text x="585" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">obyekt HOLATI</text>
  <text x="520" y="160" fill="#e2e8f0" font-size="13">rangi</text>
  <text x="520" y="180" fill="#e2e8f0" font-size="13">o'lchami</text>
  <text x="520" y="200" fill="#e2e8f0" font-size="13">turi (tog' / yo'l)</text>
  <text x="520" y="222" fill="#fbbf24" font-size="12">Python: ma'lumot turi</text>

  <rect x="690" y="80" width="160" height="150" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="770" y="110" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold">METOD</text>
  <text x="770" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">obyektga AMAL</text>
  <text x="710" y="160" fill="#e2e8f0" font-size="13">chapga burilish</text>
  <text x="710" y="180" fill="#e2e8f0" font-size="13">sekinlashish</text>
  <text x="710" y="200" fill="#e2e8f0" font-size="13">tezlashish</text>
  <text x="710" y="222" fill="#fbbf24" font-size="12" font-family="Consolas, monospace">.extend()  .index()</text>

  <rect x="30" y="252" width="820" height="94" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="52" y="280" fill="#38bdf8" font-size="17" font-weight="bold">💡 Python'da HAR BIR qiymat — OBYEKT</text>
