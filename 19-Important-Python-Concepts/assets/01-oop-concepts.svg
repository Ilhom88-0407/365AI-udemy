  <text x="52" y="334" fill="#94a3b8" font-size="14">"Ular haqida MANTIQIY obyektlar deb o'ylang."</text>

  <rect x="30" y="366" width="400" height="140" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
