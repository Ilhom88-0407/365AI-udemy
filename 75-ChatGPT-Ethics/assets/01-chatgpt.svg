<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" width="960" height="770" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="770" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">"Manba so'rang" muammoni hal qilmaydi — uni KO'CHIRADI</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">tokenlar · maxfiylik · siyosat · dezinformatsiya · plagiat · ekologiya</text>

  <!-- 1. manbalar -->
  <rect x="24" y="74" width="450" height="220" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="249" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">8 TA MANBA — HAMMASI MUKAMMAL FORMATDA</text>
  <text x="44" y="122" fill="#94a3b8" font-size="11">Kurs: "chatdan manba so'rang". So'radik:</text>
  <line x1="44" y1="130" x2="454" y2="130" stroke="#475569" stroke-width="1"/>
  <text x="44" y="152" fill="#cbd5e1" font-size="10.5" font-family="Consolas, monospace">"Hiring Algorithms: An Overview"</text>
  <text x="44" y="168" fill="#cbd5e1" font-size="10.5" font-family="Consolas, monospace">  by David M. Blei, 2017.</text>
  <line x1="44" y1="182" x2="454" y2="182" stroke="#475569" stroke-width="1"/>
  <text x="44" y="204" fill="#fbbf24" font-size="11">Blei — mavzuli modellashtirish (LDA) olimi.</text>
  <text x="44" y="222" fill="#f87171" font-size="11.5" font-weight="700">Haqiqiy ism + boshqa soha = eng ishonchli</text>
  <text x="44" y="238" fill="#f87171" font-size="11.5" font-weight="700">gallyutsinatsiya. Ismni qidirsangiz — TOPASIZ.</text>
  <text x="44" y="262" fill="#94a3b8" font-size="11">k-anonimlikda: Latanya Sweeney (2002) —</text>
  <text x="44" y="280" fill="#f87171" font-size="11">kanonik manba UMUMAN tilga olinmadi.</text>

  <!-- 2. plagiat -->
  <rect x="486" y="74" width="450" height="220" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="711" y="98" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">PARAFRAZ = BEGONA MATN (detektor uchun)</text>
  <text x="506" y="122" fill="#94a3b8" font-size="11">n-gramma ustma-ustligi:</text>
  <line x1="506" y1="130" x2="916" y2="130" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="506" y="152" fill="#cbd5e1">n</text>
    <text x="560" y="152" fill="#cbd5e1">nusxa</text>
    <text x="650" y="152" fill="#cbd5e1">tahrir</text>
    <text x="740" y="152" fill="#cbd5e1">parafraz</text>
    <text x="850" y="152" fill="#cbd5e1">begona</text>
    <text x="506" y="172" fill="#94a3b8">3</text>
    <text x="560" y="172" fill="#4ade80">1.00</text>
    <text x="650" y="172" fill="#fbbf24">0.80</text>
    <text x="740" y="172" fill="#f87171">0.00</text>
    <text x="850" y="172" fill="#f87171">0.00</text>
    <text x="506" y="192" fill="#94a3b8">5</text>
    <text x="560" y="192" fill="#4ade80">1.00</text>
    <text x="650" y="192" fill="#fbbf24">0.67</text>
    <text x="740" y="192" fill="#f87171">0.00</text>
    <text x="850" y="192" fill="#f87171">0.00</text>
    <text x="506" y="212" fill="#94a3b8">10</text>
    <text x="560" y="212" fill="#4ade80">1.00</text>
    <text x="650" y="212" fill="#fbbf24">0.15</text>
    <text x="740" y="212" fill="#f87171">0.00</text>
    <text x="850" y="212" fill="#f87171">0.00</text>
  </g>
  <line x1="506" y1="226" x2="916" y2="226" stroke="#475569" stroke-width="1"/>
  <text x="506" y="248" fill="#fde68a" font-size="11.5" font-weight="700">Kurs: parafraz va yamoq — ENG KO'P beixtiyor.</text>
  <text x="506" y="266" fill="#f87171" font-size="11.5" font-weight="700">Detektor ayni shularni O'TKAZIB YUBORADI.</text>
  <text x="506" y="286" fill="#94a3b8" font-size="11">Hech qanday n yordam bermaydi — usulning cheklovi.</text>

  <!-- 3. ekologiya -->
  <rect x="24" y="306" width="450" height="212" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="249" y="330" fill="#bfdbfe" font-size="14" font-weight="700" text-anchor="middle">O'QITISH EMAS — ISHLATISH</text>
  <text x="44" y="352" fill="#94a3b8" font-size="11">Kursning O'Z raqamlari bilan (1 mlrd so'rov/kun):</text>
  <line x1="44" y1="360" x2="454" y2="360" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="382" fill="#cbd5e1">Wh/so'rov</text>
    <text x="200" y="382" fill="#cbd5e1">yillik t CO2</text>
    <text x="350" y="382" fill="#cbd5e1">o'qitishga</text>
    <text x="44" y="402" fill="#94a3b8">0.1</text>
    <text x="200" y="402" fill="#fbbf24">14,600</text>
    <text x="350" y="402" fill="#f87171">29.2x</text>
    <text x="44" y="420" fill="#94a3b8">0.3</text>
    <text x="200" y="420" fill="#fbbf24">43,800</text>
    <text x="350" y="420" fill="#f87171">87.6x</text>
    <text x="44" y="438" fill="#94a3b8">3.0</text>
    <text x="200" y="438" fill="#f87171">438,000</text>
    <text x="350" y="438" fill="#f87171">876x</text>
  </g>
  <line x1="44" y1="452" x2="454" y2="452" stroke="#475569" stroke-width="1"/>
  <text x="44" y="474" fill="#bfdbfe" font-size="11.5" font-weight="700">HAR taxminda ishlatish g'olib — xulosa</text>
  <text x="44" y="490" fill="#bfdbfe" font-size="11.5" font-weight="700">taxmindan MUSTAQIL.</text>
  <text x="44" y="510" fill="#94a3b8" font-size="11">Energiya manbasi: 3,285 t (gidro) vs 87,600 t (ko'mir) = 26.7x</text>

  <!-- 4. maxfiylik -->
  <rect x="486" y="306" width="450" height="212" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="711" y="330" fill="#bbf7d0" font-size="14" font-weight="700" text-anchor="middle">TAHRIRLASH — 8/8 TOZALANDI</text>
  <text x="506" y="352" fill="#94a3b8" font-size="11">Va har biri HAMON javob beriladigan savol:</text>
  <line x1="506" y1="360" x2="916" y2="360" stroke="#475569" stroke-width="1"/>
  <text x="506" y="382" fill="#f87171" font-size="10.5" font-family="Consolas, monospace">Card 4111 1111 1111 1111 was declined</text>
  <text x="506" y="400" fill="#4ade80" font-size="10.5" font-family="Consolas, monospace">Card [KARTA] was declined, why?</text>
  <text x="506" y="424" fill="#f87171" font-size="10.5" font-family="Consolas, monospace">My db password: hunter2 — why fail?</text>
  <text x="506" y="442" fill="#4ade80" font-size="10.5" font-family="Consolas, monospace">My db [PAROL] — why does it fail?</text>
  <line x1="506" y1="456" x2="916" y2="456" stroke="#475569" stroke-width="1"/>
  <text x="506" y="478" fill="#bbf7d0" font-size="11.5" font-weight="700">Nozik qism savolning MA'NOSIGA kirmaydi.</text>
  <text x="506" y="498" fill="#94a3b8" font-size="11">Bloklash emas — tahrirlash. Bloklansa, boshqa</text>
  <text x="506" y="514" fill="#94a3b8" font-size="11">vositada baribir yuboriladi.</text>

  <!-- 5. strip -->
  <rect x="24" y="530" width="912" height="136" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="554" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">MODULDA O'LCHANGAN BOSHQA NARSALAR</text>
  <line x1="44" y1="564" x2="916" y2="564" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="588" fill="#94a3b8">o'zbekcha -&gt; ['o', "'z", 'bek', 'cha']</text>
    <text x="400" y="588" fill="#f87171">4 token</text>
    <text x="44" y="610" fill="#94a3b8">apostrof jarimasi</text>
    <text x="400" y="610" fill="#f87171">+45%</text>
    <text x="44" y="632" fill="#94a3b8">alohida so'zlarda til jarimasi</text>
    <text x="400" y="632" fill="#f87171">2.14x</text>
    <text x="620" y="588" fill="#94a3b8">Ilhom Islomov</text>
    <text x="830" y="588" fill="#fbbf24">5 token</text>
    <text x="620" y="610" fill="#94a3b8">Model tanlash tejashi</text>
    <text x="830" y="610" fill="#4ade80">73%</text>
    <text x="620" y="632" fill="#94a3b8">200 so'rov/kun (shaxsiy)</text>
    <text x="830" y="632" fill="#4ade80">8.76 kg/yil</text>
  </g>

  <!-- 6. rule -->
  <rect x="24" y="682" width="912" height="72" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="710" fill="#fde68a" font-size="15" font-weight="700" text-anchor="middle">MANBA SO'RAMANG — MANBADAN BOSHLANG</text>
  <text x="480" y="734" fill="#94a3b8" font-size="12" text-anchor="middle">Va "Enter" dan oldin tekshiring: kompaniya siyosatiga emas, O'Z jarayoningizga tayaning.</text>
</svg>
