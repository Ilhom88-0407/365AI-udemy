<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="790" fill="#0f172a" rx="14"/>
  <text x="480" y="32" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">AI sudya 50% aniqlik berdi — chunki u hammaga bir xil javob qaytardi</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">mualliflik · rozilik · kalibrlash · nomuvofiqlik · gallyutsinatsiya · monitoring</text>

  <!-- 1. AI sudya -->
  <rect x="24" y="74" width="450" height="222" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="249" y="98" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">UCHTA IFODA — UCHTA DOIMIY JAVOB</text>
  <text x="44" y="124" fill="#94a3b8" font-size="11.5">10 da'vo: 5 rost, 5 yolg'on. Qwen2.5-0.5B sudya:</text>
  <line x1="44" y1="132" x2="454" y2="132" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11">
    <text x="44" y="152" fill="#cbd5e1">ifoda</text>
    <text x="250" y="152" fill="#cbd5e1">aniqlik</text>
    <text x="330" y="152" fill="#cbd5e1">yolg'on recall</text>
    <text x="44" y="174" fill="#94a3b8">TRUE / FALSE</text>
    <text x="250" y="174" fill="#fbbf24">50%</text>
    <text x="330" y="174" fill="#f87171">0%</text>
    <text x="44" y="194" fill="#94a3b8">xato bormi? YES/NO</text>
    <text x="250" y="194" fill="#fbbf24">50%</text>
    <text x="330" y="194" fill="#f87171">100% / rost 0%</text>
    <text x="44" y="214" fill="#94a3b8">chop etasizmi?</text>
    <text x="250" y="214" fill="#fbbf24">50%</text>
    <text x="330" y="214" fill="#f87171">0%</text>
  </g>
  <line x1="44" y1="228" x2="454" y2="228" stroke="#475569" stroke-width="1"/>
  <text x="44" y="250" fill="#fca5a5" font-size="11.5" font-weight="700">Hech biri da'volarni AJRATMADI.</text>
  <text x="44" y="272" fill="#bbf7d0" font-size="11.5" font-family="Consolas, monospace">if len(set(hukmlar)) == 1: BUZUQ</text>
  <text x="44" y="288" fill="#86efac" font-size="10.5">— modulning eng muhim qatori</text>

  <!-- 2. gallyutsinatsiya -->
  <rect x="486" y="74" width="450" height="222" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="711" y="98" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">MANGO TAJRIBASI — AYNAN TAKRORLANDI</text>
  <text x="506" y="122" fill="#94a3b8" font-size="11">Soxta asos berilgan savol:</text>
  <text x="506" y="142" fill="#fca5a5" font-size="10.5" font-family="Consolas, monospace">"Mexico produces over 90% of the world's</text>
  <text x="506" y="157" fill="#fca5a5" font-size="10.5" font-family="Consolas, monospace"> mango crop... for centuries."</text>
  <text x="506" y="180" fill="#94a3b8" font-size="11">Ochiq savol, o'sha model:</text>
  <text x="506" y="200" fill="#86efac" font-size="10.5" font-family="Consolas, monospace">"The world's top mango producer is India."</text>
  <line x1="506" y1="214" x2="916" y2="214" stroke="#475569" stroke-width="1"/>
  <text x="506" y="236" fill="#fde68a" font-size="11.5" font-weight="700">"90%" va "centuries" — savolda YO'Q EDI.</text>
  <text x="506" y="254" fill="#94a3b8" font-size="11">Model soxta asosga YANGI "dalil" qo'shdi (haqiqatda ~5%).</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="506" y="280" fill="#94a3b8">8 ta soxta asos -></text>
    <text x="700" y="280" fill="#f87171">7 tasi QABUL QILINDI (88%)</text>
  </g>

  <!-- 3. kalibrlash -->
  <rect x="24" y="308" width="450" height="214" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="249" y="332" fill="#bfdbfe" font-size="14" font-weight="700" text-anchor="middle">GURUH BO'YICHA KALIBRLASH</text>
  <text x="44" y="354" fill="#94a3b8" font-size="11">1200 qaror. Model "0.93 ishonchim komil" desa, haqiqatda:</text>
  <line x1="44" y1="362" x2="454" y2="362" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="384" fill="#cbd5e1">ishonch</text>
    <text x="160" y="384" fill="#cbd5e1">A aniqlik</text>
    <text x="290" y="384" fill="#cbd5e1">B aniqlik</text>
    <text x="44" y="404" fill="#94a3b8">0.57</text>
    <text x="160" y="404" fill="#4ade80">0.52</text>
    <text x="290" y="404" fill="#f87171">0.37</text>
    <text x="44" y="422" fill="#94a3b8">0.68</text>
    <text x="160" y="422" fill="#4ade80">0.66</text>
    <text x="290" y="422" fill="#f87171">0.49</text>
    <text x="44" y="440" fill="#94a3b8">0.81</text>
    <text x="160" y="440" fill="#4ade80">0.79</text>
    <text x="290" y="440" fill="#f87171">0.59</text>
    <text x="44" y="458" fill="#94a3b8">0.93</text>
    <text x="160" y="458" fill="#4ade80">0.94</text>
    <text x="290" y="458" fill="#f87171">0.69</text>
  </g>
  <line x1="44" y1="472" x2="454" y2="472" stroke="#475569" stroke-width="1"/>
  <text x="44" y="492" fill="#bfdbfe" font-size="11.5" font-weight="700">Ortiqcha ishonch:  A = +0.020   B = +0.216</text>
  <text x="44" y="512" fill="#fbbf24" font-size="11">Farq ISHONCH OSHGAN SARI kattalashadi (+0.20 -&gt; +0.24).</text>

  <!-- 4. nomuvofiqlik -->
  <rect x="486" y="308" width="450" height="214" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="711" y="332" fill="#fecaca" font-size="14" font-weight="700" text-anchor="middle">NOMUVOFIQLIK — do_sample=False BILAN</text>
  <text x="506" y="354" fill="#94a3b8" font-size="11">Bitta savol, 8 xil ifoda, TASODIFIYLIK YO'Q:</text>
  <line x1="506" y1="362" x2="916" y2="362" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="506" y="384" fill="#94a3b8">HA</text>
    <text x="600" y="384" fill="#fbbf24">3</text>
    <text x="506" y="404" fill="#94a3b8">YO'Q</text>
    <text x="600" y="404" fill="#f87171">5</text>
    <text x="506" y="428" fill="#94a3b8">nomuvofiqlik</text>
    <text x="700" y="428" fill="#f87171">37.5%</text>
    <text x="506" y="448" fill="#94a3b8">metrika tuzatilgach</text>
    <text x="700" y="448" fill="#f87171">50.0%</text>
  </g>
  <rect x="600" y="376" width="72" height="10" fill="#fbbf24" opacity="0.5"/>
  <rect x="600" y="396" width="120" height="10" fill="#f87171" opacity="0.5"/>
  <line x1="506" y1="462" x2="916" y2="462" stroke="#475569" stroke-width="1"/>
  <text x="506" y="484" fill="#fca5a5" font-size="11.5" font-weight="700">Manba tasodifiylik EMAS — savolning IFODASI.</text>
  <text x="506" y="506" fill="#94a3b8" font-size="11">Kurs tajribasi ham takrorlandi (teskari tomonda).</text>

  <!-- 5. strip -->
  <rect x="24" y="534" width="912" height="148" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="558" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">MODULDA O'LCHANGAN BOSHQA NARSALAR</text>
  <line x1="44" y1="568" x2="916" y2="568" stroke="#475569" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="44" y="592" fill="#94a3b8">Huquqiy rozilik matni (Flesch)</text>
    <text x="400" y="592" fill="#f87171">-9.9  (shkala 0-100)</text>
    <text x="44" y="614" fill="#94a3b8">Bir xil ma'no, oddiy tilda</text>
    <text x="400" y="614" fill="#4ade80">101.7</text>
    <text x="44" y="636" fill="#94a3b8">Rozilik yozuvi auditi</text>
    <text x="400" y="636" fill="#f87171">3/7</text>
    <text x="44" y="658" fill="#94a3b8">Model karta (bizning ilova)</text>
    <text x="400" y="658" fill="#f87171">1/8</text>
    <text x="620" y="592" fill="#94a3b8">Yodlash (4 klassik matn)</text>
    <text x="850" y="592" fill="#fbbf24">0/4</text>
    <text x="620" y="614" fill="#94a3b8">Asosni tekshir ko'rsatmasi</text>
    <text x="850" y="614" fill="#fbbf24">12% -&gt; 62%</text>
    <text x="620" y="636" fill="#94a3b8">85% aniqlik uchun tasdiq</text>
    <text x="850" y="636" fill="#f87171">A=315  B=17</text>
    <text x="620" y="658" fill="#94a3b8">Monitoring paneli</text>
    <text x="850" y="658" fill="#f87171">5/5 buzildi</text>
  </g>

  <!-- 6. rule -->
  <rect x="24" y="698" width="912" height="76" rx="12" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="726" fill="#bbf7d0" font-size="15" font-weight="700" text-anchor="middle">ETIKA — HISOBOT EMAS. ETIKA — RELIZNI TO'XTATADIGAN AssertionError.</text>
  <text x="480" y="750" fill="#86efac" font-size="12" text-anchor="middle">Nomuvofiqlik, soxta asos va sudya sog'ligi — har relizda, CI/CD da.</text>
  <text x="480" y="768" fill="#94a3b8" font-size="11" text-anchor="middle">Monitoring tizimining O'ZI ham monitoring qilinishi kerak.</text>
</svg>
