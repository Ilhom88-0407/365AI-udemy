<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="440" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Q, K, V — kutubxona o'xshatishi</text>

  <!-- Q -->
  <rect x="30" y="60" width="262" height="130" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="161" y="88" fill="#e0f2fe" font-size="15" font-weight="700" text-anchor="middle">🔍 QUERY  (so'rov)</text>
  <line x1="52" y1="98" x2="270" y2="98" stroke="#0369a1"/>
  <text x="161" y="120" fill="#bae6fd" font-size="12.5" text-anchor="middle">"Menga NIMA kerak?"</text>
  <text x="161" y="145" fill="#7dd3fc" font-size="12" text-anchor="middle">sizning SAVOLINGIZ</text>
  <text x="161" y="172" fill="#38bdf8" font-size="11.5" text-anchor="middle">q_lin(x)  →  hozirgi token</text>

  <!-- K -->
  <rect x="309" y="60" width="262" height="130" rx="12" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
  <text x="440" y="88" fill="#f5f3ff" font-size="15" font-weight="700" text-anchor="middle">🔑 KEY  (kalit)</text>
  <line x1="331" y1="98" x2="549" y2="98" stroke="#6d28d9"/>
  <text x="440" y="120" fill="#ddd6fe" font-size="12.5" text-anchor="middle">"Menda NIMA bor?"</text>
  <text x="440" y="145" fill="#c4b5fd" font-size="12" text-anchor="middle">kitob SARLAVHASI</text>
  <text x="440" y="172" fill="#a78bfa" font-size="11.5" text-anchor="middle">k_lin(x)  →  har token</text>

  <!-- V -->
  <rect x="588" y="60" width="262" height="130" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="719" y="88" fill="#dcfce7" font-size="15" font-weight="700" text-anchor="middle">💎 VALUE  (qiymat)</text>
  <line x1="610" y1="98" x2="828" y2="98" stroke="#166534"/>
  <text x="719" y="120" fill="#bbf7d0" font-size="12.5" text-anchor="middle">HAQIQIY MAZMUN</text>
  <text x="719" y="145" fill="#86efac" font-size="12" text-anchor="middle">kitobning ICHIDAGI matn</text>
  <text x="719" y="172" fill="#4ade80" font-size="11.5" text-anchor="middle">v_lin(x)  →  har token</text>

  <!-- process -->
  <rect x="30" y="208" width="820" height="118" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="440" y="232" fill="#cbd5e1" font-size="13.5" font-weight="700" text-anchor="middle">JARAYON</text>
  <text x="60" y="260" fill="#94a3b8" font-size="12.5">①  savolni har sarlavha bilan solishtir</text>
  <text x="430" y="260" fill="#7dd3fc" font-size="12.5" font-family="Consolas, monospace">Q · Kᵀ / √d_k</text>
  <text x="60" y="285" fill="#94a3b8" font-size="12.5">②  har kitobga BALL ber (yig'indi = 1)</text>
  <text x="430" y="285" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">softmax(...)</text>
  <text x="60" y="310" fill="#94a3b8" font-size="12.5">③  ballari yuqorilardan KO'PROQ o'qi</text>
  <text x="430" y="310" fill="#86efac" font-size="12.5" font-family="Consolas, monospace">... · V</text>

  <!-- multi-head -->
  <rect x="30" y="342" width="404" height="82" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="232" y="364" fill="#dbeafe" font-size="13" font-weight="700" text-anchor="middle">NIMA UCHUN 12 BOSH?</text>
  <text x="52" y="386" fill="#93c5fd" font-size="11.5">qatlam 1, bosh 0  →  "keyingi so'z"    (POZITSION)</text>
  <text x="52" y="404" fill="#93c5fd" font-size="11.5">qatlam 5, bosh 5  →  "it → times"      (MA'NO)</text>
  <text x="52" y="419" fill="#fbbf24" font-size="11">har bosh BOSHQA naqshni o'rganadi</text>

  <rect x="446" y="342" width="404" height="82" rx="11" fill="#450a0a" stroke="#f87171" stroke-width="1.8"/>
  <text x="648" y="364" fill="#fee2e2" font-size="13" font-weight="700" text-anchor="middle">⚠️ BOSHLARNI O'RTACHA QILMANG</text>
  <text x="468" y="386" fill="#fca5a5" font-size="11.5">12 boshning o'rtachasi  →  it→times = 0.081  ❌</text>
  <text x="468" y="404" fill="#86efac" font-size="11.5">qatlam 5, BOSH 5        →  it→times = 0.584  ✅</text>
  <text x="468" y="419" fill="#fbbf24" font-size="11">o'rtacha olish = ma'lumotni YO'Q QILISH (7×)</text>
</svg>
