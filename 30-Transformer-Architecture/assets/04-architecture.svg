  <text x="217" y="140" fill="#94a3b8" font-size="11.5" text-anchor="middle">"men NIMA o'qidim?"</text>

  <rect x="78" y="152" width="278" height="42" rx="8" fill="#164e63" stroke="#22d3ee"/>
  <text x="217" y="171" fill="#cffafe" font-size="12.5" text-anchor="middle">Input Embedding + Pozitsion</text>
  <text x="217" y="187" fill="#67e8f9" font-size="10.5" text-anchor="middle">5-DARS · (30522,768) + (512,768)</text>

  <rect x="78" y="206" width="278" height="52" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="217" y="227" fill="#dbeafe" font-size="13" font-weight="700" text-anchor="middle">Multi-Head Attention</text>
  <text x="217" y="245" fill="#93c5fd" font-size="10.5" text-anchor="middle">6-DARS ⭐ · 12 bosh × d_k=64 · 21.4%</text>

  <rect x="78" y="266" width="278" height="24" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="217" y="282" fill="#cbd5e1" font-size="11" text-anchor="middle">Add &amp; Norm  (sa_layer_norm)</text>

  <rect x="78" y="298" width="278" height="46" rx="8" fill="#3b0764" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="217" y="317" fill="#ede9fe" font-size="13" font-weight="700" text-anchor="middle">Feed-Forward</text>
  <text x="217" y="334" fill="#c4b5fd" font-size="10.5" text-anchor="middle">7-DARS · 768→3072→768 · 42.7%</text>

  <rect x="78" y="352" width="278" height="22" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="217" y="367" fill="#cbd5e1" font-size="11" text-anchor="middle">Add &amp; Norm  ·  ⟳ × 6 qatlam</text>

  <!-- DECODER -->
  <rect x="498" y="96" width="330" height="290" rx="13" fill="#052e16" stroke="#4ade80" stroke-width="2.2"/>
  <text x="663" y="122" fill="#86efac" font-size="15" font-weight="700" text-anchor="middle">🟢 DECODER</text>
  <text x="663" y="140" fill="#94a3b8" font-size="11.5" text-anchor="middle">"men NIMA yozaman?"</text>

  <rect x="524" y="152" width="278" height="42" rx="8" fill="#164e63" stroke="#22d3ee"/>
  <text x="663" y="171" fill="#cffafe" font-size="12.5" text-anchor="middle">Output Embedding + Pozitsion</text>
  <text x="663" y="187" fill="#67e8f9" font-size="10.5" text-anchor="middle">5-DARS</text>

  <rect x="524" y="206" width="278" height="52" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="1.8"/>
  <text x="663" y="227" fill="#fee2e2" font-size="13" font-weight="700" text-anchor="middle">MASKED Multi-Head Attention</text>
  <text x="663" y="245" fill="#fca5a5" font-size="10.5" text-anchor="middle">8-DARS · kelajak YASHIRIN (pastki uchburchak)</text>

  <rect x="524" y="266" width="278" height="52" rx="8" fill="#166534" stroke="#4ade80" stroke-width="1.8"/>
  <text x="663" y="287" fill="#dcfce7" font-size="13" font-weight="700" text-anchor="middle">CROSS-Attention</text>
  <text x="663" y="305" fill="#86efac" font-size="10.5" text-anchor="middle">9-DARS · encoder'ga qaraydi</text>

  <rect x="524" y="326" width="278" height="46" rx="8" fill="#3b0764" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="663" y="345" fill="#ede9fe" font-size="13" font-weight="700" text-anchor="middle">Feed-Forward</text>
  <text x="663" y="362" fill="#c4b5fd" font-size="10.5" text-anchor="middle">7-DARS · ⟳ × N qatlam</text>

  <!-- encoder -> decoder -->
  <path d="M382 292 L520 292" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#y)"/>
  <text x="450" y="284" fill="#fde68a" font-size="11" text-anchor="middle">kontekst</text>

  <!-- inputs -->
  <text x="217" y="82" fill="#cbd5e1" font-size="12.5" text-anchor="middle">🇫🇷 KIRISH (manba matn)</text>
  <text x="663" y="82" fill="#cbd5e1" font-size="12.5" text-anchor="middle">🇬🇧 CHIQISH (hozirgacha yozilgan)</text>

  <!-- output head -->
  <path d="M663 372 L663 398" stroke="#4ade80" stroke-width="2.5" fill="none" marker-end="url(#g2)"/>
  <rect x="524" y="400" width="278" height="26" rx="7" fill="#1e293b" stroke="#94a3b8"/>
  <text x="663" y="418" fill="#e2e8f0" font-size="11.5" text-anchor="middle">Linear  768 → 50 257  (lug'at)</text>
  <rect x="524" y="430" width="278" height="26" rx="7" fill="#451a03" stroke="#f59e0b"/>
  <text x="663" y="448" fill="#fde68a" font-size="11.5" text-anchor="middle">Softmax  →  ehtimolliklar (yig'indi = 1.0)</text>

  <path d="M806 443 Q848 443 848 300 Q848 176 806 176" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
  <text x="866" y="310" fill="#fbbf24" font-size="10.5" text-anchor="middle" transform="rotate(90 866 310)">avtoregressiv</text>

  <defs>
    <marker id="y" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <marker id="g2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
