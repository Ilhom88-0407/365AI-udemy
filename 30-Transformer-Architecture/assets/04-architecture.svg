<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="500" fill="#0f172a" rx="14"/>
  <text x="440" y="34" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Transformer arxitekturasi — to'liq xarita</text>

  <!-- ENCODER -->
  <rect x="52" y="96" width="330" height="290" rx="13" fill="#0c2340" stroke="#38bdf8" stroke-width="2.2"/>
