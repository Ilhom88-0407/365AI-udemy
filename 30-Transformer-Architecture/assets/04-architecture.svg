  <rect x="52" y="400" width="330" height="56" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="217" y="420" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">UCHTA OILA</text>
  <text x="217" y="437" fill="#cbd5e1" font-size="11">🔵 faqat encoder → BERT (tushunish)</text>
