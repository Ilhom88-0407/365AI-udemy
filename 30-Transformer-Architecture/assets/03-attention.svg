<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="380" fill="#0f172a" rx="14"/>
  <text x="440" y="36" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">E'tibor mexanizmi — to'rt qadam</text>
  <text x="440" y="57" fill="#94a3b8" font-size="12.5" text-anchor="middle">Attention(Q, K, V) = softmax( Q·Kᵀ / √d_k ) · V</text>

  <!-- steps -->
  <rect x="26" y="76" width="196" height="118" rx="11" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="124" y="100" fill="#e0f2fe" font-size="13.5" font-weight="700" text-anchor="middle">① Q · Kᵀ</text>
  <line x1="46" y1="110" x2="202" y2="110" stroke="#0369a1"/>
  <text x="124" y="132" fill="#bae6fd" font-size="12" text-anchor="middle">o'xshashlik ballari</text>
  <text x="124" y="154" fill="#7dd3fc" font-size="11.5" text-anchor="middle">"qaysi so'z menga</text>
  <text x="124" y="170" fill="#7dd3fc" font-size="11.5" text-anchor="middle">o'xshaydi?"</text>
  <text x="124" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">-5.43 .. 9.17</text>

  <rect x="234" y="76" width="196" height="118" rx="11" fill="#3b0764" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="332" y="100" fill="#f5f3ff" font-size="13.5" font-weight="700" text-anchor="middle">② ÷ √d_k</text>
  <line x1="254" y1="110" x2="410" y2="110" stroke="#6d28d9"/>
  <text x="332" y="132" fill="#ddd6fe" font-size="12" text-anchor="middle">masshtablash</text>
  <text x="332" y="154" fill="#c4b5fd" font-size="11.5" text-anchor="middle">softmax "o'lib"</text>
  <text x="332" y="170" fill="#c4b5fd" font-size="11.5" text-anchor="middle">qolmasligi uchun</text>
  <text x="332" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">-0.68 .. 1.15</text>

  <rect x="442" y="76" width="196" height="118" rx="11" fill="#451a03" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="540" y="100" fill="#fef3c7" font-size="13.5" font-weight="700" text-anchor="middle">③ softmax</text>
  <line x1="462" y1="110" x2="618" y2="110" stroke="#92400e"/>
  <text x="540" y="132" fill="#fde68a" font-size="12" text-anchor="middle">ehtimolliklar</text>
  <text x="540" y="154" fill="#fcd34d" font-size="11.5" text-anchor="middle">yig'indisi = 1.0</text>
  <text x="540" y="176" fill="#fcd34d" font-size="11.5" text-anchor="middle">maks 0.95 → 0.48</text>

  <rect x="650" y="76" width="204" height="118" rx="11" fill="#14532d" stroke="#4ade80" stroke-width="1.8"/>
  <text x="752" y="100" fill="#dcfce7" font-size="13.5" font-weight="700" text-anchor="middle">④ × V</text>
  <line x1="670" y1="110" x2="834" y2="110" stroke="#166534"/>
  <text x="752" y="132" fill="#bbf7d0" font-size="12" text-anchor="middle">og'irlangan yig'indi</text>
  <text x="752" y="154" fill="#86efac" font-size="11.5" text-anchor="middle">= NATIJA</text>
  <text x="752" y="176" fill="#86efac" font-size="11.5" text-anchor="middle">kontekstga moslashgan</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M222 135 L232 135"/><path d="M430 135 L440 135"/><path d="M638 135 L648 135"/>
  </g>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker></defs>

  <!-- real example -->
  <rect x="26" y="212" width="828" height="94" rx="11" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <text x="440" y="236" fill="#86efac" font-size="13.5" font-weight="700" text-anchor="middle">💥 HAQIQIY MODELDA O'LCHANGAN (distilbert, qatlam 5, bosh 5)</text>
  <text x="60" y="262" fill="#cbd5e1" font-size="12.5">"The New York Times is a daily newspaper.  It  was first issued in 1851."</text>
  <text x="60" y="288" fill="#94a3b8" font-size="12">"it" e'tibori:</text>
  <rect x="150" y="276" width="330" height="16" rx="3" fill="#166534"/>
  <text x="490" y="288" fill="#86efac" font-size="12">times   0.584</text>
  <rect x="600" y="276" width="28" height="16" rx="3" fill="#334155"/>
  <text x="638" y="288" fill="#64748b" font-size="12">york 0.050 · new 0.049</text>

  <rect x="26" y="322" width="828" height="42" rx="9" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="340" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">🇺🇿 So'z tartibi muammosi o'zbek tilida ham bor</text>
  <text x="440" y="357" fill="#cbd5e1" font-size="12" text-anchor="middle">"I read the book" (SVO) → "Men kitobni o'qidim" (SOV) — fe'l OXIRGA ko'chadi</text>
</svg>
